    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFB87A" stop-opacity=".55"/><stop offset="55%" stop-color="#FFB87A" stop-opacity=".12"/><stop offset="100%" stop-color="#FFB87A" stop-opacity="0"/></radialGradient>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sentient responding avatar</title>
  <desc id="desc">The Sentient atom replies or speaks as electrons orbit, inner warmth responds, and concentric ember signals expand.</desc>
  <defs>
    <radialGradient id="nuc" cx="40%" cy="36%" r="70%"><stop offset="0%" stop-color="#FFE1BD"/><stop offset="35%" stop-color="#FFB87A"/><stop offset="78%" stop-color="#F2A06A"/><stop offset="100%" stop-color="#B85530"/></radialGradient>
    <radialGradient id="voice" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFE1BD" stop-opacity=".52"/><stop offset="38%" stop-color="#FFB87A" stop-opacity=".22"/><stop offset="100%" stop-color="#B85530" stop-opacity="0"/></radialGradient>
    <radialGradient id="elec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFF3DB"/><stop offset="55%" stop-color="#FFE1BD"/><stop offset="100%" stop-color="#FFB87A" stop-opacity=".4"/></radialGradient>
    <radialGradient id="plate" cx="42%" cy="38%" r="58%"><stop offset="0%" stop-color="#FFB87A" stop-opacity=".3"/><stop offset="42%" stop-color="#F2A06A" stop-opacity=".14"/><stop offset="82%" stop-color="#B85530" stop-opacity=".04"/><stop offset="100%" stop-color="#B85530" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="8" y1="7" x2="57" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE1BD" stop-opacity=".94"/><stop offset=".34" stop-color="#F2A06A" stop-opacity=".74"/><stop offset=".72" stop-color="#C86D42" stop-opacity=".4"/><stop offset="1" stop-color="#8E432C" stop-opacity=".12"/></linearGradient>
    <filter id="rimGlowSoft" x="-28%" y="-28%" width="156%" height="156%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="rimGlowHot" x="-22%" y="-22%" width="144%" height="144%"><feGaussianBlur stdDeviation=".72"/></filter>
  </defs>
  <style>
    .voice-field{transform-box:view-box;transform-origin:32px 32px;animation:voice-field 1.55s ease-in-out infinite}.voice-wave{transform-box:view-box;transform-origin:32px 32px;animation:voice-wave 2.4s cubic-bezier(.2,.62,.32,1) infinite}.voice-wave.mid{animation-delay:.8s}.voice-wave.far{animation-delay:1.6s}.rim-aura{transform-box:view-box;transform-origin:32px 32px;animation:rim-aura 1.55s ease-in-out infinite}.rim-hot{transform-box:view-box;transform-origin:32px 32px;animation:rim-hot 1.55s ease-in-out infinite}.rim-live{transform-box:view-box;transform-origin:32px 32px;animation:rim-live 1.55s ease-in-out infinite}.electron-static{display:none}
    @keyframes voice-field{0%,100%{transform:scale(.92);opacity:.58}24%{transform:scale(1.1);opacity:1}48%{transform:scale(.98);opacity:.72}72%{transform:scale(1.05);opacity:.9}}
    @keyframes voice-wave{0%{transform:scale(.7);opacity:0;stroke-width:1.8}20%{opacity:.7}78%{opacity:.14}100%{transform:scale(1.08);opacity:0;stroke-width:.7}}
    @keyframes rim-aura{0%,100%{transform:scale(.985);opacity:.16;stroke:#B85530}24%{transform:scale(1.025);opacity:.82;stroke:#FFB87A}48%{transform:scale(.995);opacity:.3;stroke:#C86D42}72%{transform:scale(1.015);opacity:.62;stroke:#F2A06A}}
    @keyframes rim-hot{0%,100%{opacity:.12;stroke-width:2.8;stroke:#C86D42}24%{opacity:.9;stroke-width:5.2;stroke:#FFE1BD}48%{opacity:.26;stroke-width:3.2;stroke:#F2A06A}72%{opacity:.68;stroke-width:4.5;stroke:#FFB87A}}
    @keyframes rim-live{0%,100%{opacity:.68;stroke-width:2.8}24%{opacity:1;stroke-width:3.7}48%{opacity:.76;stroke-width:3}72%{opacity:.94;stroke-width:3.45}}
    @media (prefers-reduced-motion:reduce){.voice-field,.voice-wave,.rim-aura,.rim-hot,.rim-live{animation:none}.voice-field{opacity:.82}.voice-wave{opacity:.2}.voice-wave.mid{opacity:.13}.voice-wave.far{opacity:.08}.rim-aura{opacity:.2}.rim-hot{opacity:.18}.rim-live{opacity:.82}.electron-motion{display:none}.electron-static{display:inline}}
  </style>
  <circle cx="32" cy="32" r="31" fill="url(#plate)"/>
  <circle class="voice-field" cx="32" cy="32" r="22" fill="url(#voice)"/>
  <g fill="none" stroke="url(#rim)" stroke-linecap="round">
    <circle class="voice-wave near" cx="32" cy="32" r="25" stroke-width="1.8"/>
    <circle class="voice-wave mid" cx="32" cy="32" r="25" stroke-width="1.45"/>
    <circle class="voice-wave far" cx="32" cy="32" r="25" stroke-width="1.1"/>
  </g>
  <circle cx="32" cy="32" r="28.8" fill="none" stroke="#8E432C" stroke-opacity=".32" stroke-width="2.7"/>
  <circle class="rim-aura" cx="32" cy="32" r="28.4" fill="none" stroke="#F2A06A" stroke-width="5.4" filter="url(#rimGlowSoft)"/>
  <circle class="rim-hot" cx="32" cy="32" r="28.65" fill="none" stroke="#FFB87A" stroke-width="3.7" filter="url(#rimGlowHot)"/>
  <circle class="rim-live" cx="32" cy="32" r="28.8" fill="none" stroke="url(#rim)" stroke-width="3.05"/>
  <g stroke="#FFE1BD" stroke-width=".9" fill="none" opacity=".48"><ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(18 32 32)"/><ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(-28 32 32)"/><ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(78 32 32)"/></g>
  <circle cx="32" cy="32" r="6" fill="url(#nuc)"/><ellipse cx="30.5" cy="30" rx="2" ry="1.4" fill="#FFEBD2" opacity=".55"/>
  <g class="electron-motion"><g transform="rotate(18 32 32)"><circle r="1.4" fill="url(#elec)"><animateMotion dur="3.4s" begin="-.4s" repeatCount="indefinite" path="M55 32 A23 9 0 1 1 9 32 A23 9 0 1 1 55 32"/></circle></g><g transform="rotate(-28 32 32)"><circle r="1.1" fill="url(#elec)"><animateMotion dur="4.1s" begin="-1.9s" repeatCount="indefinite" path="M9 32 A23 9 0 1 0 55 32 A23 9 0 1 0 9 32"/></circle></g><g transform="rotate(78 32 32)"><circle r="1.6" fill="url(#elec)"><animateMotion dur="4.8s" begin="-3.2s" repeatCount="indefinite" path="M55 32 A23 9 0 1 1 9 32 A23 9 0 1 1 55 32"/></circle></g></g>
  <g class="electron-static"><circle cx="38.8" cy="42.77" r="1.4" fill="url(#elec)"/><circle cx="14.3" cy="34.43" r="1.1" fill="url(#elec)"/><circle cx="22.96" cy="14.9" r="1.6" fill="url(#elec)"/></g>
</svg>

# Host-to-internal ingress for the native gateway's confined outbound worker.
# The worker cannot publish directly from an internal-only Docker network, so
# this proxy is the only container spanning sentient-internal/external.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;
proxy_http_version 1.1;
proxy_buffering off;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_read_timeout 60s;

# Narrow HTTP API (health, POST /v1/fetch, POST /v1/search), never MCP.
server {
  listen 8090;
  client_max_body_size 16k;
  location / {
    set $outbound_worker sentient-outbound-worker:8090;
    proxy_pass http://$outbound_worker$request_uri;
  }
}

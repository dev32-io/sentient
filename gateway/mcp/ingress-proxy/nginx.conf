# ingress-proxy: the ONLY container that spans sentient-external and
# sentient-internal. It exists so every MCP can keep `internal: true` — docker
# silently drops port publishing when EVERY attached network is internal
# (verified against docker 29.2.1), so without this the native gateway could not
# reach the addons at all. The alternative, joining each MCP to
# sentient-external, downgrades fetch-mcp's egress confinement from
# network-enforced to env-advisory (HTTP_PROXY only) on the one addon whose
# whole job is dereferencing untrusted URLs. Inverse of egress-proxy: that one
# gates traffic OUT of the internal network, this one lets it IN.
#
# BAKED into sentient/ingress-proxy:local rather than seeded to the host config
# dir like tinyproxy.conf, because this is not operator policy — it is the
# routing table for the addon topology, and the seeder deliberately never
# overwrites an existing file (gateway/src/bootstrap/phase-orchestrator.ts), so a
# seeded copy would silently go stale the first time a port moved.
#
# The ports below must agree with three other places: mcp_catalog's `url` and
# the ingress-proxy template's `ports:` (both gateway/config.yaml), and each
# MCP's own EXPOSE (gateway/mcp/<name>/Dockerfile).
#
# Included into the stock image's http{} block via /etc/nginx/conf.d/.

# Docker's embedded DNS — a fixed address on every user-defined network, not a
# tunable. Load-bearing because the upstreams below resolve at REQUEST time (see
# the variable in proxy_pass): the orchestrator recreates addon containers, which
# gives them new IPs, and a name nginx resolved at startup is cached for the
# process lifetime. Without this the proxy would keep dialling a dead IP after
# any addon recreate, with no error until a tool call failed.
resolver 127.0.0.11 valid=10s ipv6=off;

# Don't advertise the nginx version on error pages.
server_tokens off;

# MCP Streamable HTTP is JSON-RPC over POST answered with text/event-stream.
# These sit at http{} level so both server blocks inherit one copy.
proxy_http_version 1.1;         # the 1.0 default cannot stream a chunked upstream response
proxy_buffering off;            # pass SSE frames straight through instead of holding them
proxy_set_header Host $host;
proxy_set_header Connection ""; # nginx sends `Connection: close` upstream by default; blank it so HTTP/1.1 keep-alive applies
# Must outlast BOTH the longest mcp_catalog timeout (30s today) and an idle
# server→client SSE stream, which carries no bytes for as long as the session is
# quiet. nginx's 60s default would cut those mid-session.
proxy_read_timeout 3600s;

server {
  listen 8088;
  location / {
    set $fetch_mcp sentient-fetch-mcp:8088;
    proxy_pass http://$fetch_mcp$request_uri;
  }
}

server {
  listen 8087;
  location / {
    set $searxng_mcp sentient-searxng-mcp:8087;
    proxy_pass http://$searxng_mcp$request_uri;
  }
}

# MCP tool-call policy rules — evaluated before every tools/call dispatch,
# foreground or background (gateway/src/tools/tool-broker.ts is the single
# choke point).
#
# Risk tiering is the 2.0 design's §2.2:
#
#   read / low-risk (queries, HA reads, search)  → allow    no prompt
#   write / side-effecting / spend / ext. comms  → confirm  real permission prompt
#   argument-value violation, role/channel rule  → deny     hard, value-aware
#
# First matching rule wins. A tool that matches NO rule is NOT allowed: the
# engine classifies it as side-effecting and returns `confirm`
# (policy-engine.ts's `UNMATCHED`). So this file is an ALLOWLIST for the
# prompt-free read tier — a newly added MCP server's tools start out mediated
# and earn their friction-free path only by being tiered here.
#
# Rule order below is deliberate: hard denies first (they must beat any allow
# under them), then the read/low-risk allow tier, then the explicit confirm
# tier. The confirm rules are NOT redundant with the fail-closed default —
# their `reason` is the text the user reads in the permission dialog.
#
# The tools named here are the ones `gateway/config.yaml#mcp_catalog` actually
# exposes, and the two are kept in sync BY TEST: policy-engine.test.ts fails
# when a catalog entry ships without a curated `tools.include`, or when a tool
# in one of those lists reaches the fail-closed default instead of a rule below
# (mediated, but prompting on every call — including its reads).

rules:
  # ─────────────────────────────────────────────────────────────────────
  # Hard deny — role / channel restrictions. Must stay above the allow tier.
  # ─────────────────────────────────────────────────────────────────────
  - name: no_identify_user_outside_voice
    tool: identify_user
    condition: 'session.channel != "voice"'
    action: deny
    reason: "Identity changes via voice phrase only"

  - name: no_guest_identify
    tool: identify_user
    condition: 'role == "guest"'
    action: deny
    reason: "Guest sessions cannot rebind"

  - name: child_cannot_pause_audio
    tool: pause_audio
    condition: 'role == "child"'
    action: deny
    reason: "Audio control restricted for child role"

  # ─────────────────────────────────────────────────────────────────────
  # Read / low-risk tier → allow. These run with no prompt; keeping queries
  # friction-free is the whole point of tiering (§2.2 row 1).
  #
  # A tool belongs here only if it either (a) just reads, or (b) is low-risk
  # on ALL of these at once: trivially reversible, no spend, nothing leaves
  # the home, no security-relevant device class (locks, alarms, cameras as
  # actuators), and no persisted state another household member relies on.
  # Anything else is side-effecting and belongs in the confirm tier below.
  # ─────────────────────────────────────────────────────────────────────
  # Home Assistant reads.
  - name: allow_ha_get_overview
    tool: ha_get_overview
    condition: 'tool == "ha_get_overview"'
    action: allow
    reason: "Read-only Home Assistant query"

  - name: allow_ha_get_state
    tool: ha_get_state
    condition: 'tool == "ha_get_state"'
    action: allow
    reason: "Read-only Home Assistant query"

  - name: allow_ha_search
    tool: ha_search
    condition: 'tool == "ha_search"'
    action: allow
    reason: "Read-only Home Assistant query"

  - name: allow_ha_get_history
    tool: ha_get_history
    condition: 'tool == "ha_get_history"'
    action: allow
    reason: "Read-only Home Assistant query"

  - name: allow_ha_eval_template
    tool: ha_eval_template
    condition: 'tool == "ha_eval_template"'
    action: allow
    reason: "Read-only Home Assistant template render"

  - name: allow_ha_get_operation_status
    tool: ha_get_operation_status
    condition: 'tool == "ha_get_operation_status"'
    action: allow
    reason: "Read-only Home Assistant query"

  - name: allow_ha_list_floors_areas
    tool: ha_list_floors_areas
    condition: 'tool == "ha_list_floors_areas"'
    action: allow
    reason: "Read-only Home Assistant query"

  - name: allow_ha_get_zone
    tool: ha_get_zone
    condition: 'tool == "ha_get_zone"'
    action: allow
    reason: "Read-only Home Assistant query"

  - name: allow_ha_get_camera_image
    tool: ha_get_camera_image
    condition: 'tool == "ha_get_camera_image"'
    action: allow
    reason: "Read-only Home Assistant camera snapshot"

  - name: allow_ha_get_todo
    tool: ha_get_todo
    condition: 'tool == "ha_get_todo"'
    action: allow
    reason: "Read-only todo/shopping-list query"

  - name: allow_ha_config_get_calendar_events
    tool: ha_config_get_calendar_events
    condition: 'tool == "ha_config_get_calendar_events"'
    action: allow
    reason: "Read-only calendar query"

  # Music Assistant reads.
  - name: allow_ma_search
    tool: ma_search
    condition: 'tool == "ma_search"'
    action: allow
    reason: "Read-only music library search"

  - name: allow_ma_browse
    tool: ma_browse
    condition: 'tool == "ma_browse"'
    action: allow
    reason: "Read-only music library browse"

  - name: allow_ma_list_players
    tool: ma_list_players
    condition: 'tool == "ma_list_players"'
    action: allow
    reason: "Read-only player/now-playing query"

  # Music Assistant playback. Low-risk by the criterion stated at the top of
  # this tier: transient (it changes only what is audible right now, and stops
  # mattering when the music does), trivially reversible by the next voice
  # command, no spend, no data leaves the home, no security-relevant device
  # class. Prompting on "play some jazz" / "pause" / "turn it down" would make
  # voice music control unusable, which §2.2 row 1 exists to prevent. Note the
  # contrast with ha_call_service below: that one is a GENERIC dispatcher whose
  # blast radius includes locks and alarms, so it stays mediated.
  - name: allow_ma_playback
    tool: ma_playback
    condition: 'tool == "ma_playback"'
    action: allow
    reason: "Transient playback transport control"

  - name: allow_ma_play_media
    tool: ma_play_media
    condition: 'tool == "ma_play_media"'
    action: allow
    reason: "Transient playback of chosen media"

  - name: allow_ma_volume
    tool: ma_volume
    condition: 'tool == "ma_volume"'
    action: allow
    reason: "Transient player volume control"

  # Web reads. Content they return is untrusted and handled by the injection
  # scanner (gateway/src/security/injection-scanner.ts), not by a prompt.
  - name: allow_search_web
    tool: search_web
    condition: 'tool == "search_web"'
    action: allow
    reason: "Read-only web search"

  - name: allow_fetch
    tool: fetch
    condition: 'tool == "fetch"'
    action: allow
    reason: "Read-only URL fetch"

  # Session-local audio control: reversible, no state leaves the session, and
  # latency-sensitive during voice. The child restriction above still wins.
  - name: allow_pause_audio
    tool: pause_audio
    condition: 'tool == "pause_audio"'
    action: allow
    reason: "Session-local audio control"

  - name: allow_resume_audio
    tool: resume_audio
    condition: 'tool == "resume_audio"'
    action: allow
    reason: "Session-local audio control"

  # Delegation is its own security category (§2.3), and it is the ONLY tool that
  # hands a free-form instruction to another agent to act on unsupervised.
  #
  # This rule used to read `action: allow`, justified by "a blanket PDP confirm
  # here would double-prompt". That rationale was wrong and is the reason the
  # hole survived a whole branch: the DelegationGuard it deferred to does not
  # prompt. It CLASSIFIES — `low → allow`, and its classifier is the injection
  # scanner, which asks "does this prompt look like an attack on me", never "is
  # this task dangerous to perform". Measured 2026-07-31, all four `low`:
  # summarise the news / write a key into ~/.ssh/authorized_keys / delete every
  # photo in my home directory / email the household roster outside. So every
  # live dispatch logged `tier="low" action="allow"` and no human ever saw one.
  # There was no first prompt to double.
  #
  # INTERIM, deliberately blunt. The destination is a tiered risk classifier
  # that judges the proposed task against the agent's capability envelope
  # (docs/native-todo.md § 1 carries the design and its reference); until that
  # lands, one prompt before an unsupervised run beats none. The dialog renders
  # the `taskPrompt` argument in full — that text IS the authority being
  # granted, and the delegated worker also holds its own builtin tools (write_file
  # among them) that the gateway's proxied allow-tier never sees.
  - name: confirm_delegate_task
    tool: delegateTask
    condition: 'tool == "delegateTask"'
    action: confirm
    reason: "Runs this instruction as a background agent with its own tools, unsupervised until it finishes"

  # ─────────────────────────────────────────────────────────────────────
  # Write / side-effecting tier → confirm. The fail-closed default already
  # catches anything unlisted; these exist to give the dialog a reason the
  # user can act on.
  # ─────────────────────────────────────────────────────────────────────
  - name: confirm_ha_service_call
    tool: ha_call_service
    condition: 'tool == "ha_call_service"'
    action: confirm
    reason: "Calling a Home Assistant service changes device state"

  - name: confirm_ha_bulk_control
    tool: ha_bulk_control
    condition: 'tool == "ha_bulk_control"'
    action: confirm
    reason: "Bulk control changes the state of many devices at once"

  - name: confirm_ha_set_todo_item
    tool: ha_set_todo_item
    condition: 'tool == "ha_set_todo_item"'
    action: confirm
    reason: "Writes an item to a shared todo/shopping list"

  - name: confirm_ha_remove_todo_item
    tool: ha_remove_todo_item
    condition: 'tool == "ha_remove_todo_item"'
    action: confirm
    reason: "Removes an item from a shared todo/shopping list"

  - name: confirm_ha_set_calendar_event
    tool: ha_config_set_calendar_event
    condition: 'tool == "ha_config_set_calendar_event"'
    action: confirm
    reason: "Creates or edits a calendar event for the household"

  - name: confirm_ha_remove_calendar_event
    tool: ha_config_remove_calendar_event
    condition: 'tool == "ha_config_remove_calendar_event"'
    action: confirm
    reason: "Deletes a calendar event for the household"

  # Music Assistant state that outlives the current track. `ma_queue` is a
  # mixed read/write tool upstream — the same call that reports the queue can
  # also flip shuffle/repeat or clear it — and the condition grammar matches
  # string args only (these tools nest theirs under a `params` object), so the
  # read half cannot be carved out here. It is classified by its worst case.
  - name: confirm_ma_queue
    tool: ma_queue
    condition: 'tool == "ma_queue"'
    action: confirm
    reason: "Reading the queue may also clear it or change shuffle/repeat"

  - name: confirm_ma_queue_item
    tool: ma_queue_item
    condition: 'tool == "ma_queue_item"'
    action: confirm
    reason: "Reorders or removes tracks someone else queued"

  - name: confirm_ma_group
    tool: ma_group
    condition: 'tool == "ma_group"'
    action: confirm
    reason: "Changes which speakers are grouped together"

  - name: confirm_ma_transfer_queue
    tool: ma_transfer_queue
    condition: 'tool == "ma_transfer_queue"'
    action: confirm
    reason: "Moves playback and its queue to a different room"

  - name: confirm_user_settings_write
    tool: update_user_settings
    condition: 'tool == "update_user_settings"'
    action: confirm
    reason: "Changes persisted account settings"

  # Not denied by the two rules above is not the same as allowed: an identity
  # rebind changes who the assistant acts for, which is the confused-deputy
  # case §2.2 exists for.
  - name: confirm_identity_rebind
    tool: identify_user
    condition: 'tool == "identify_user"'
    action: confirm
    reason: "Rebinding the session changes who the assistant is acting for"

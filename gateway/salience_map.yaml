# gateway/salience_map.yaml — event-kind to per-effect salience mapping.
# Adapters emit event kinds. This file declares how much salience each kind
# contributes to each registered effect. AttentionGate uses summed salience
# to decide whether to fire a cognitive cycle.

# Schema version — bumped by deploy/setup.py migrations. Do not hand-edit.
schema_version: "0.1.0"

# Loader-schema version — consumed by salience-map-loader.ts. Separate
# from `schema_version` which tracks setup-migration state.
version: 1
entries:
  # Unified source-neutral salience keys. The AttentionGate maps each wake
  # source (ConversationHistory append, STC inject) to these keys directly,
  # decoupling event kind names from cycle-dispatch salience.
  conversation.user.text:         # user entry via text channel
    reply: 85
  conversation.user.speech:       # user entry via speech channel
    reply: 85
  conversation.user.speech-start: # phasic onset; no cycle-level salience.
    reply: 0                      # barge-in is a direct session signal, not
                                  # a salience event — see bargeIn() hook.
  conversation.trigger:           # Phase-2 sensor triggers — tune later
    reply: 50

tonic_modulators:
  # Phase 2: modulate salience at projection time based on tonic state.
  entries: []

image: sentient/hermes:local
container_name: sentient-hermes
# sentient-external is required for host.docker.internal routing; the
# sentient-internal network has `internal: true` (no host gateway), so
# the OLLAMA daemon on the host (Ollama Cloud) is unreachable without
# attaching to the externally-routable bridge as well.
networks: [sentient-internal, sentient-external]
extra_hosts:
  - host.docker.internal:host-gateway
env:
  TZ: ${TZ}
  HTTP_PROXY: http://sentient-egress-proxy:3128
  HTTPS_PROXY: http://sentient-egress-proxy:3128
  NO_PROXY: localhost,127.0.0.1,sentient-gateway,sentient-ha-mcp,sentient-ma-mcp,sentient-stt-service,sentient-searxng,sentient-searxng-mcp,sentient-fetch-mcp,sentient-signal-cli,host.docker.internal
volumes:
  # SUPERVISOR_DIR is set by the gateway compose file. Linux/Pi pass a host
  # path (bind-mount, ext4 — supervisord can bind a unix socket there). macOS
  # passes a named-volume name (e.g. `sentient-supervisor`) because Docker
  # Desktop's virtiofs bind-mounts reject AF_UNIX bind() with EINVAL. The
  # docker engine treats a source without a slash as a named volume.
  - ${SUPERVISOR_DIR}:/data/supervisor
  - ${HOST_HOME}/.sentient/gateway/data:${HOST_HOME}/.sentient/gateway/data
  - /var/run/docker.sock:/var/run/docker.sock
  # MCP_SOCKET_DIR is set by the gateway compose file. Same portability rule
  # as SUPERVISOR_DIR above: Linux/Pi pass a host path (bind-mount, ext4 —
  # the gateway binds its per-user mcp-<userId>.sock unix sockets there);
  # macOS passes a named-volume name (e.g. `sentient-run`) because Docker
  # Desktop's virtiofs bind-mounts reject AF_UNIX bind()/unlink()/chmod()
  # (EINVAL/ENOTSUP), which bricks the next boot on stale socket files. Both
  # the gateway and this hermes container must mount the SAME source so the
  # socket the gateway binds is the one hermes dials.
  - ${MCP_SOCKET_DIR}:/run/sentient
  # The Hermes "brain" — the image declares `VOLUME /opt/data` (the hermes
  # user's home: sessions/chat history, memories, SOUL.md, config.yaml,
  # skills, plans, hooks). WITHOUT this bind Docker creates an ANONYMOUS
  # volume that lives outside ~/.sentient (invisible to backup/migration)
  # and is orphaned on any orchestrator-driven recreate. Bind it under
  # ~/.sentient so all persistent state is captured by one rsync.
  # Ownership: /opt/data is uid:gid 10000 (USER hermes). On Linux the host
  # dir must be chowned 10000 (see admin/chown-hermes.ts, overridable via
  # SENTIENT_HERMES_UID/GID); on macOS Docker Desktop virtiofs remaps
  # bind-mount ownership so the container writes regardless.
  - ${HOST_HOME}/.sentient/hermes/data:/opt/data
group_add:
  - "${HOST_DOCKER_GID}"

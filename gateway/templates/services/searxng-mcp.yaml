image: sentient/searxng-mcp:local
container_name: sentient-searxng-mcp
# INTERNAL ONLY. This adapter's one upstream is sentient-searxng, reached over
# sentient-internal, so it needs no route out at all — and now that
# ingress-proxy owns its host publish, it does not need one to be reachable
# either.
networks: [sentient-internal]
env:
  SEARXNG_URL: http://sentient-searxng:8080
mem_limit_bytes: 134217728    # 128 MiB — thin HTTP adapter
cpus: 0.25
# NO `ports:` — see fetch-mcp.yaml. The native gateway still dials
# http://127.0.0.1:8087/mcp; ingress-proxy owns that publish.

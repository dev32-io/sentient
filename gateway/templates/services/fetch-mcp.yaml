image: sentient/fetch-mcp:local
container_name: sentient-fetch-mcp
# INTERNAL ONLY, and that is the whole point: this container dereferences
# attacker-chosen URLs, so `internal: true` makes its egress physically
# impossible rather than merely routed. Every outbound fetch has to go through
# egress-proxy because there is no other route out.
networks: [sentient-internal]
env:
  # Belt and braces: the network has no route out, so these only pick the hop —
  # a container ignoring them reaches nothing, it does not reach the internet.
  HTTP_PROXY: http://sentient-egress-proxy:3128
  HTTPS_PROXY: http://sentient-egress-proxy:3128
  NO_PROXY: localhost,127.0.0.1
  # Fetch reach knobs (consumed by run_http.py). Defaults are max capability:
  # mcp-server-fetch's built-in autonomous UA is blackholed/reset by common
  # CDNs (Akamai/Cloudflare) — including on the robots.txt preflight — so we
  # present a mainstream browser UA and skip the preflight.
  # FETCH_USER_AGENT: override outbound UA; blank/unset -> baked-in browser UA.
  FETCH_IGNORE_ROBOTS_TXT: "true"   # "true"/"1"/"yes" skip robots.txt; "false" respect it
mem_limit_bytes: 268435456    # 256 MiB — python + readabilipy fetch workload
cpus: 0.5
# NO `ports:` — deliberately, and docker would drop them anyway on an
# internal-only container. The native gateway still dials
# http://127.0.0.1:8088/mcp; ingress-proxy owns that publish and forwards inward
# over sentient-internal (gateway/templates/services/ingress-proxy.yaml).

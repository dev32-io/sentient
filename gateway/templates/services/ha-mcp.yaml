image: ghcr.io/homeassistant-ai/ha-mcp:stable
container_name: sentient-ha-mcp
# sentient-external joins so the operator's HA URL — typically a
# LAN-only hostname or LAN IP — is reachable. internal-only blocks the
# bridge to host/LAN. Mirrors ma-mcp's two-network shape.
networks: [sentient-internal, sentient-external]
# Hostname → LAN-IP mapping for the HA URL the operator entered. The
# gateway derives HA_LOCAL_HOST from the URL hostname (via the secret
# binding `:host` suffix) and HA_LOCAL_IP from the operator-entered
# local_ip. Both bindings null → ha-mcp is skipped (optional service).
extra_hosts:
  - ${HA_LOCAL_HOST}:${HA_LOCAL_IP}
command: [ha-mcp-web]
env:
  HOMEASSISTANT_URL: ${HOMEASSISTANT_URL}
  HOMEASSISTANT_TOKEN: ${HOMEASSISTANT_TOKEN}
# Host publishing. LOOPBACK ONLY: the gateway is a native host process now, so
# docker DNS is gone and Docker Desktop bridge IPs are not host-routable. A bare
# "8086:8086" would bind 0.0.0.0 and put this addon on the LAN.
# native gateway dials http://127.0.0.1:8086/mcp.
ports:
  - "127.0.0.1:8086:8086"

# POC egress proxy. Phase 1.8 adds TLS + finer policy.

User tinyproxy
Group tinyproxy

Port 3128
Listen 0.0.0.0

# 0 = no idle timeout. Required so long-lived TLS tunnels (Signal's
# WebSocket to chat.signal.org, which the in-container signal-cli daemon
# proxies through here) aren't killed every 10 minutes.
Timeout 0
DefaultErrorFile "/usr/share/tinyproxy/default.html"
Logfile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info

# Blocklist policy: allow all outbound by default, deny only listed hosts.
# FilterURLs Off: match by hostname (works for both HTTP and HTTPS CONNECT).
# FilterExtended Off: patterns are plain domain suffixes, not POSIX regex.
# See filter.txt for the denylist and README.md for the security rationale.
FilterURLs Off
FilterExtended Off
FilterDefaultDeny No
Filter "/etc/tinyproxy/filter.txt"

ConnectPort 443
ConnectPort 80
# Home Assistant runs on 8123 by default. Hermes's HA MCP CONNECT lands here.
ConnectPort 8123
# Music Assistant exposes its WebSocket API on 8095. The music-assistant-mcp
# subprocess inside Hermes opens a WS to MA via this proxy (aiohttp uses
# CONNECT-tunneling for WebSocket through HTTP proxies).
ConnectPort 8095
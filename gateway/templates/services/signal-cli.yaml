image: sentient/signal-cli:local
container_name: sentient-signal-cli
# Direct LAN/internet egress required for Signal's long-lived WebSocket to
# chat.signal.org's provisioning + message-receive endpoints. Tinyproxy's
# HTTP CONNECT tunnel terminated the WS mid-handshake on link attempts
# ("Link request error: Connection closed!"), so this sidecar attaches to
# sentient-external for direct egress instead.
#
# Still binds no host port (no `ports:` here) — external attackers can't
# reach the daemon; only sibling sentient-* containers on the docker
# networks can. Gateway + Hermes dial http://sentient-signal-cli:8080.
networks: [sentient-internal, sentient-external]
volumes:
  # Per-user account data (linked-device keys, message store) persists across
  # container rebuilds. signal-cli native daemon stores everything under the
  # path passed to --config (set to /var/lib/signal-cli in the image).
  # Layout inside is data/accounts.json + data/<accountHash>/.
  - ${HOST_HOME}/.sentient/signal-cli:/var/lib/signal-cli
env:
  TZ: ${TZ}

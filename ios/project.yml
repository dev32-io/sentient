name: SentientApp
options:
  bundleIdPrefix: io.dev32
  deploymentTarget:
    iOS: "18.0"
packages:
  # GFM markdown rendering for chat bubbles (SwiftUI-native), themed to Dusk.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    exactVersion: "6.22.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: "1.19.4"
targets:
  SentientApp:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleDisplayName: Sentient
        # This spec owns the app version; xcodegen regenerates Info.plist.
        # App releases use their own track, separate from mobile-sdk/data source
        # versions. An iOS-only release does not bump the deprecated Android app.
        CFBundleShortVersionString: 1.5.0
        CFBundleVersion: "12"
        # Register bundled custom fonts so UIKit can load them by family name.
        # Filenames MUST match the .ttf files in App/Resources/Fonts/ exactly.
        UIAppFonts:
          - Fraunces-Regular.ttf
          - Fraunces-Medium.ttf
          - Fraunces-SemiBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
        NSMicrophoneUsageDescription: Sentient uses the microphone for voice conversations.
        # Required for iOS Local Network access (LAN gateway). The system shows this
        # string in the Local Network permission prompt; without the key the prompt
        # (and all local-network connections) are blocked.
        NSLocalNetworkUsageDescription: Sentient connects to your home gateway on the local network.
        # Build-time default gateway URL. Debug reads Local.xcconfig (gitignored);
        # Release leaves it unset → "" → app forces the in-app backend-setup page.
        GatewayWSURL: $(GATEWAY_WS_URL)
        # Prod hosts must serve a CA-trusted cert (strict ATS). NSAllowsLocalNetworking exempts LAN/private-IP hosts for the self-signed dev/self-host case.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    configFiles:
      Debug: App/Local.xcconfig
    settings:
      base:
        # Prod bundle id; Debug overrides to the .debug id so both install side by side.
        PRODUCT_BUNDLE_IDENTIFIER: io.dev32.sentient
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.dev32.sentient.debug
    preBuildScripts:
      - name: Verify Sentient identity checksum
        script: |
          set -euo pipefail
          asset="$SRCROOT/App/Resources/Identity/sentient-avatar.riv"
          expected="3111d27fbdeb48527e45e024148171fc0f77ecfed89decf7e8f4cd85fe1beec7"
          actual="$(shasum -a 256 "$asset" | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "error: Sentient identity checksum mismatch: $actual"
            exit 1
          }
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: ../shared/mobile-data/build/XCFrameworks/MobileData.xcframework
        embed: false
      # SQLDelight's native driver cinterop links against the system SQLite.
      - sdk: libsqlite3.tbd
      - package: MarkdownUI
        product: MarkdownUI
      - package: RiveRuntime
        product: RiveRuntime

  SentientAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dev32.sentient.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SentientApp
      - framework: ../shared/mobile-data/build/XCFrameworks/MobileData.xcframework
        embed: false
      - sdk: libsqlite3.tbd
      - package: SnapshotTesting
        product: SnapshotTesting

schemes:
  SentientApp:
    build:
      targets:
        SentientApp: all
        SentientAppTests: [test]
    test:
      targets:
        - SentientAppTests

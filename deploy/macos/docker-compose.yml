# Sentient — macOS Docker Desktop compose.
#
# Why this exists separately from deploy/docker/:
#   Docker Desktop's virtiofs (and gRPC-FUSE) bind-mounts host paths into the
#   Linux VM through a FUSE shim that does NOT support AF_UNIX socket bind().
#   supervisord's `[unix_http_server] file=/data/supervisor/supervisor.sock`
#   fails with errno 22 (EINVAL) the moment it tries to create the socket on
#   a virtiofs-backed bind mount, killing the hermes container in a restart
#   loop. The fix is to back /data/supervisor with a docker NAMED VOLUME
#   (ext4 inside the VM), which both gateway and hermes mount the same way.
#
# Linux doesn't have this problem because the bind mount is plain ext4 —
# deploy/docker/docker-compose.yml keeps the plain bind. The macOS PRODUCTION
# deploy (deploy/mac-prod/) uses this SAME named-volume workaround.
#
# All other persistent state (gateway-data, certs, secrets, profiles) stays
# bind-mounted under ~/.sentient/ so the wipe story is mostly intact:
#   rm -rf ~/.sentient/                         # state
#   docker volume rm sentient-supervisor        # supervisord runtime
#
# First-boot:
#   cp deploy/macos/.env.example deploy/macos/.env   # set HOST_DOCKER_GID
#   docker compose -f deploy/macos/docker-compose.yml build
#   docker compose -f deploy/macos/docker-compose.yml up -d
# Then visit https://localhost:8888 — the wizard sets everything else.

networks:
  sentient-internal:
    name: sentient-internal
    driver: bridge
    internal: true
  sentient-external:
    name: sentient-external
    driver: bridge

volumes:
  # Shared between gateway and orchestrator-spawned hermes. Holds the
  # supervisord unix socket + per-user program .conf files. Named volume
  # (not bind) so supervisord can bind() its socket on ext4 inside the
  # Docker Desktop VM. See file header for why.
  sentient-supervisor:
    name: sentient-supervisor

services:
  # ---------------------------------------------------------------------------
  # Build-only siblings. The gateway's orchestrator owns runtime lifecycle.
  # Compose only needs the images present on the daemon. `profiles: build-only`
  # keeps them out of `docker compose up` but `docker compose --profile
  # build-only build` produces them.
  # ---------------------------------------------------------------------------
  signal-cli:
    build:
      context: ../..
      dockerfile: deploy/signal-cli/Dockerfile
    image: sentient/signal-cli:local
    pull_policy: never
    profiles: ["build-only"]

  gateway:
    container_name: sentient-gateway
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    image: sentient/gateway:local
    restart: unless-stopped
    group_add:
      - "${HOST_DOCKER_GID:?HOST_DOCKER_GID required — see deploy/README.md}"
    env_file: .env
    environment:
      - TZ=${TZ:-America/Vancouver}
      - SENTIENT_GATEWAY_ROOT=/app/gateway-data
      - SENTIENT_PROJECT_PROFILES_DIR=/sentient-host-profiles
      - SENTIENT_HOST_GATEWAY_DATA_DIR=${HOME}/.sentient/gateway/data
      - SENTIENT_HOST_MCP_SOCKET_DIR=${HOME}/.sentient/run/sentient
      - SENTIENT_SUPERVISORD_SOCKET=/data/supervisor/supervisor.sock
      - SENTIENT_HOME=/sentient
      - HOST_HOME=${HOME}
      - HOST_DOCKER_GID=${HOST_DOCKER_GID:?HOST_DOCKER_GID required}
      - HOST_CONFIG_DIR=${HOME}/.sentient/gateway/config
      # Named-volume name (no slash) — dockerode's HostConfig.Binds treats a
      # source-without-slash as a docker volume reference, so the orchestrator
      # spawns hermes with the same shared volume mount.
      - SUPERVISOR_DIR=sentient-supervisor
    ports:
      - "8888:8888"
    volumes:
      - ~/.sentient/gateway/logs:/app/logs
      - ~/.sentient/gateway/clientLogs:/app/clientLogs
      - ~/.sentient/gateway/data:/app/gateway-data
      - ${HOME}/.sentient/gateway/data:${HOME}/.sentient/gateway/data
      - ~/.sentient/run/sentient:/run/sentient
      - ~/.sentient/certs:/app/certs
      # Supervisord state — see file header for why this is a named volume
      # on macOS instead of a bind under ~/.sentient/.
      - sentient-supervisor:/data/supervisor
      - ../../profiles:/sentient-host-profiles
      - ${HOME}/.sentient:/sentient
      - /var/run/docker.sock:/var/run/docker.sock
      # Mobile release artifacts (apk/ipa/manifest.json/icons) served at /download.
      # Read-only — the gateway only serves them; deploy-mobile.sh writes the host dir.
      - ${HOME}/.sentient/releases:/app/releases:ro
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('https://localhost:8888/api/v1/health', { tls: { rejectUnauthorized: false } }).then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Resolve host.docker.internal to the host on Colima/OrbStack as well as
    # Docker Desktop, so the gateway can dial a native (host-side) STT backend
    # (native-whisper: ws://host.docker.internal:8768). No effect when the
    # STT backend is the containerized sentient-stt-service.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [sentient-internal, sentient-external]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

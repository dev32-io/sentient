# Sentient — macOS Docker Desktop compose: LOCAL-DEV IMAGE BAKERY ONLY.
#
# There is no long-running compose service here any more. The gateway is a
# native compiled binary supervised by launchd (deploy/mac-prod/io.sentient.gateway.plist)
# and it is the host orchestrator: it creates/starts/recreates every addon
# container itself over /var/run/docker.sock, and creates the addon networks
# itself (gateway/src/system-orchestrator/types.ts#MANAGED_NETWORK_TOPOLOGY is
# the single source of truth for their egress posture — do NOT re-declare
# `internal:` here, two declarations is one drift away from a silently open
# egress boundary).
#
# So this file's whole job is `build`: produce the `:local` image tags on the
# host daemon so the orchestrator can create containers from them.
#
#   docker compose -f deploy/macos/docker-compose.yml --profile build-only build
#
# For the full addon set (ma-mcp, fetch-mcp, searxng-mcp, signal-cli) use
# deploy/mac-prod/docker-compose.yml's build-only profile — same images, one
# list. Runtime bring-up is `launchctl bootstrap`, not `docker compose up`.
#
# State layout is unchanged and stays user-owned under ~/.sentient/ (gateway
# config, logs, data, certs, secrets). Code is root-owned under
# /opt/sentient/<version>/. Wipe story:
#   rm -rf ~/.sentient/                         # state

services:
  # ---------------------------------------------------------------------------
  # Build-only siblings. The gateway's orchestrator owns runtime lifecycle.
  # Compose only needs the images present on the daemon. `profiles: build-only`
  # keeps them out of `docker compose up` but `docker compose --profile
  # build-only build` produces them.
  # ---------------------------------------------------------------------------
  signal-cli:
    build:
      context: ../..
      dockerfile: deploy/signal-cli/Dockerfile
    image: sentient/signal-cli:local
    pull_policy: never
    profiles: ["build-only"]

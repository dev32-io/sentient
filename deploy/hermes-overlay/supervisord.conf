# supervisord config for the multi-profile Hermes container.
#
# The daemon itself runs in the foreground (PID 1). Per-profile `hermes -p
# <name> gateway run` programs are NOT defined statically here — they are
# rendered into /data/supervisor/programs/<profile>.conf by the Bun gateway
# whenever a user is added/removed in the admin UI. supervisord picks them
# up via the [include] glob below; the gateway calls `supervisorctl reread
# && supervisorctl update` after rendering.

[supervisord]
nodaemon=true
logfile=/data/supervisor/supervisord.log
pidfile=/data/supervisor/supervisord.pid
loglevel=info

[unix_http_server]
file=/data/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///data/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[include]
files = /data/supervisor/programs/*.conf

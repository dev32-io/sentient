# Sentient deploy selector — single source of truth for the STT backend.
# Read by deploy/setup-prod.py, which reconciles all three moving parts on
# every run (idempotent — installs a fresh host OR migrates an existing one):
#   1. the mounted gateway config (~/.sentient/gateway/config/config.yaml):
#      stt.url + companions.stt_health_url + managed_services.stt-service
#   2. the native Whisper launchd service (native/whisper-stt.sh)
#   3. which STT image compose builds (native skips the SenseVoice bake)
#
# STT_BACKEND: which STT service the gateway dials.
#   native-whisper    — native MLX Whisper-STT on the host (Apple Silicon,
#                       launchd, :8768). Default — matches the dev macos stack.
#   docker-sensevoice — the containerized SenseVoice STTService (portable;
#                       orchestrator-managed sibling at :8766).
STT_BACKEND=native-whisper

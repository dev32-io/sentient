# Sentient — macOS PRODUCTION addon image bakery.
#
# This file no longer runs anything. After the native-stack migration the
# gateway is a compiled binary supervised by launchd (io.sentient.gateway.plist,
# installed to /Library/LaunchDaemons/), and the gateway itself is the host
# orchestrator: it creates, starts, recreates and health-checks every addon
# container over /var/run/docker.sock. `docker compose up` has no service to
# select here — bring-up is `launchctl bootstrap system`, see deploy/README.md.
#
# What compose is still for: baking the `:local` image tags the orchestrator
# creates containers from.
#
#   docker compose -f deploy/mac-prod/docker-compose.yml --profile build-only build
#
# Addon networks are NOT declared here. The gateway creates them, and
# gateway/src/system-orchestrator/types.ts#MANAGED_NETWORK_TOPOLOGY is the
# single source of truth for their egress posture (`sentient-internal` is
# `internal: true` — the invariant that forces every MCP through egress-proxy).
# A second declaration in YAML is one drift away from silently opening it.
#
# Addon host ports are loopback-only (`127.0.0.1:<port>:<port>`, declared in
# gateway/templates/services/*.yaml and enforced by the driver). The gateway is
# native now, so it dials localhost — docker DNS is gone and Docker Desktop
# bridge IPs are not host-routable. Publishing on 0.0.0.0 would put every MCP
# on the LAN.
#
# Not here, by design:
#   - gateway         native binary under /opt/sentient/current/bin/
#   - hermes          one-shot exec per delegateTask, not a service — no image
#   - whisper-stt     native python venv addon (pinned 3.14), gateway-spawned
#   - local-tts       native python venv addon (pinned 3.11), gateway-spawned
#   - stt-service     retired; superseded by native whisper-stt
#
# State stays user-owned and mutable under ~/.sentient/ (gateway config, logs,
# data, users, secrets, certs, releases); code is root-owned and immutable
# under /opt/sentient/<version>/. The whole assistant still migrates with one
# rsync of ~/.sentient/.
#
# The TLS cert lives at ~/.data/certs/sentient.dev32.io (acme.sh on the LAN
# renews + rsyncs it there). This is the ONE state path outside ~/.sentient by
# design — externally managed infra, re-derivable on renewal, not app state.

services:
  # ---------------------------------------------------------------------------
  # Build-only siblings. The gateway's orchestrator owns runtime lifecycle
  # (create/start/stop/recreate) via the host docker socket. Compose only
  # builds the images so they exist on the daemon — never runs them as
  # compose services. `profiles: build-only` keeps them out of `up` while
  # `docker compose --profile build-only build` produces them.
  # ---------------------------------------------------------------------------
  ma-mcp:
    build:
      context: ../../gateway/mcp/ma-mcp
    image: sentient/ma-mcp:local
    pull_policy: never
    profiles: ["build-only"]

  fetch-mcp:
    build:
      context: ../../gateway/mcp/fetch-mcp
    image: sentient/fetch-mcp:local
    pull_policy: never
    profiles: ["build-only"]

  searxng-mcp:
    build:
      context: ../../gateway/mcp/searxng-mcp
    image: sentient/searxng-mcp:local
    pull_policy: never
    profiles: ["build-only"]

  # Not an MCP: the loopback ingress that lets the two MCPs above stay
  # internal-only (docker drops port publishing when every attached network is
  # internal). Required, not optional — without this image on the daemon nothing
  # on the host can reach fetch-mcp or searxng-mcp at all.
  ingress-proxy:
    build:
      context: ../../gateway/mcp/ingress-proxy
    image: sentient/ingress-proxy:local
    pull_policy: never
    profiles: ["build-only"]

  # Not an MCP either: the PUBLIC entrance (host 80/443). The gateway's
  # orchestrator owns its lifecycle like every other addon; compose only bakes
  # the image. Distinct from ingress-proxy above, which guards the internal
  # addon-network boundary rather than the host one.
  inbound-proxy:
    build:
      context: ../../gateway/addons/inbound-proxy
    image: sentient/inbound-proxy:local
    pull_policy: never
    profiles: ["build-only"]

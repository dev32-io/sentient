# Sentient — single-service compose. Gateway owns lifecycle of all
# dependent services (egress-proxy, sentient-hermes, stt-service,
# ha-mcp, ma-mcp, searxng, searxng-mcp, fetch-mcp) via dockerode (mounted /var/run/docker.sock).
# See docs/superpowers/specs/2026-05-03-system-service-orchestrator-design.md.
#
# No separate web container — the gateway builds and serves the Preact
# client directly.
#
# TLS layout: the gateway owns cert generation. It writes cert.pem +
# key.pem into ~/.sentient/certs (read-write mount). One self-signed
# cert → one browser warning per device.
#
# First-boot (local dev):
#   cp .env.example .env   # set HOST_DOCKER_GID — see deploy/README.md
#   docker compose -f deploy/docker/docker-compose.yml build
#   docker compose -f deploy/docker/docker-compose.yml up -d
# Then visit https://localhost:8888 — the wizard sets everything else.
# ~/.sentient/* directories are created by docker on first mount.

networks:
  # Explicit `name:` keeps the actual docker network name stable regardless of
  # compose project prefix. Both gateway and orchestrator-spawned containers
  # attach by this exact name; the gateway dials `ws://sentient-hermes:<port>/ws`
  # per user.
  sentient-internal:
    name: sentient-internal
    driver: bridge
    internal: true
  sentient-external:
    name: sentient-external
    driver: bridge

services:
  gateway:
    container_name: sentient-gateway
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    image: sentient/gateway:local
    restart: unless-stopped
    # The gateway shells out docker API calls (via dockerode) over the
    # bind-mounted /var/run/docker.sock to spawn and manage sibling service
    # containers. The host docker group's GID grants write access to the
    # socket without granting host-root inside the container.
    # HOST_DOCKER_GID is set per-host in deploy/docker/.env — see
    # deploy/README.md for setup.
    # Linux: `getent group docker | cut -d: -f3`
    # macOS Docker Desktop: `docker run --rm -v /var/run/docker.sock:/var/run/docker.sock alpine stat -c '%g' /var/run/docker.sock`
    group_add:
      - "${HOST_DOCKER_GID:?HOST_DOCKER_GID required — see deploy/README.md}"
    env_file: .env
    environment:
      # Host local time — the cerebrum renders "current time" into the
      # per-cycle prompt and the conversation-history transcript uses
      # host-local wall clock. Without this the container runs UTC and the
      # assistant confidently answers the wrong time.
      - TZ=${TZ:-America/Vancouver}
      # Mutable gateway data root: users.json, secrets.json, profile dirs,
      # archives, shared templates. Bind-mounted from host so user accounts
      # and per-user config survive container recreate.
      - SENTIENT_GATEWAY_ROOT=/app/gateway-data
      - SENTIENT_PROJECT_PROFILES_DIR=/sentient-host-profiles
      - SENTIENT_HOST_GATEWAY_DATA_DIR=${HOME}/.sentient/gateway/data
      - SENTIENT_HOST_MCP_SOCKET_DIR=${HOME}/.sentient/run/sentient
      # supervisord socket path inside the gateway container — must match
      # the path inside sentient-hermes since both mount the same volume.
      - SENTIENT_SUPERVISORD_SOCKET=/data/supervisor/supervisor.sock
      # Setup-wizard home — state.yaml, secrets/keys.yaml, .bootstrap-unlock.
      # Matches the /sentient bind-mount target in the volumes block below.
      # Falls back to ~/.sentient when running outside docker (bun run dev).
      - SENTIENT_HOME=/sentient
      # Host-side env values used by the system orchestrator's template
      # substitution (gateway/templates/services/*.yaml). The orchestrator
      # launches sibling containers via the docker socket — bind mounts on
      # those containers must reference actual host paths, not the
      # gateway-container-internal paths. User-tunable values (MA local IP,
      # provider URLs, tokens) live in the secrets store so they can be
      # rotated through the wizard / settings without redeploying.
      - HOST_HOME=${HOME}
      - HOST_DOCKER_GID=${HOST_DOCKER_GID:?HOST_DOCKER_GID required}
      - HOST_CONFIG_DIR=${HOME}/.sentient/gateway/config
      # Source for the hermes /data/supervisor mount. Bind path on Linux —
      # supervisord can create its unix socket on ext4. macOS uses a named
      # volume instead; see deploy/macos/docker-compose.yml.
      - SUPERVISOR_DIR=${HOME}/.sentient/supervisor
    ports:
      - "8888:8888"
    volumes:
      # gateway/config.yaml + salience_map.yaml are baked into the image
      # (see gateway/Dockerfile). Operator can override either by mounting
      # a custom file at /app/config/config.yaml or /app/config/salience_map.yaml.
      - ~/.sentient/gateway/logs:/app/logs
      # Mutable gateway data — users.json, secrets.json, profiles, archives,
      # shared templates. Resolved by getGatewayRoot() inside the gateway.
      # Without this mount, accounts disappear on every `docker compose
      # up --force-recreate`.
      - ~/.sentient/gateway/data:/app/gateway-data
      # Same-path mirror so gateway can mkdir HERMES_HOME at the host path
      # written into supervisord program env. (sentient-hermes mounts the
      # same root at the same path; gateway needs it too because it
      # creates the per-user dir before supervisord reread/update.)
      - ${HOME}/.sentient/gateway/data:${HOME}/.sentient/gateway/data
      # MCP host socket — hermes containers dial /run/sentient/mcp.sock via nc -U.
      - ~/.sentient/run/sentient:/run/sentient
      # Cert dir — gateway writes cert.pem + key.pem on first boot.
      # Persists across restarts so the browser's accepted exception keeps working.
      - ~/.sentient/certs:/app/certs
      # Shared supervisord state — socket + per-user program configs.
      # The gateway writes program .conf files into /data/supervisor/programs
      # and invokes supervisorctl over /data/supervisor/supervisor.sock to
      # reread/update/restart them. Bind-mounted under ~/.sentient so a single
      # `rm -rf ~/.sentient` is enough to wipe the entire stack's state.
      # Modern Docker Desktop (virtiofs / gRPC-FUSE) hosts unix sockets on
      # bind mounts; if you hit errno 95 on a very old daemon, upgrade.
      - ${HOME}/.sentient/supervisor:/data/supervisor
      # Host-side profiles dir — one-time migration of <repo>/profiles/<slot>/ data
      # to ~/.sentient/gateway/data/<userId>/. Mounted RW so rename(2) can move
      # + delete source entries (rename requires write on the source directory).
      - ../../profiles:/sentient-host-profiles
      # Setup-wizard writable root — state.yaml, secrets/keys.yaml, and
      # .bootstrap-unlock all live here. Single mount avoids chicken-and-egg:
      # compose creates the directory if absent (mode 0755); the gateway then
      # creates individual files inside at correct modes. SENTIENT_HOME env
      # var points the gateway code at this mount target.
      - ${HOME}/.sentient:/sentient
      # Docker socket — the orchestrator (gateway/src/orchestrator) uses
      # dockerode to start/stop/inspect sibling service containers.
      # SECURITY: socket access is host-root-equivalent — anyone who pwns
      # the gateway can launch privileged host containers. Acceptable
      # trade-off: the gateway is already the trust boundary; OS-level
      # isolation comes from per-service containers, not the gateway process.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # Self-signed cert; SAN auto-includes 127.0.0.1 so localhost is valid.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('https://localhost:8888/api/v1/health', { tls: { rejectUnauthorized: false } }).then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [sentient-internal, sentient-external]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

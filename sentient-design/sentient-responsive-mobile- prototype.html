    body{font-size:15px;line-height:1.58;letter-spacing:-.006em}

      max-width:calc(100% - 196px);
    }
    .topbar .brand-name{
      max-width:100%;font-family:var(--font-body);font-size:17px;font-weight:600;
    }
    .topbar>.icon-btn{
      align-self:auto;margin:0;border:0;border-radius:9px;background:transparent;
      box-shadow:none;color:var(--accent);
    }
    .topbar>.icon-btn:hover,.topbar>.icon-btn:active{
      border:0;background:color-mix(in oklch,var(--accent) 12%,transparent);
      box-shadow:none;color:var(--accent);transform:none;
    }
    .topbar>.icon-btn:focus-visible,.ios-nav-back:focus-visible,.ios-inline-back:focus-visible,.ios-toolbar-action:focus-visible{
      outline:none;box-shadow:0 0 0 3px var(--focus-soft);
    }
    .ios-nav-back,.ios-inline-back,.ios-toolbar-action{
      min-height:44px;display:inline-flex;align-items:center;gap:1px;padding:0 4px;
      border:0;border-radius:8px;background:transparent;color:var(--accent);
      box-shadow:none;font:500 15px/1 var(--font-body);white-space:nowrap;
    }
    .ios-nav-back{position:relative;z-index:2;justify-self:start;margin-left:-5px}
    .ios-nav-back .icon,.ios-inline-back .icon{width:20px;height:20px;stroke-width:2}
    .ios-nav-back:hover,.ios-inline-back:hover,.ios-toolbar-action:hover{
      background:color-mix(in oklch,var(--accent) 10%,transparent);color:var(--accent);
    }
    .ios-nav-back:active,.ios-inline-back:active,.ios-toolbar-action:active{
      background:color-mix(in oklch,var(--accent) 16%,transparent);transform:none;
    }
    /* Production ChatTitleBar parity: equal native toolbar slots and the shared plain iOS action. */
    .chat-topbar{
      display:grid;grid-template-columns:44px minmax(0,1fr) 44px;column-gap:8px;
      padding:var(--safe-top) 18px 0;align-items:center;
    }
    .chat-topbar .brand{
      position:static;left:auto;top:auto;width:auto;height:var(--ios-nav-height);
      max-width:100%;justify-self:center;transform:none;
    }
    .chat-topbar>.chat-title-action{
      position:relative;z-index:2;inline-size:44px;block-size:44px;min-width:44px;
      padding:0;justify-content:center;color:var(--text-2);
    }
    .chat-topbar>.chat-title-action:first-child{justify-self:start}
    .chat-topbar>.chat-title-action:last-child{justify-self:end}
    .chat-topbar>.chat-title-action .icon{width:18px;height:18px;stroke-width:1.8}
    .chat-topbar>.chat-title-action:hover{
      background:transparent;color:var(--fg);
    }
    .chat-topbar>.chat-title-action:active{
      background:transparent;color:var(--fg);transform:scale(.96);
    }
    .login-gear{
      top:var(--safe-top);right:max(var(--mobile-inline),calc((100vw - 600px)/2 + var(--mobile-inline)));
      min-height:44px;padding-inline:6px;
    }
    .login-back{position:absolute;z-index:1;top:8px;left:var(--mobile-inline)}

    .gate-intro{
      padding:calc(var(--safe-top) + 10px) var(--mobile-inline) 14px;
    }
    .gate-intro .mark{width:30px;height:30px}
    .gate-intro h1{margin-top:7px;font-size:27px}
    .gate-intro p{margin-top:4px;font-size:12px;line-height:1.42}
    .gate-main,.login-main{padding-bottom:calc(22px + var(--safe-bottom))}
    .gate-actions{padding-bottom:calc(12px + var(--safe-bottom))}
    .connection-gate .gate-scroll,.update-gate .gate-scroll{padding-top:16px;padding-bottom:22px}
    .connection-gate .gate-scroll h2,.update-gate .gate-scroll h2{font-size:22px}
    .connection-card{gap:12px}
    .security-option[aria-pressed="true"]::after{
      content:"✓";width:auto;height:auto;border-radius:0;background:transparent;
      box-shadow:none;color:var(--accent);font:600 15px var(--font-body);
    }

    .pin-main .login-stage{padding-top:46px}
    .pin-key{width:68px;height:60px;border-radius:12px}
    .pin-dots i{width:10px;height:5px;border-radius:3px}
    .profile-tile .avatar{border-radius:14px}
    .calendar-primary-controls .btn{border-radius:var(--r-control)}
    .calendar-view-float{border-radius:16px}
    .calendar-view-float .segment{border-radius:10px}

    .rail,.rail.chat-drawer{top:var(--topbar);padding-bottom:calc(18px + var(--safe-bottom))}
    .scrim.open,.chat-shell .scrim.open{inset:var(--topbar) 0 0}
    .workspace{padding-top:16px;padding-bottom:calc(94px + var(--safe-bottom))}
    .calendar-workspace{padding-top:14px;padding-bottom:calc(82px + var(--safe-bottom))}
    .conversation .dock{padding-bottom:calc(10px + var(--safe-bottom))}
    .calendar-view-float{bottom:calc(10px + var(--safe-bottom))}
    .apply-bar{bottom:calc(12px + var(--safe-bottom))}
    .toast{bottom:calc(14px + var(--safe-bottom))}
    .dialog-actions{padding-bottom:calc(11px + var(--safe-bottom))}
    .event-preview{padding-bottom:var(--safe-bottom)}

    @media(max-height:700px){
      :root{--safe-top:max(env(safe-area-inset-top,0px),36px)}
      .gate-intro{padding-top:calc(var(--safe-top) + 6px)}
      .pin-key{width:58px;height:52px}
    }

  <style id="app-connection-typography-refinement">
    /* Scoped refinement: app connection only. Preserve every sibling screen and global token. */
    [data-od-id="app-connection-screen"] .gate-intro{
      display:flex;
      align-items:center;
      min-height:calc(var(--safe-top) + 52px);
      padding:var(--safe-top) 0 0;
    }
    [data-od-id="app-connection-screen"] .gate-intro h1{
      width:min(100%,var(--mobile-content));

      padding-inline:var(--mobile-inline);
      font-size:26px;
      line-height:1;
      letter-spacing:-.018em;
    }
    [data-od-id="app-connection-screen"] .connection-gate .gate-scroll{
      gap:20px;
      padding:20px var(--mobile-inline) 24px;
    }
    [data-od-id="app-connection-screen"] .gate-scroll > div:first-child h2{
      font-size:21px;
      line-height:1.18;
      letter-spacing:-.012em;
    }
    [data-od-id="app-connection-screen"] .gate-scroll > div:first-child p{
      margin-top:6px;
      max-width:38ch;
      color:var(--text-2);
      font-size:13px;
      line-height:1.5;
    }
    [data-od-id="app-connection-screen"] .connection-pair{
      gap:15px;
    }
    [data-od-id="app-connection-screen"] .field{
      gap:7px;
    }
    [data-od-id="app-connection-screen"] .field label,
    [data-od-id="app-connection-screen"] .field legend{
      color:var(--text-2);
      font-size:12px;
      font-weight:600;
      line-height:1.35;
      letter-spacing:.015em;
    }
    [data-od-id="app-connection-screen"] .field legend{
      margin-bottom:9px !important;
    }
    [data-od-id="app-connection-screen"] .input{
      min-height:48px;
      padding:11px 13px;
      font-size:16px;
      line-height:1.35;
    }
    [data-od-id="app-connection-screen"] .security-options{
      gap:2px;
      padding:4px;
    }
    [data-od-id="app-connection-screen"] .security-option{
      min-height:48px;
      padding-inline:13px;
      font-size:14px;
      line-height:1.3;
    }
    [data-od-id="app-connection-screen"] .notice{
      padding:12px 13px;
    }
    [data-od-id="app-connection-screen"] .notice strong{
      font-size:13px;
      line-height:1.35;
    }
    [data-od-id="app-connection-screen"] .notice p{
      font-size:12px;
      line-height:1.45;
    }
    [data-od-id="app-connection-screen"] .connection-error{
      min-height:20px;
      margin:0;
      font-size:12px;
      line-height:1.45;
    }
    [data-od-id="app-connection-screen"] .gate-actions{
      gap:8px;
      padding:12px var(--mobile-inline) calc(14px + var(--safe-bottom));
    }
    [data-od-id="app-connection-screen"] .gate-actions .btn{
      min-height:52px;
    }
    @media(max-height:700px){
      [data-od-id="app-connection-screen"] .gate-intro{
        min-height:calc(var(--safe-top) + 48px);
        padding-top:var(--safe-top);
      }
      [data-od-id="app-connection-screen"] .gate-intro h1{font-size:24px}
      [data-od-id="app-connection-screen"] .connection-gate .gate-scroll{gap:15px;padding-top:15px;padding-bottom:18px}
    }
  </style>

       const avatarImage=(avatarState='idle',className='')=>{const stateName=avatarAssets[avatarState]?avatarState:'idle';const attrs=className?` class="${className}" aria-label="Sentient is ${stateName}" data-avatar-state="${stateName}"`:' aria-hidden="true"';return atob(avatarAssets[stateName]).replace('<svg ',`<svg${attrs} `)};
      const mark=()=>`<span class="mark" aria-hidden="true">${avatarImage('idle')}</span>`;
      const button=(label,cls='btn',attrs='')=>`<button type="button" class="${cls}" ${attrs}>${label}</button>`;
      const toggle=(on,label,id)=>`<button class="toggle" type="button" role="switch" aria-checked="${on}" aria-label="${label}" data-toggle data-od-id="${id}"></button>`;
      const select=(options,value,id)=>`<div class="listbox" data-listbox data-od-id="${id}" data-dirty data-value="${value}"><button type="button" class="listbox-trigger" aria-haspopup="listbox" aria-expanded="false"><span class="listbox-value">${value}</span><span class="listbox-chev" aria-hidden="true">${icon('chevDown')}</span></button><ul class="listbox-menu" role="listbox" tabindex="-1" hidden>${options.map(o=>`<li class="listbox-option${o===value?' selected':''}" role="option" aria-selected="${o===value}" data-value="${o}">${o}</li>`).join('')}</ul></div>`;
      const row=(title,hint,control,id)=>`<div class="setting-row" data-od-id="${id}"><div><strong>${title}</strong>${hint?`<p>${hint}</p>`:''}</div><div class="control">${control}</div></div>`;
      const secretRow=(provider,name,configured,isActive,editing,id)=>`<div class="secret-row" data-od-id="${id}" data-provider="${provider}"><div class="secret-row__label"><span class="s-dot ${configured?'s-dot--ok':'s-dot--off'}" aria-hidden="true"></span><span class="secret-row__name">${name}</span>${isActive?'<span class="tag tag-active">active</span>':''}${!isActive?'<button type="button" class="s-set-active" data-set-active>Set active</button>':''}</div><div class="secret-row__field">${editing?`<input class="secret-row__input" type="password" placeholder="Paste new key…" aria-label="${name} key">`:`<div class="secret-row__masked">${configured?'<code>••••••••••••</code>':'<span class="secret-row__unset">Not configured</span>'}</div>`}</div><div class="secret-row__actions">${editing?`${button('Save','btn primary','data-secret-save')}${button('Cancel','btn ghost','data-secret-cancel')}`:button('Update','btn ghost','data-secret-edit')}</div></div>`;
      const secretSubRow=(provider,name,configured,editing,id)=>`<div class="secret-row secret-row--sub" data-od-id="${id}" data-provider="${provider}"><div class="secret-row__label"><span class="secret-row__name secret-row__name--sub">${name}</span></div><div class="secret-row__field">${editing?`<input class="secret-row__input" type="url" placeholder="https://api.example.com/v1" aria-label="${name}">`:`<div class="secret-row__masked">${configured?'<code>••••••••••••</code>':'<span class="secret-row__unset">Not set</span>'}</div>`}</div><div class="secret-row__actions">${editing?`${button('Save','btn primary','data-secret-save')}${button('Cancel','btn ghost','data-secret-cancel')}`:button('Update','btn ghost','data-secret-edit')}</div></div>`;
      const plate=(title,sub,body,id,action='')=>`<section class="plate" data-od-id="${id}"><header class="plate-head spread"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${action}</header>${body}</section>`;
      const pageHead=(title,sub,action='',id='page-heading')=>`<header class="page-head" data-od-id="${id}"><div><h1>${title}</h1><p>${sub}</p></div>${action}</header>`;
      const showToast=(text)=>{const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),1800)};
      function syncHash(value){history.replaceState(null,'',`${location.pathname}${location.search}#${value}`)}
      function persistFlow(flow){state.flow=flow;syncHash(flow==='app'?state.route:flow);render()}

      function renderAppConfig(){const security=state.connectionSecurity;return `<main class="gate" data-od-id="app-connection-screen"><section class="gate-card connection-gate" data-od-id="app-connection-card"><aside class="gate-intro"><h1>Connect Sentient</h1></aside><form class="gate-main connection-card" id="connectionForm" novalidate><div class="gate-scroll" data-od-id="app-connection-fields"><div class="connection-pair"><div class="field"><label for="mobileHost">Host or IP</label><input class="input" id="mobileHost" name="host" inputmode="url" autocapitalize="none" autocomplete="url" placeholder="sentient.local" value="${state.connectionHost}" data-od-id="app-connection-host" required></div><div class="field"><label for="mobilePort">Port</label><input class="input mono" id="mobilePort" name="port" inputmode="numeric" pattern="[0-9]{1,5}" value="${state.connectionPort}" data-od-id="app-connection-port" required></div></div><fieldset class="field" style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:8px">Security</legend><div class="security-options" data-od-id="app-connection-security">${[['tls','TLS'],['self','TLS · self-signed'],['plain','Plain WebSocket']].map(([value,label])=>`<button type="button" class="security-option" data-security="${value}" aria-pressed="${security===value}">${label}</button>`).join('')}</div></fieldset><div class="notice" data-od-id="self-signed-warning" ${security==='self'?'':'hidden'}><strong>Trust this server only</strong><p class="muted" style="margin-top:4px">Self-signed mode is intended for a known LAN installation.</p></div><p class="connection-error" id="connectionError" role="alert">${state.connectionError}</p></div><footer class="gate-actions connection-actions" data-od-id="app-connection-actions">${state.reconfiguring?'<button class="btn ghost" type="button" data-cancel-config>Cancel</button>':''}<button class="btn primary connection-save" type="button" data-connect data-od-id="app-connection-save" ${state.connectionBusy?'disabled':''}>${state.connectionBusy?'Checking connection…':'Save & connect'}</button></footer></form></section></main>`}
      function renderSplash(){return `<main class="splash" data-od-id="mobile-splash"><div class="splash-lockup">${mark()}<h1>Sentient</h1><p>Connecting your household</p></div></main>`}
      function renderLogin(){const pin=state.loginStage==='pin';return `<main class="gate" data-od-id="login-flow"><button type="button" class="icon-btn login-gear" data-open-app-config aria-label="Change app connection" title="Connection settings" data-od-id="login-app-connection">${icon('settings')}</button><section class="gate-card login-gate" data-od-id="login-card"><aside class="gate-intro">${mark()}<h1>${pin?'Enter your PIN':"Who's here?"}</h1><p>${pin?`Continue as ${state.loginUser}.`:'Choose a household profile to continue.'}</p></aside><div class="gate-main login-main ${pin?'pin-main':'profiles-main'}">${pin?`<button class="ios-inline-back login-back" data-login-back>${icon('back')} Profiles</button><div class="login-stage" data-od-id="login-pin-stage"><div class="pin-dots ${state.pinError?'shake':''}" aria-label="${state.pin.length} of 4 digits entered">${[0,1,2,3].map(i=>`<i class="${i<state.pin.length?'filled':''}"></i>`).join('')}</div><div class="pinpad ${state.pinError?'shake':''}" data-od-id="login-pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="pin-key" data-digit="${n}" data-od-id="pin-key-${n}">${n}</button>`).join('')}<span aria-hidden="true"></span><button type="button" class="pin-key" data-digit="0" data-od-id="pin-key-0">0</button><button type="button" class="pin-key" data-delete aria-label="Delete PIN digit" data-od-id="pin-key-delete">${icon('backspace')}</button></div><p id="pinError" role="alert" style="min-height:24px;margin-top:12px;text-align:center;color:var(--danger)">${state.pinError||''}</p><p class="muted login-footnote">Demo PIN is <span class="mono">1234</span></p></div>`:`<div class="login-stage" data-od-id="login-profile-stage"><div class="profiles">${['Maya','Jordan','Mia'].map((n,i)=>`<button class="profile-tile" data-profile="${n}" data-od-id="login-profile-${n.toLowerCase()}"><span class="avatar">${n[0]}</span><strong>${n}</strong>${i===0?'<span class="badge">Admin</span>':'<span class="profile-role">Member</span>'}</button>`).join('')}</div><p class="muted login-footnote">Profiles are loaded from the configured Sentient server.</p></div>`}</div></section></main>`}

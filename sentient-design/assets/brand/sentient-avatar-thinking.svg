<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sentient thinking avatar</title>
  <desc id="desc">The Sentient atom considers as electrons travel, aperture arcs turn, and an inner light field shifts.</desc>
  <defs>
    <radialGradient id="nuc" cx="40%" cy="36%" r="70%"><stop offset="0%" stop-color="#FFE1BD"/><stop offset="35%" stop-color="#FFB87A"/><stop offset="78%" stop-color="#F2A06A"/><stop offset="100%" stop-color="#B85530"/></radialGradient>
    <radialGradient id="thought" cx="38%" cy="35%" r="66%"><stop offset="0%" stop-color="#FFE1BD" stop-opacity=".42"/><stop offset="40%" stop-color="#FFB87A" stop-opacity=".18"/><stop offset="100%" stop-color="#B85530" stop-opacity="0"/></radialGradient>
    <radialGradient id="elec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFF3DB"/><stop offset="55%" stop-color="#FFE1BD"/><stop offset="100%" stop-color="#FFB87A" stop-opacity=".4"/></radialGradient>
    <radialGradient id="plate" cx="42%" cy="38%" r="58%"><stop offset="0%" stop-color="#FFB87A" stop-opacity=".28"/><stop offset="42%" stop-color="#F2A06A" stop-opacity=".13"/><stop offset="82%" stop-color="#B85530" stop-opacity=".04"/><stop offset="100%" stop-color="#B85530" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="8" y1="7" x2="57" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE1BD" stop-opacity=".92"/><stop offset=".34" stop-color="#F2A06A" stop-opacity=".7"/><stop offset=".72" stop-color="#C86D42" stop-opacity=".36"/><stop offset="1" stop-color="#8E432C" stop-opacity=".1"/></linearGradient>
  </defs>
  <style>
    .aperture-a{transform-origin:32px 32px;animation:aperture-a 2.7s cubic-bezier(.45,.05,.55,.95) infinite}.aperture-b{transform-origin:32px 32px;animation:aperture-b 3.8s linear infinite reverse}.thought-field{transform-origin:32px 32px;animation:thought-field 1.35s ease-in-out infinite}.field-scan{transform-origin:32px 32px;animation:field-scan 2.1s ease-in-out infinite}.electron-static{display:none}
    @keyframes aperture-a{0%{transform:rotate(0)}40%{transform:rotate(150deg)}54%{transform:rotate(166deg)}100%{transform:rotate(360deg)}}@keyframes aperture-b{to{transform:rotate(360deg)}}
    @keyframes thought-field{0%,100%{transform:translate(-1.2px,-.5px) scale(.94);opacity:.58}50%{transform:translate(1.4px,.8px) scale(1.1);opacity:.98}}
    @keyframes field-scan{0%,100%{transform:rotate(-18deg) scale(.86);opacity:.08}50%{transform:rotate(22deg) scale(1.08);opacity:.34}}
    @media (prefers-reduced-motion:reduce){.aperture-a,.aperture-b,.thought-field,.field-scan{animation:none}.thought-field{opacity:.78}.field-scan{opacity:.16}.electron-motion{display:none}.electron-static{display:inline}}
  </style>
  <circle cx="32" cy="32" r="31" fill="url(#plate)"/>
  <circle class="thought-field" cx="32" cy="32" r="22" fill="url(#thought)"/>
  <ellipse class="field-scan" cx="32" cy="32" rx="20" ry="11" fill="none" stroke="#FFB87A" stroke-width="1.2" opacity=".22"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#8E432C" stroke-opacity=".24" stroke-width="2.35"/>
  <g class="aperture-a" fill="none" stroke="url(#rim)" stroke-linecap="round"><circle cx="32" cy="32" r="29" stroke-width="3.2" stroke-dasharray="31 15 8 128" transform="rotate(-24 32 32)"/></g>
  <g class="aperture-b" fill="none" stroke="url(#rim)" stroke-linecap="round" opacity=".64"><circle cx="32" cy="32" r="26.4" stroke-width="1.55" stroke-dasharray="18 13 29 106" transform="rotate(72 32 32)"/></g>
  <g stroke="#FFE1BD" stroke-width=".9" fill="none" opacity=".48"><ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(18 32 32)"/><ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(-28 32 32)"/><ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(78 32 32)"/></g>
  <circle cx="32" cy="32" r="6" fill="url(#nuc)"/><ellipse cx="30.5" cy="30" rx="2" ry="1.4" fill="#FFEBD2" opacity=".55"/>
  <g class="electron-motion"><g transform="rotate(18 32 32)"><circle r="1.4" fill="url(#elec)"><animateMotion dur="2.15s" begin="-.35s" repeatCount="indefinite" path="M55 32 A23 9 0 1 1 9 32 A23 9 0 1 1 55 32"/></circle></g><g transform="rotate(-28 32 32)"><circle r="1.1" fill="url(#elec)"><animateMotion dur="2.75s" begin="-1.25s" repeatCount="indefinite" path="M9 32 A23 9 0 1 0 55 32 A23 9 0 1 0 9 32"/></circle></g><g transform="rotate(78 32 32)"><circle r="1.6" fill="url(#elec)"><animateMotion dur="3.25s" begin="-2.1s" repeatCount="indefinite" path="M55 32 A23 9 0 1 1 9 32 A23 9 0 1 1 55 32"/></circle></g></g>
  <g class="electron-static"><circle cx="38.8" cy="42.77" r="1.4" fill="url(#elec)"/><circle cx="14.3" cy="34.43" r="1.1" fill="url(#elec)"/><circle cx="22.96" cy="14.9" r="1.6" fill="url(#elec)"/></g>
</svg>

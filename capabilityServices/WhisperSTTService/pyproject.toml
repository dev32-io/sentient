# pyproject.toml — the modern Python project manifest.
#
# Think of this as Python's build.gradle.kts: it declares metadata,
# dependencies, and tool configuration in one declarative file.
#
# In this project, you'll rarely edit this file. The main thing to
# know: if you add a new dependency, add it both here AND in
# requirements.txt (see requirements.txt header for why both exist).

[project]
name = "whisper-stt"
version = "1.1.0"
description = "Local STT service — Silero VAD + Smart-Turn v3 + SenseVoice-Small on Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = [
    "silero-vad>=5.1,<7",
    "onnxruntime>=1.18",
    "transformers>=4.48,<5",
    "sherpa-onnx>=1.10",
    "websockets>=13,<14",
    "numpy>=1.26,<2.2",
    "soundfile>=0.12",
    "psutil>=7",
    "pyyaml>=6",
    "huggingface_hub>=0.24",
    "opuslib>=3.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

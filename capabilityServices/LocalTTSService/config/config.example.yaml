# local-tts Service — runtime tuning
# ==========================================
#
# Copy this file to ~/.sentient/local-tts/config/config.yaml on the
# Mac mini (or wherever LOCAL_TTS_CONFIG_PATH points). The service
# loads it ONCE at startup. To change a value, edit and restart the
# LaunchAgent.
#
# Every key below is required — the service fails loud at startup if
# anything is missing or the wrong type. There are no silent defaults.
#
# Host paths (model cache, voice reference clips, logs) come from
# LOCAL_TTS_* environment variables — see README.md — except
# voice_dir/log_dir below, which let an operator pin an absolute path
# in this file instead of the environment.

# =============================================================================
# Schema version — bumped on breaking config-shape changes. Do not hand-edit.
# =============================================================================
schema_version: 1

# =============================================================================
# Model — HuggingFace repo id for the MLX Qwen3-TTS weights. Fetched +
# cached on first run under ~/.cache/huggingface. This is also the
# deployed default, set via the launchd env (see deploy Task 6).
# =============================================================================
model: mlx-community/Qwen3-TTS-12Hz-0.6B-Base-8bit

# =============================================================================
# WebSocket server
# =============================================================================
server:
  # Bind address. 127.0.0.1 = loopback only — this service is not exposed
  # off-host; the gateway dials it locally on the same Mac.
  host: 127.0.0.1

  # WebSocket port. If you move this, update the gateway's TTS provider
  # config (gateway/config.yaml) to match.
  port: 8770

  # Maximum accepted WebSocket message size in bytes. 16 MiB is far more
  # than any single synthesis request needs (request text is tiny; audio
  # streams back in chunks, not as one message).
  max_message_bytes: 16777216  # 16 * 1024 * 1024

# =============================================================================
# Health endpoint — plain HTTP, polled by the launchd supervisor / operator.
# =============================================================================
health:
  port: 8771

# =============================================================================
# Synthesis defaults
# =============================================================================
# Audio container for streamed output. opus = compressed (default, matches
# the gateway's Opus-everywhere audio pipeline); pcm = raw PCM16, useful
# for local debugging only.
default_format: opus

# Output sample rate in Hz. 48000 matches the gateway's Opus pipeline and
# WebRTC loopback AEC expectations.
default_sample_rate: 48000

# Target seconds of audio per streamed chunk. Unlike a prior engine design
# (which re-ran its vocoder once PER CHUNK, so small values thrashed it),
# Qwen3-TTS doesn't pay that per-chunk vocoder cost the same way — 2.0
# keeps time-to-first-audio low while staying safely realtime; lower
# values are fine too if you want smaller/more-frequent chunks.
streaming_interval: 2.0

# Language code passed to Qwen3-TTS on every synthesis call. "auto" lets
# the model auto-detect the spoken language per request (en/zh/... — see
# mlx_audio's qwen3_tts model for the supported set); force a specific
# code (e.g. "en", "zh") to skip detection.
default_lang: "auto"

# =============================================================================
# Paths — empty string means "fall back to the LOCAL_TTS_* env var
# at startup" (see __main__.py). Kept as explicit YAML keys (not just env
# vars) so an operator can pin an absolute path here without touching the
# LaunchAgent plist.
# =============================================================================
# Directory holding reference voice audio clips for cloning.
# "" = read LOCAL_TTS_VOICE_DIR at startup.
voice_dir: ""

# Directory for rotated JSONL logs (service + metrics).
# "" = read LOCAL_TTS_LOG_DIR at startup.
log_dir: ""

# Directory holding the read-only, packaged built-in voice library
# (shipped alongside the service, not user-editable at runtime).
# "" = read LOCAL_TTS_BUILTIN_VOICE_DIR at startup, falling back to
# the packaged voices_library/ next to __main__.py.
builtin_voice_dir: ""

# =============================================================================
# Voice-pack metadata limits — enforced on voice.create's optional
# description/tags fields.
# =============================================================================
# Max characters for a voice pack description.
voice_description_max_len: 12000

# Max characters per tag.
voice_tag_max_len: 24

# Max tags per voice pack.
voice_max_tags: 8

# =============================================================================
# Text frontend — preprocessing applied to buffered text before synthesis.
# =============================================================================
text_frontend:
  # Master switch: run markdown/emoji strip + normalization at all.
  enabled: true

  # Run wetext WFST text normalization ($/%/numbers/dates/units).
  normalize: true

  # Languages whose text gets WFST normalization. Measured: English sounds
  # BETTER with no normalization (the model reads $50, 90%, 1st, 3/4, ranges
  # and Dr./Mr. correctly on its own, while the normalizer says "vertical
  # bar" and "underscore"), whereas Chinese needs it or the currency unit is
  # dropped entirely. Language is resolved per block, so a mixed reply gets
  # the right treatment for each. Valid entries: en, zh, ja. Adding "en" is
  # not just a quality preference -- it reintroduces text-corrupting
  # wetext-English bugs that no longer have shims to patch them, e.g.
  # "Wait 5-10 minutes" comes back as "five to ten minutes inutes" and
  # "-5C" comes back as "-five C".
  normalize_languages: ["zh", "ja"]

  # Minimum share of a block's non-whitespace characters that must be CJK
  # (Han or kana) before the block is treated as Chinese/Japanese for
  # normalization. Guards against one quoted Chinese name in an English
  # sentence flipping the whole block to Chinese number words. Range 0.0-1.0;
  # 0.2 keeps short Chinese lines detecting correctly while ignoring
  # incidental characters.
  cjk_ratio: 0.2

  # Tables with MORE body cells than this (rows x columns) are summarized
  # ("a table with 20 rows and 6 columns") instead of read out row by row.
  # Small tables are linearized screen-reader style: "Service gateway,
  # Port 8080." Range: 0-200; 0 summarizes every table.
  table_max_cells: 24

  # Inline `code` longer than this many characters is treated as non-prose
  # (a command, not a word) and replaced by a short phrase rather than
  # spoken character by character. Range: 8-120.
  code_span_max_chars: 32

  # When a span is dropped (command, file path, URL), speak a short
  # placeholder ("a command") so the sentence keeps its grammar. Set false
  # to drop silently.
  speak_dropped_spans: true

# =============================================================================
# Logging + in-process metrics
# =============================================================================
# Days to retain rotated jsonl log files. Files older than this are
# deleted at startup and at each UTC-midnight rollover. Set to 0 to
# disable pruning. Range: 0-365.
retention_days: 7

# CPU/RSS sampling cadence in milliseconds. Each sample writes one line
# to logs/<date>-metrics.jsonl. 1000 ms is cheap and gives per-second
# resolution for latency investigations. Set to 0 to disable.
metrics_interval_ms: 1000

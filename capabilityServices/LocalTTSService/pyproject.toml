# pyproject.toml — the modern Python project manifest.
#
# Mirrors the sibling WhisperSTTService/pyproject.toml structure. If you
# add a new dependency, add it both here AND in requirements.txt (see
# requirements.txt header for why both exist).

[project]
name = "local-tts"
version = "1.3.0"
description = "Local TTS service — Qwen3-TTS (MLX) on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    # >=0.4.5: first version confirmed (during the TTS engine swap eval)
    # to ship mlx_audio.tts.models.qwen3_tts, which engine.py wraps.
    # Do not drop below this floor without re-verifying qwen3_tts is
    # still importable.
    "mlx-audio>=0.4.5",
    "transformers>=5.5,<5.13",
    "mlx",
    "websockets>=13,<14",
    "soundfile",
    "soxr",
    "opuslib",
    "numpy",
    "psutil",
    "pyyaml",
    "huggingface_hub",
    # Text frontend (see docs/superpowers/plans/2026-07-20-tts-text-frontend.md):
    "mistune>=3.3,<4",        # markdown -> AST for the speech stripper
    "emoji>=2.14,<3",         # emoji removal
    "wetext>=0.1",            # WFST text normalization (zh+en+ja, pure-Python, ships FST data)
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "live" tests touch a real dependency (here: download + load real MLX
# model weights, multi-GB on first run). Excluded from the default
# `uv run pytest` run via addopts; run explicitly with `-m live`.
markers = [
    "live: exercises a real network/model dependency; run explicitly with `-m live`",
]
addopts = "-m \"not live\""

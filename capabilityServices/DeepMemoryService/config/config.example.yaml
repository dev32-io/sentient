# Deep-memory Service — runtime tuning
# =====================================
#
# Copy this file to ~/.sentient/deep-memory/config/config.yaml. The service
# loads it ONCE at startup. To change a value, edit and restart the GATEWAY
# (not this service standalone): the gateway is the sole supervisor of every
# native addon (managed_services.deep-memory in gateway/config.yaml) — prod:
# `sudo launchctl kickstart -k system/io.sentient.gateway`; dev: restart the
# gateway process. There is no separate deep-memory launchd unit.
#
# Every key below is required — the service fails loud at startup if anything
# is missing or the wrong type. There are no silent defaults.
#
# Secrets are NOT in this file. The two bearer tokens the service checks live
# in the process environment (DEEP_MEMORY_ADMIN_TOKEN / DEEP_MEMORY_DATA_TOKEN),
# injected by the gateway (managed_services.deep-memory.env in
# gateway/config.yaml), never on disk in cleartext YAML.
#
# One more env var besides those two + DEEP_MEMORY_CONFIG_PATH /
# DEEP_MEMORY_LOG_DIR: PYTHONPATH="${SENTIENT_CODE}/deep-memory/src" —
# REQUIRED, since this package is never pip-installed into the venv (only its
# dependencies are). Missing it is a ModuleNotFoundError at every launch. See
# CONTRACT.md §5 for the full env-var table.
#
# ------------------------------------------------------------------------------
# PINNED VERSIONS (verified at implementation time — pinned-versions rule).
# Validated interpreter: Python 3.14.6 (same as sibling whisper-stt). Unlike
# local-tts (pinned to 3.11 because mlx-AUDIO lacks 3.14 wheels), the whole
# deep-memory stack ships working wheels on 3.14, proven end-to-end in T9b:
#   mlx            0.32.0  — cp314 arm64 wheels present
#   mlx-embeddings 0.1.0   — MLX embedding runtime (loads the model below)
#   sqlite-vec     0.1.9   — py3-none-macosx_11_0_arm64 wheel (vec0 + FTS5)
#   aiohttp        3.14.x  — cp314 arm64 wheels present
#   sentencepiece  0.2.2   — cp314 arm64 wheel (transitive tokenizer dep)
# The real index engine (SQLite + FTS5 + sqlite-vec + MLX embeddings) loads
# `embedding.model` at startup and reports its id via /health.
# ------------------------------------------------------------------------------

# =============================================================================
# Schema version — bumped by deploy migrations. Do not hand-edit.
# =============================================================================
schema_version: "0.1.0"

# =============================================================================
# HTTP server
# =============================================================================
server:
  # Loopback ONLY. The gateway is the sole consumer and runs on the same host.
  # NEVER bind to 0.0.0.0 or a LAN address — the deep-memory index holds raw
  # per-user memory text and speaks two shared bearer tokens; it is not meant
  # to be reachable off-host.
  host: 127.0.0.1

  # HTTP port. 8772 — whisper-stt owns 8768/8769 and local-tts owns
  # 8770/8771 (WS/health pairs each), so this is the next free loopback port
  # in the native-addon sequence. If you move this, update BOTH the
  # gateway's DeepMemoryClient config (gateway/config.yaml
  # `orchestrator.memory.service.url`) AND its
  # `managed_services.deep-memory.healthcheck.url` to match.
  port: 8772

# =============================================================================
# Storage — where per-scope indexes and the scope registry live on disk.
# =============================================================================
storage:
  # The ONE directory tree under which every registered scope index path must
  # live. `POST /register-scope` refuses (400) any indexPath that resolves
  # outside this root — the path-traversal boundary for the whole service.
  # The scope registry itself is persisted here as `scope-registry.json`.
  # Absolute path. Default under the service state root.
  data_root: "~/.sentient/deep-memory/scopes"

# =============================================================================
# Embedding model — the MLX embedding model the index engine loads.
# Config-pinned + swappable; a dimension/model change forces a `rebuild`
# (each scope DB records the model id; a mismatch refuses search with
# `rebuild_required` and WARNs at startup). Reported by /health.
# =============================================================================
embedding:
  # HuggingFace repo id for the MLX embedding weights.
  # multilingual-e5-small: 384-dim, MULTILINGUAL (the family speaks en + zh —
  # cross-lingual retrieval verified in T9b), and returns L2-normalized vectors
  # so cosine similarity is a dot product. The e5 family expects "query:" /
  # "passage:" instruction prefixes; the embedder applies them internally, so
  # the gateway passes raw text. Swapping this model requires a `rebuild` of
  # every scope (dimensions/space differ across models).
  model: "mlx-community/multilingual-e5-small-mlx"

# =============================================================================
# Index — versioned index schema. Reported by /health as indexSchemaVersion.
# =============================================================================
index:
  # Integer schema version of the on-disk index layout. Bumped when the SQLite
  # / FTS5 / sqlite-vec schema changes in a way that requires a rebuild.
  schema_version: 1

# =============================================================================
# Logging
# =============================================================================
logging:
  # stdout log level. One of: debug | info | warning | error.
  # NOTE: this service NEVER logs memory content (entry text, queries) at any
  # level — only ids, kinds, counts, and scope ids. Raising to debug is safe.
  level: "info"

  # Days to retain rotated log files. Files older than this are deleted at
  # startup. Set to 0 to disable pruning. Range: 0-365.
  retention_days: 7

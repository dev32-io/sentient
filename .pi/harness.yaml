# PiBox harness repository policy.
# Keep this file portable: built-in agent definitions are inherited from PiBox.
schemaVersion: 2

modelTierListProfiles:
  defaultProfile: performance
  profiles:
    performance:
      max:
        - openai-codex/gpt-5.6-sol#max
        - ollama-cloud/deepseek-v4-pro:0813#off
      high:
        - openai-codex/gpt-5.6-sol#high
        - ollama-cloud/deepseek-v4-pro:0813#off
      medium:
        - openai-codex/gpt-5.6-sol#medium
        - ollama-cloud/deepseek-v4-flash#max
      low:
        - openai-codex/gpt-5.6-luna#high
        - ollama-cloud/deepseek-v4-flash#low
      local:
        - local-llm/qwen3.8-27b-uncensored#medium
        - local-llm/meta/muse-glimmer#high
    token-conservative:
      max:
        - openai-codex/gpt-5.6-sol#max
        - ollama-cloud/deepseek-v4-pro:0813#off
      high:
        - openai-codex/gpt-5.6-sol#high
        - ollama-cloud/deepseek-v4-pro:0813#off
      medium:
        - openai-codex/gpt-5.6-luna#max
        - ollama-cloud/deepseek-v4-flash#max
      low:
        - openai-codex/gpt-5.6-luna#high
        - ollama-cloud/deepseek-v4-flash#low
      local:
        - local-llm/qwen3.8-27b-uncensored#medium
        - local-llm/meta/muse-glimmer#high


orchestrator:
  modelSwitching: auto-visible

limits:
  maxConcurrency: 4
  maxActiveSubagentsPerSession: 16
  maxSubagentDepth: 1
  protocolNudges: 1
  repairRounds: 6

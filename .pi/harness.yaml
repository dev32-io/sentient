# PiBox harness repository policy.
# Keep this file portable: built-in agent definitions are inherited from PiBox.
schemaVersion: 2

modelTiers:
  max:
    - openai-codex/gpt-5.6-sol#high
    - ollama-cloud/deepseek-v4-pro#max
  high:
    - openai-codex/gpt-5.6-sol#medium
    - ollama-cloud/deepseek-v4-pro#high
  medium:
    - openai-codex/gpt-5.6-luna#max
    - ollama-cloud/deepseek-v4-flash#max
  low:
    - openai-codex/gpt-5.6-luna#low
    - ollama-cloud/deepseek-v4-flash#low

orchestrator:
  modelSwitching: auto-visible

limits:
  maxConcurrency: 4
  maxActiveSubagentsPerSession: 16
  maxSubagentDepth: 1
  protocolNudges: 1
  repairRounds: 3

version: 1
default: ask

permissions:
  allow:
    - Read(./**)
    - Ls(./**)
    - Find(./**)
    - Grep(./**)
    - Write(./**)
    - Edit(./**)
    - Bash(source scripts/env.sh)
    - Bash(git status*)
    - Bash(git diff*)
    - Bash(git log*)
    - Bash(git show*)
    - Bash(git branch*)
    - Bash(git rev-parse*)
    - Bash(git ls-files*)
    - Bash(bun run lint*)
    - Bash(bun run typecheck*)
    - Bash(bun run test*)
    - Bash(bun run ci*)
    - Bash(git diff --check*)
  ask:
    - Bash(git commit*)
    - Bash(git switch*)
    - Bash(git checkout*)
    - Bash(git merge*)
    - Bash(git rebase*)
    - Bash(git pull*)
    - Bash(bun install*)
    - Bash(docker *)
    - Bash(xcodebuild *)
    - Bash(./gradlew *)
    - Bash(esp32-devtool flash*)
  deny:
    - Bash(git push*)
    - Bash(git reset --hard*)
    - Bash(git clean*)
    - Bash(rm -rf /*)
    - Bash(sudo *)
    - Bash(ssh *)
    - Bash(scp *)
    - Bash(*launchctl*)
    - Bash(*setup-prod.py*)
    - Read(./.env*)
    - Read(./**/.env*)
    - Read(./*.key)
    - Read(./**/*.key)
    - Read(./**/*.pem)
    - Read(./**/*.p12)
    - Read(./**/*.keystore)
    - Read(./**/*.jks)
    - Read(~/.ssh/**)
    - Write(./.env*)
    - Write(./**/.env*)
    - Write(./*.key)
    - Write(./**/*.key)
    - Write(./**/*.pem)
    - Write(./**/*.p12)
    - Write(./**/*.keystore)
    - Write(./**/*.jks)
    - Write(~/.ssh/**)
    - Edit(./.env*)
    - Edit(./**/.env*)
    - Edit(./*.key)
    - Edit(./**/*.key)
    - Edit(./**/*.pem)
    - Edit(./**/*.p12)
    - Edit(./**/*.keystore)
    - Edit(./**/*.jks)
    - Edit(~/.ssh/**)

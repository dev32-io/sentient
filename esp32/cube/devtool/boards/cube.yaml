name: cube
display_name: "Sentient Cube (Waveshare ESP32-S3 AMOLED 2.16)"
chip: esp32-s3
firmware_path: esp32/cube/firmware
build_artifact: sentient_cube.elf
build_profiles: [debug, prod]

usb:
  vid: 0x303A
  pid: 0x1001
  port_glob: "/dev/cu.usbmodem*"

http:
  enabled: true
  port: 8081
  discover_via: usb-info               # cube /info verb returns ip

capabilities:
  flash:        { transport: usb-cdc }
  logs:         { transport: usb-cdc, sources: [usb] }
  cmd:          { transport: usb-cdc }
  screenshot:   { transport: http }
  touch:        { transport: http }
  audio_record: { transport: http }
  audio_inject: { transport: http }
  audio_play:   { transport: usb-cdc }

log_relay:
  # Match the debug firmware: UDP relay is disabled to preserve Wi-Fi buffers.
  enabled: false
  port: 9000

verbs:
  - sentient.status
  - sentient.force_reconnect
  - sentient.last_transcript
  - button.toggle
  - tts.cancel
  - state
  - cube.hardware.status
  - restart
  - log_level
  - mark
  - wifi.connect
  - wifi.disconnect
  - wifi.reconnect
  - audio.dump_state
  - audio.play_pcm
  - audio.test_tone

appId: io.dev32.sentient.debug
---
# login-temp1 — cold-launch (clearState wipes the persisted token, bypassing the
# real logout flow which is reserved for the dedicated 63-logout.yaml case) ->
# select the non-admin E2E Temp1 seed user (PIN 1111) -> chat screen. Used only
# for the non-admin-gate settings case; E2E Temp1/Temp2 are provisioned via the
# real UI "Add user" path by 41-members-add-cap.yaml and deleted by
# 43-members-delete-cleanup.yaml.
#
# NOTE: user ids are server-generated random hex, NOT deterministic — re-sync via
# GET /api/v1/admin/users after any fresh run of 41 before this flow (and
# 43-members-delete-cleanup.yaml) will work. Current as of the 2026-07-16
# settings-parity iOS E2E pass: u_11d9ec21 (Temp1).
#
# tags: [ios, simulator-ok]
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Who's here?"
    timeout: 8000
- tapOn:
    id: "login-avatar-u_11d9ec21"
- extendedWaitUntil:
    visible:
      id: "pin-key-1"
    timeout: 5000
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-1"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 15000

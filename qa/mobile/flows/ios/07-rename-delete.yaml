appId: io.dev32.sentient.debug
tags:
  - session
---
# 07-rename-delete — swipe a session row to rename, then delete it.
#
# FLAG (iOS): Maestro swipe-actions on SwiftUI List rows within a .sheet
# presentation are NOT driveable in Maestro 2.6.0 — the swipe dismisses the
# sheet instead of revealing the swipe actions. The affordances are wired and
# work with direct user interaction. This flow tests: panel opens → swipe attempt
# → no crash → back to chat. Resolution path: XCUITest `swipeLeft()` on the row,
# or a long-press context-menu variant on HistoryRow.
- runFlow: _helpers/login.yaml
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible: { id: "history-new-chat" }
    timeout: 3000
# Attempt swipe — likely dismisses the panel on iOS (documented limitation).
- swipe:
    direction: LEFT
    id: ".*history-row-.*"
# Panel may be dismissed; chat screen is the expected state.
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 3000
# App alive — no crash — the extent of what Maestro can verify here.
- assertVisible:
    id: "composer-input"

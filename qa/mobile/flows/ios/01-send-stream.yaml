appId: io.dev32.sentient.debug
tags:
  - chat
---
# 01-send-stream — type a message, send it, verify the assistant replies. Covers
# the full text-send -> gateway -> native ReAct loop -> streaming bubble path
# (Hermes is only a delegated tool on 2.0, never the agent runtime).
#
# iOS: composer-input (accessibilityIdentifier on the Composer TextField).
# assistant-bubble appears once the gateway streams the first token. After send,
# tap the message list to dismiss the keyboard (iOS hideKeyboard is unreliable
# with the custom composer; tapping the scroll area is more reliable).
- runFlow: _helpers/login.yaml
- tapOn:
    id: "composer-input"
- inputText: "what is 2 plus 2"
- tapOn:
    id: "chat-send"
# Dismiss keyboard by tapping the message list area so the assistant bubble shows.
- tapOn:
    id: "chat-message-list"
# assistant reply — provider round-trip inside the gateway's own loop, genuinely slow.
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 60000

appId: io.dev32.sentient.debug
---
# 01-send-stream — type a message, send it, and verify the assistant replies.
# Covers the full text-send → gateway → Hermes → streaming bubble path.
#
# iOS: composer-input (accessibilityIdentifier on the Composer TextField).
# assistant-bubble appears once the gateway streams the first token.
# After send, tap the message list to dismiss the keyboard (iOS hideKeyboard
# is unreliable with custom composer; tapping the scroll area is more reliable).
- launchApp
- assertVisible:
    id: "composer-input"
- tapOn:
    id: "composer-input"
- inputText: "what is 2 plus 2"
- tapOn:
    id: "chat-send"
# Dismiss keyboard by tapping the message list area so the assistant bubble is visible.
- tapOn:
    id: "chat-message-list"
- extendedWaitUntil:
    visible:
      id: "assistant-bubble"
    timeout: 40000

appId: io.dev32.sentient.debug
tags:
  - settings-diagnostics
---
# 30-send-diagnostic (iOS) — SentientMobileVitals manual-upload smoke (case T7).
#
# Flow: login → send one chat turn (so the rolling vitals file has content) →
# open the history side panel → Settings → Diagnostics category → tap
# settings-send-logs (expands the session list) → "This session" (newest) is
# default-selected → tap its Send → progress → "Sent ✓ — ref XXXX".
#
# The REAL assertion (a new file under ~/.sentient/gateway/clientLogs/mobile/ with
# a session-meta header, the gateway `diagnostics.received` log line, and absence
# of chat text) is verified out-of-band by the runner, not by Maestro.
#
# NOTE: on iOS SwiftUI the inner button's accessibilityIdentifier (settings-log-
# send / -sent) is NOT surfaced — only the row container id is. So drive + assert
# by the visible button TEXT ("This session" row owns the "Send" control).
- runFlow: _helpers/login.yaml
# One chat turn so the diagnostic log captures live session content.
- tapOn: { id: "composer-input" }
- inputText: "hi"
- tapOn: { id: "chat-send" }
- tapOn: { id: "chat-message-list" }
# assistant reply — provider round-trip, genuinely slow.
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 60000
# Open the history side panel → Settings → Diagnostics category.
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "history-new-chat" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-diagnostics" }
- extendedWaitUntil:
    visible: { id: "settings-send-logs" }
    timeout: 3000
- tapOn: { id: "settings-send-logs" }
- extendedWaitUntil:
    visible: { text: "This session" }
    timeout: 3000
- tapOn:
    text: "Send"
# control morphs: progress bar, then "Sent ✓ — ref XXXX" — upload round-trip
# (POST /api/v1/diagnostics/logs), genuinely slow.
- extendedWaitUntil:
    visible: { text: "Sent ✓.*" }
    timeout: 20000
- assertVisible:
    text: "Sent ✓.*"
- takeScreenshot: vitals-ios-sent

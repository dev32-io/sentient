appId: io.dev32.sentient.debug
tags:
  - chat
---
# 05-interrupt — send a long-reply prompt, assert streaming starts, app alive.
#
# This flow PASSES (driven 2026-07-30, Task 9e, 41s) — send -> stream -> app alive.
#
# INTERRUPT ARM: STILL UNASSERTED — see android/05-interrupt.yaml for the full
# reason. Short version: the ONE live blocker is chat-interrupt being gated on TTS
# audio state rather than cognition, so the session needs speak=true plus an armed
# audio downlink before the button exists. Two dead reasons, do not re-quote: D12
# is CLOSED (Task 9e), and "no local-tts reachable from the device" was never the
# blocker (the gateway dials local-tts over loopback).
- runFlow: _helpers/login.yaml
- tapOn:
    id: "composer-input"
- inputText: "tell me a very long story about the history of computing in great detail"
- tapOn:
    id: "chat-send"
- tapOn:
    id: "chat-message-list"
# streaming bubble proves send -> gateway -> native ReAct loop. Provider round-trip,
# genuinely slow (not a Hermes hop — Hermes is only a delegated tool on 2.0).
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 60000
# App alive — no crash. chat-interrupt not asserted (TTS off = not visible).
- assertVisible:
    id: "composer-input"

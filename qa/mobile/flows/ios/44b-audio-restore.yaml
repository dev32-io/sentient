appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - destructive-profile
  - restore
---
# 44b-audio-restore — flips "Speak responses (TTS)" back ON and saves, restoring
# the profile to its original state after 44-audio-fast-save.yaml. Self-navigating
# (does not assume 44 left the Audio screen open), so it is batch-safe on its own.
# Point-tap the switch (same RowToggle id-collision workaround as 44).
# Coordinate calibration basis (iPhone 17 / iOS 26.5, 402x874) is documented in
# 44-audio-fast-save.yaml — re-measure there with `inspect_screen`, never guess.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-audio"
- extendedWaitUntil:
    visible: { id: "settings-audio-screen" }
    timeout: 3000
# wait for the toggle ROW to be data-bound before point-tapping the switch.
- extendedWaitUntil:
    visible: { id: "settings-audio-tts" }
    timeout: 3000
- tapOn:
    point: "83%,26%"
# Save appears after the toggle state-update — wait for it (avoid the race).
- extendedWaitUntil:
    visible: { id: "settings-audio-save" }
    timeout: 3000
- tapOn:
    id: "settings-audio-save"
- extendedWaitUntil:
    notVisible: { id: "settings-audio-save" }
    timeout: 3000

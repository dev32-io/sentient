appId: io.dev32.sentient.debug
tags:
  - logout
---
# 09-logout — open the history side panel, tap settings-open (gear), logout.
# The gear (settings-open) lives in HistoryAccountHeader at the top of the side
# panel. After logout the app routes to the login screen (avatar grid +
# login-backend-setup button). Self-navigating (login helper first).
- runFlow: _helpers/login.yaml
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible: { id: "history-new-chat" }
    timeout: 3000
# Tap settings gear in the account header.
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible: { id: "settings-logout" }
    timeout: 3000
- tapOn:
    id: "settings-logout"
# logout: WS teardown + route to login — allow a short settle.
- extendedWaitUntil:
    visible: { id: "login-backend-setup" }
    timeout: 5000

appId: io.dev32.sentient.debug
tags:
  - helper
env:
  # QA_USER_ID — see the Android helper's header for the full story. Short
  # version: this is a SERVER-MINTED id that does not survive a gateway state
  # reset, so it is a variable with a pre-flighted default rather than a literal
  # baked into 40+ flows. Override per run with `-e QA_USER_ID=<id>`.
  QA_USER_ID: u_0417d3b0
---
# _helpers/login.yaml — reusable conditional login subflow (admin QA fixture
# user, PIN 1234).
#
# launchApp (no clearState): persisted token → chat directly; no token →
# "Who's here?" login screen. The conditional block logs in ONLY when the login
# screen is showing, so this is a no-op when already authenticated. Always ends
# on the chat screen with composer-input visible.
#
# Lives in _helpers/ (untagged) so Maestro's root-only folder discovery never
# runs it as a standalone flow. Reference from any auth-needing flow:
#   - runFlow: _helpers/login.yaml
- launchApp
- runFlow:
    when:
      visible: "Who's here?"
    commands:
      - tapOn:
          id: "login-avatar-${QA_USER_ID}"  # admin QA fixture avatar
      - extendedWaitUntil:
          visible: { id: "pin-key-1" }
          timeout: 3000
      - tapOn: { id: "pin-key-1" }
      - tapOn: { id: "pin-key-2" }
      - tapOn: { id: "pin-key-3" }
      - tapOn: { id: "pin-key-4" }          # PIN 1234
# login → chat: WS connect + session.ready handshake — genuinely slow, allow 15s.
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 15000

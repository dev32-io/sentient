appId: io.dev32.sentient.debug
---
# 02-drawer — history side drawer: button-open, then interactive edge-open +
# left-swipe close (the close-drag was the bug the SwiftUI rebuild fixed).
# history-open (hamburger) is top-left of the ChatTitleBar; history-new-chat and
# history-search are always present in the side panel.
- launchApp
# 1) Open via the title-bar hamburger button.
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible:
      id: "history-new-chat"
    timeout: 5000
- assertVisible:
    id: "history-search"
# 2) Close via a left-swipe drag on the open drawer (velocity snap → closed).
- swipe:
    start: "80%, 50%"
    end: "1%, 50%"
    duration: 300
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 5000
- assertNotVisible:
    id: "history-search"
# 3) Re-open via a left-edge-swipe drag (velocity snap → open).
# Note: 1–4% start positions are intercepted by Springboard edge swipe on iOS 26 beta
# + Maestro 2.6.0. The SideDrawer edgeZoneWidth is 40pt (≈10% at 393pt wide) so any
# start ≤ 10% is valid for edge-open. 8% avoids the Springboard system edge intercept.
- swipe:
    start: "8%, 50%"
    end: "85%, 50%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "history-search"
    timeout: 8000
- assertVisible:
    id: "history-new-chat"

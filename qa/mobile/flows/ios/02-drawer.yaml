appId: io.dev32.sentient.debug
tags:
  - session
---
# 02-drawer — history side drawer: button-open (reliable), then swipe-close and
# edge-open (the close-drag was the bug the SwiftUI rebuild fixed).
#
# GESTURE FLAKINESS: Maestro drives iOS drawer swipes unreliably. The button-open
# is strict; the swipe-close is wrapped in a retry (up to 3 attempts); the
# edge-swipe re-open is best-effort (Springboard intercepts the gesture). FLAG:
# reliable swipe-close + edge-open coverage needs XCUITest, not Maestro.
- runFlow: _helpers/login.yaml
# 1) Open via the title-bar hamburger button (reliable).
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible: { id: "history-new-chat" }
    timeout: 3000
- assertVisible:
    id: "history-search"
# 2) Close via a left-swipe drag on the open drawer (velocity snap → closed).
# Retried because the swipe registers intermittently in Maestro.
- retry:
    maxRetries: 2
    commands:
      - swipe:
          start: "80%, 50%"
          end: "1%, 50%"
          duration: 300
      - extendedWaitUntil:
          visible: { id: "composer-input" }
          timeout: 3000
      - assertNotVisible:
          id: "history-search"
# 3) Re-open via a left-edge-swipe drag. 8% start avoids the Springboard system
# edge intercept (SideDrawer edgeZoneWidth ≈10%). Best-effort — Maestro can't
# reliably drive iOS edge-swipes.
- swipe:
    start: "8%, 50%"
    end: "85%, 50%"
    duration: 400
# 8000ms: settings apply round-trip to the gateway
- extendedWaitUntil:
    visible: { id: "history-search" }
    timeout: 8000
    optional: true
- assertVisible:
    id: "history-new-chat"
    optional: true

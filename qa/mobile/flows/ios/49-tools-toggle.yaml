appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - slow
  - destructive-profile
---
# 49-tools-toggle — Tools page: disable the "fetch" MCP server, Save (slow path:
# apply/restart), persists (key removed from tools.enabled). Self-navigating.
# Re-enabled by 49b-tools-restore.yaml (adjacent).
#
# NOTE: unlike RowToggle (settings-audio-tts, see 44), ToolsServerCard's master
# Toggle sets its accessibilityIdentifier DIRECTLY on the Toggle control — `id:`
# tap works reliably here, no point-tap workaround needed.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-tools"
- extendedWaitUntil:
    visible: { id: "settings-tools-screen" }
    timeout: 3000
- assertVisible:
    id: "settings-tools-server-fetch"
# skill-system (mobile-skill-parity, tag settings-soul): the five gateway-native
# skill_* permission rows render under the "Gateway tools" card, and the
# skill_create dropdown is writable. Native rows carry accessibilityId
# settings-tools-native-<toolName>; the RowSelect Menu options carry
# settings-select-option-<permission>. Re-selecting the current default (ask)
# closes the Menu and arms an idempotent edit that the Save below round-trips —
# proving the native namespace reaches the settings PATCH. (iOS Menu renders
# options in a separate UIMenu presentation whose a11y tree is a known soft
# spot — if an option id is unreachable on-device, fall back to asserting the
# five rows only and dismiss with a tap outside the Menu.)
- scrollUntilVisible:
    element:
      id: "settings-tools-native-skill_create"
    direction: DOWN
    timeout: 3000
- assertVisible:
    id: "settings-tools-native-skill_list"
- assertVisible:
    id: "settings-tools-native-skill_use"
- assertVisible:
    id: "settings-tools-native-skill_create"
- assertVisible:
    id: "settings-tools-native-skill_update"
- assertVisible:
    id: "settings-tools-native-skill_delete"
- takeScreenshot: "49-skill-rows"
- tapOn:
    id: "settings-tools-native-skill_create"
- assertVisible:
    id: "settings-select-option-deny"   # dropdown writable
- tapOn:
    id: "settings-select-option-ask"     # current default; closes menu, no net change
- takeScreenshot: "49-tools-before"
- tapOn:
    id: "settings-tools-server-fetch"
- extendedWaitUntil:
    visible: { id: "settings-tools-save" }
    timeout: 3000
- tapOn:
    id: "settings-tools-save"
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 8000
- takeScreenshot: "49-tools-after"

appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - slow
  - destructive-profile
---
# 49-tools-toggle — Tools page: disable the "fetch" MCP server, Save (slow path:
# apply/restart), persists (key removed from tools.enabled). Self-navigating.
# Re-enabled by 49b-tools-restore.yaml (adjacent).
#
# NOTE: unlike RowToggle (settings-audio-tts, see 44), ToolsServerCard's master
# Toggle sets its accessibilityIdentifier DIRECTLY on the Toggle control — `id:`
# tap works reliably here, no point-tap workaround needed.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-tools"
- extendedWaitUntil:
    visible: { id: "settings-tools-screen" }
    timeout: 3000
- assertVisible:
    id: "settings-tools-server-fetch"
- takeScreenshot: "49-tools-before"
- tapOn:
    id: "settings-tools-server-fetch"
- extendedWaitUntil:
    visible: { id: "settings-tools-save" }
    timeout: 3000
- tapOn:
    id: "settings-tools-save"
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 8000
- takeScreenshot: "49-tools-after"

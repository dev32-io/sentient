appId: io.dev32.sentient.debug
tags:
  - logout
---
# 63-logout — root Settings "Log out" → back to login screen; token cleared.
# Sorted last so, in an ordered full pass, every other mutation is already
# restored before the session is torn down. Self-navigating (open-settings helper).
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-logout"
# logout: WS teardown + route to login — allow a short settle.
- extendedWaitUntil:
    visible: "Who's here?"
    timeout: 5000
- assertNotVisible:
    id: "composer-input"
- takeScreenshot: "63-logout-at-login"

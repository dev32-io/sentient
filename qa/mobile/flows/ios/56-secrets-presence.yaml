appId: io.dev32.sentient.debug
tags:
  - settings-admin
---
# 56-secrets-presence — admin Secrets page: presence-only verification. NO real
# key writes (the active ollama-cloud key is live and must not be touched).
# Verifies masked rows render, active provider is indicated, and the Update-key
# editor opens/cancels without submitting. Self-navigating. Not destructive (the
# editor is cancelled, never submitted).
#
# DEFECT (iOS, id-collision family): SecretKeyRow sets accessibilityIdentifier on
# the whole row VStack; per-control suffixes never reach the tree (all descendants
# report the bare "settings-secret-<idKey>"). Point-tap the Update button by
# position; the resulting SecureField + Save/Cancel are text-selectable.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-secrets"
- extendedWaitUntil:
    visible: { id: "settings-secrets-screen" }
    timeout: 3000
- assertVisible:
    id: "settings-secret-openrouter"
- assertVisible:
    id: "settings-secret-ollama-cloud"
- assertVisible:
    id: "settings-secret-custom"
- assertVisible: "active"
- takeScreenshot: "56-secrets-presence"
# open the Update-key editor for a NON-active provider (openrouter) then Cancel —
# never submit, never touch the live active key.
- tapOn:
    point: "86%,22%"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 3000
- takeScreenshot: "56-secrets-editor-open"
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Save"
    timeout: 3000
- takeScreenshot: "56-secrets-cancelled"

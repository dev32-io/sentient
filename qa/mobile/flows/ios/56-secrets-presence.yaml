appId: io.dev32.sentient.debug
---
# 56-secrets-presence — admin Secrets page: presence-only verification. NO real
# key writes (per task discipline — the active ollama-cloud key is live and
# must not be touched). Verifies masked rows render, active provider is
# indicated, and the Update-key editor opens/cancels without submitting.
# Run login.yaml immediately before this.
#
# DEFECT (iOS, SAME id-collision family as RowToggle/MemberRow/RowSegmented/
# VoiceRowView): SecretKeyRow sets accessibilityIdentifier on the whole row
# VStack; the "-update"/"-input"/"-save" per-control suffixes SecretRowView.
# swift sets never reach the tree (all descendants report the bare
# "settings-secret-<idKey>" id). Point-tap the Update button by position; the
# resulting SecureField + Save/Cancel are text-selectable ("Cancel").
#
# tags: [ios, simulator-ok]
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible:
      id: "history-new-chat"
    timeout: 5000
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- tapOn:
    id: "settings-cat-secrets"
- extendedWaitUntil:
    visible:
      id: "settings-secrets-screen"
    timeout: 5000
- assertVisible:
    id: "settings-secret-openrouter"
- assertVisible:
    id: "settings-secret-ollama-cloud"
- assertVisible:
    id: "settings-secret-custom"
- assertVisible: "active"
- takeScreenshot: "56-secrets-presence"
# open the Update-key editor for a NON-active provider (openrouter, has_key
# false) then Cancel — never submit, never touch the live active key.
- tapOn:
    point: "86%,22%"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 5000
- takeScreenshot: "56-secrets-editor-open"
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Save"
    timeout: 5000
- takeScreenshot: "56-secrets-cancelled"

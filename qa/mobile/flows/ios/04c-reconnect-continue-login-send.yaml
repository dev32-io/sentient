appId: io.dev32.sentient.debug
tags:
  - reconnect
---
# 04c (part 1/2, iOS) — reconnect conversation-continuity, FIRST turn.
#
# Validates the same fix as Android 04c: on reconnect the SDK sends
# `conversationId` in `session.configure`; the gateway re-anchors so the
# follow-up CONTINUES the same Hermes conversation (gateway log
# `resume.reanchor source=configure`, same conversationId, no
# dispatch.session-new.lazy). The fix lives in shared commonMain.
#
# COUPLED PAIR: the reconnect is forced BETWEEN this flow and 04c-followup by
# the runner (NOT a Maestro step) — `docker restart sentient-gateway` drops the
# WS while the app process stays alive (in-memory currentSessionId survives),
# then the SDK reconnects and re-sends configure with conversationId. Run these
# two adjacent, in order; the followup does NOT relaunch. Without the runner's
# restart the pair still passes but does not exercise the reconnect path.
- runFlow: _helpers/login.yaml
- tapOn:
    id: "new-chat"
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 3000
- tapOn: { id: "composer-input" }
- inputText: "My lucky color is teal. Please remember it."
- tapOn: { id: "chat-send" }
- tapOn: { id: "chat-message-list" }
# assistant reply — Hermes LLM round-trip, genuinely slow.
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 60000

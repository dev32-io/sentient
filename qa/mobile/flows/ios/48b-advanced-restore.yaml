appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - slow
  - destructive-profile
  - restore
---
# 48b-advanced-restore — restores reasoning=minimal, compression=0.50, max
# tokens=1024 after 48-advanced-sliders.yaml. Self-navigating (does not assume 48
# left the Advanced screen open).
#
# Slider-math (confirmed live): the DISPLAYED value (e.g. "95%") is NOT the
# screen-x to swipe from — the track spans screen x≈9%–91%, so the thumb's
# screen-x fraction is `0.09 + value*0.82`. The ~87% start below grabs the real
# thumb for compression; a drag isn't pixel-exact against a 0.05 step, hence the
# short nudge swipes.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-advanced"
- extendedWaitUntil:
    visible: { id: "settings-advanced-screen" }
    timeout: 3000
- tapOn:
    id: "settings-advanced-reasoning"
- tapOn: "Minimal"
- assertVisible: "Minimal"
- swipe:
    start: "87%,29%"
    end: "50%,29%"
    duration: 800
- swipe:
    start: "45%,29%"
    end: "52%,29%"
    duration: 500
- swipe:
    start: "55%,29%"
    end: "51%,29%"
    duration: 500
- assertVisible:
    text: "50%"
- swipe:
    start: "65%,38%"
    end: "18%,38%"
    duration: 800
- extendedWaitUntil:
    visible: { id: "settings-advanced-save" }
    timeout: 3000
- tapOn:
    id: "settings-advanced-save"
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 8000

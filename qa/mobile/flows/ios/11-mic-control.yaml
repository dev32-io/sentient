appId: io.dev32.sentient.debug
tags:
  - voice-loop
---
# 11-mic-control — tap chat-mic to start voice mode, then stop (control-plane
# only). This is the iOS voice surface; there is no full STT→LLM→TTS loop flow
# on iOS (no sim fixture-injection channel), so this asserts the mic toggle
# round-trips without crashing.
#
# iOS: RECORD_AUDIO permission must be granted before the mic toggles — the
# runner pre-grants via `xcrun simctl privacy <udid> grant microphone
# io.dev32.sentient.debug` before this flow (Maestro cannot dismiss the system
# alert).
- runFlow: _helpers/login.yaml
# Tap mic to activate voice mode.
- tapOn:
    id: "chat-mic"
# No distinguishable accent-state id — confirm the button survives (no crash).
- assertVisible:
    id: "chat-mic"
# Tap mic again to deactivate.
- tapOn:
    id: "chat-mic"
- assertVisible:
    id: "chat-mic"

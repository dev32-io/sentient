appId: io.dev32.sentient.debug
---
# 62b-fish-clone-cleanup — Voice settings page: delete the Fish-cloned pack
# from 62-fish-clone-happy.yaml (cloning auto-activates it) and restore the
# active voice to Jarvis. Mirrors 54b-voice-restore.yaml. Run immediately
# after 62 (already on Voice screen, "Yours" tab active).
#
# NOTE: id below is server-random per clone — re-sync via GET /api/v1/voices
# after any fresh 62 run. Current as of the 2026-07-16 settings-parity iOS
# E2E pass: 5c207488c3064ea5b4ef9b3c454c4168. Point-tap positions computed
# from a live `maestro hierarchy` dump on the "Yours" filter (2 rows: the
# clone at y≈423-526, Jarvis at y≈559-663) — same id-collision workaround as
# case 54/55.
#
# tags: [ios, simulator-ok]
- tapOn:
    point: "91%,49%"
- extendedWaitUntil:
    visible: "Delete \"Deep Voice English (Anthony)\"?"
    timeout: 5000
- takeScreenshot: "62b-fish-delete-confirm"
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Deep Voice English.*"
    timeout: 10000
- takeScreenshot: "62b-fish-deleted"
# restore active voice to Jarvis (clone auto-activated the now-deleted pack) —
# after delete, Jarvis is the only "Yours" row, shifted up to the first slot.
- tapOn:
    point: "50%,54%"
- extendedWaitUntil:
    visible: "Active"
    timeout: 10000
- takeScreenshot: "62b-voice-restored-jarvis"

appId: io.dev32.sentient.debug
tags:
  - auth
env:
  # See _helpers/login.yaml for why the avatar id is a variable, not a literal.
  QA_USER_ID: u_0417d3b0
---
# 00-login — standalone auth smoke (case T1). clearState wipes the persisted
# token, then a real avatar + PIN 1234 login lands on the chat screen. This is
# the ONE flow that actually exercises the login path end-to-end; the
# _helpers/login.yaml subflow used elsewhere is a no-op when a token persists.
# Leaves the app logged in as the QA fixture user, priming the rest of a batch run.
- launchApp:
    clearState: true
# cold clearState launch + avatar-grid fetch from the gateway.
- extendedWaitUntil:
    visible: "Who's here?"
    timeout: 5000
- tapOn:
    id: "login-avatar-${QA_USER_ID}"
- extendedWaitUntil:
    visible: { id: "pin-key-1" }
    timeout: 3000
- tapOn: { id: "pin-key-1" }
- tapOn: { id: "pin-key-2" }
- tapOn: { id: "pin-key-3" }
- tapOn: { id: "pin-key-4" }
# login → chat: WS connect + session.ready handshake — genuinely slow, allow 15s.
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 15000
- assertVisible:
    id: "composer-input"

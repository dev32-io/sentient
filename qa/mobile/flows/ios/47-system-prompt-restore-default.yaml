appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - slow
  - destructive-profile
  - restore
---
# 47-system-prompt-restore-default — System Prompt page: "Restore default" →
# confirm → Save applies the canonical Soul.md template (SLOW path: PUT + POST
# /profile/apply). Self-navigating. Self-restoring: it first appends a marker +
# Saves (a genuinely non-default pre-state), THEN Restore Default → Save. Because
# this seed profile's soul already EQUALS the canonical default byte-for-byte,
# this converges back to the byte-exact original with no extra restore step (both
# tags destructive-profile + restore apply — mutate then revert in one flow).
# If a future profile's soul diverges from default, add a `PUT /profile/soul` +
# `POST /profile/apply` restore step using content captured via GET beforehand.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-system-prompt"
- extendedWaitUntil:
    visible: { id: "settings-system-prompt-screen" }
    timeout: 3000
- takeScreenshot: "47-system-prompt-before"
# Establish a genuinely dirty, non-default pre-state (see header).
- tapOn:
    id: "settings-system-prompt-editor"
- inputText: "

## E2E marker (temporary — restored by Restore Default below)"
- extendedWaitUntil:
    visible: { id: "settings-system-prompt-save" }
    timeout: 3000
- tapOn:
    id: "settings-system-prompt-save"
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 8000
- takeScreenshot: "47-system-prompt-edited-marker"
# Restore default → confirm → Save (real diff now: marker vs canonical default).
- tapOn:
    id: "settings-system-prompt-restore"
- extendedWaitUntil:
    visible: "Restore default Soul.md?"
    timeout: 3000
- tapOn: "Restore"
- extendedWaitUntil:
    visible: { id: "settings-system-prompt-save" }
    timeout: 3000
- takeScreenshot: "47-system-prompt-restored-dirty"
- tapOn:
    id: "settings-system-prompt-save"
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 8000
- takeScreenshot: "47-system-prompt-after-default-applied"

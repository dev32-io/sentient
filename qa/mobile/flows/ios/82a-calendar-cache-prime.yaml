appId: io.dev32.sentient.debug
tags: [helper, fault-armed]
---
# Online phase. Seed CALENDAR_CACHED_EVENT_TAG in this run's unique namespace.
# After this flow, seed CALENDAR_RECOVERY_EVENT_TAG online, stop the local gateway
# with the existing direct control, then invoke 82.
- runFlow: _calendar/open-calendar.yaml
- extendedWaitUntil:
    visible: { id: "calendar-freshness-up-to-date" }
    timeout: 20000
- assertVisible: { id: "${CALENDAR_CACHED_EVENT_TAG}" }
- assertNotVisible: { id: "${CALENDAR_RECOVERY_EVENT_TAG}" }
- stopApp

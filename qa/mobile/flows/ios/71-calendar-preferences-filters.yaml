appId: io.dev32.sentient.debug
tags:
  - helper
---
- runFlow: _calendar/open-calendar.yaml
- tapOn: { id: "calendar-view-week" }
- tapOn: { id: "calendar-filter-scope-private" }
- tapOn: { id: "calendar-filter-tag-0", optional: true }
- tapOn: { id: "calendar-filter-search" }
- inputText: "${CALENDAR_FILTER_TEXT}"
- hideKeyboard
- takeScreenshot: "calendar-filters"
- tapOn: { id: "calendar-back" }
- tapOn: { id: "settings-cat-calendar" }
- extendedWaitUntil:
    visible: { id: "calendar-view-week" }
    timeout: 10000
- assertVisible: { id: "calendar-filter-scope-private" }

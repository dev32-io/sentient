appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - slow
  - destructive-profile
---
# 48-advanced-sliders — Advanced page: set reasoning, compression, and max-tokens
# to non-default values, Save triggers the SLOW path (apply/restart).
# Self-navigating. Restored by 48b-advanced-restore.yaml (adjacent).
#
# RowSelect's native SwiftUI Menu options are reachable by visible TEXT (no
# per-option accessibilityIdentifier — text is the correct selector). RowSlider
# is a native SwiftUI Slider — a plain tap on the track does NOT move it; it needs
# a drag (`swipe`) starting AT the thumb's current on-screen position, duration
# >=600ms so it registers as a continuous drag. Baseline (GET /profile/me):
# reasoning=minimal, compression=0.50 (thumb ≈50% screen-x), maxTokens=1024
# (thumb ≈18% screen-x).
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-advanced"
- extendedWaitUntil:
    visible: { id: "settings-advanced-screen" }
    timeout: 3000
- assertVisible:
    id: "settings-advanced-reasoning"
- assertVisible:
    id: "settings-advanced-compression"
- assertVisible:
    id: "settings-advanced-max-tokens"
- takeScreenshot: "48-advanced-before"
# reasoning: minimal → high
- tapOn:
    id: "settings-advanced-reasoning"
- tapOn: "High"
- assertVisible: "High"
# compression: 50% → ~90% (drag from the thumb's current screen position)
- swipe:
    start: "50%,29%"
    end: "83%,29%"
    duration: 800
# max tokens: 1024 (~18% along the track) → a mid-high value (~65%)
- swipe:
    start: "18%,38%"
    end: "65%,38%"
    duration: 800
- extendedWaitUntil:
    visible: { id: "settings-advanced-save" }
    timeout: 3000
- takeScreenshot: "48-advanced-dirty"
- tapOn:
    id: "settings-advanced-save"
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 8000
- takeScreenshot: "48-advanced-after"

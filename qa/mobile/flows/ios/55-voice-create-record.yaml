appId: io.dev32.sentient.debug
---
# 55-voice-create-record — Voice settings page: Add Voice -> record ~10s (min
# 6s per VoiceAddViewModel.minRecordingSeconds) -> play check -> name +
# language -> submit. Requires mic permission granted beforehand:
#   xcrun simctl privacy <udid> grant microphone io.dev32.sentient.debug
#
# ENV-BLOCKED on this pass (confirmed live, not an app defect): tapping
# "Record" blocks the main thread for ~30s (AVAudioRecorder/AVAudioSession
# setup), then the app correctly and gracefully surfaces "Couldn't start
# recording" (SoulNoticeBanner-style inline error, no crash) and resets to
# idle. Root-caused via `system_profiler SPAudioDataType` (host HAS a working
# "MacBook Pro Microphone", default input) + Simulator.app's own I/O > Audio
# Input menu (introspected via AppleScript/System Events): the submenu
# enumerates ZERO devices in this sandboxed agent session, meaning
# Simulator.app itself has no host-microphone bridge available — almost
# certainly a macOS Automation/TCC permission gap for headless execution (the
# interactive "Simulator wants to access the microphone" system prompt has no
# one to answer it), NOT a codebase bug. The per-app iOS mic permission (via
# `simctl privacy grant microphone`) is a SEPARATE, lower layer that succeeds
# independently — this failure is one level above, at the simulator-host
# bridge. Flagged per task discipline as env-blocked rather than faked; the
# app's OWN error-surfacing behavior (graceful banner, no crash, resets
# cleanly to idle) is itself a positive signal worth keeping in the flow below
# as a real, reachable assertion.
#
# ALSO would exercise twin-check #3 (voice list refresh after Add pop-back:
# iOS posts `.voiceLibraryChanged` via NotificationCenter, VoiceScreen
# subscribes via `.onReceive`) — UNVERIFIED this pass since create never
# reaches submit. Re-run on a host/session with a working Simulator audio
# bridge (or a physical device) to complete this case AND the twin-check.
#
# tags: [ios, simulator-ok, slow, env-blocked]
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible:
      id: "history-new-chat"
    timeout: 5000
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- tapOn:
    id: "settings-cat-voice"
- extendedWaitUntil:
    visible:
      id: "settings-voice"
    timeout: 5000
- tapOn:
    id: "settings-voice-add-nav"
- extendedWaitUntil:
    visible:
      id: "settings-voice-add"
    timeout: 5000
- takeScreenshot: "55-voice-add-idle"
- tapOn:
    id: "settings-voice-add-record"
# main-thread block can take ~30s before the graceful failure banner renders
- extendedWaitUntil:
    visible: "Couldn't start recording"
    timeout: 40000
- takeScreenshot: "55-voice-record-env-blocked-error"
# app stays alive and usable — Record button is back to idle, no crash
- assertVisible:
    id: "settings-voice-add-record"

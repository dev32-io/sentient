appId: io.dev32.sentient.debug
tags:
  - settings-voice
  - slow
---
# 55-voice-create-record — Voice page: Add Voice → record (min 6s) → play → name
# + language → submit. Self-navigating. Requires mic permission:
#   xcrun simctl privacy <udid> grant microphone io.dev32.sentient.debug
#
# ENV-BLOCKED (confirmed live, NOT an app defect): tapping "Record" blocks the
# main thread ~30s (AVAudioRecorder setup), then the app gracefully surfaces
# "Couldn't start recording" (inline error, no crash) and resets to idle.
# Root cause: Simulator.app has no host-microphone bridge in a sandboxed agent
# session (the interactive mic-access system prompt has no one to answer it).
# This flow asserts the app's OWN graceful-error behavior (a real, reachable
# assertion). Re-run on a host/session with a working Simulator audio bridge (or
# a physical device) to complete the create+submit path and voice-list refresh.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-voice"
- extendedWaitUntil:
    visible: { id: "settings-voice" }
    timeout: 3000
- tapOn:
    id: "settings-voice-add-nav"
- extendedWaitUntil:
    visible: { id: "settings-voice-add" }
    timeout: 3000
- takeScreenshot: "55-voice-add-idle"
- tapOn:
    id: "settings-voice-add-record"
# main-thread block can take ~30s before the graceful failure banner renders —
# env-blocked, genuinely slow.
- extendedWaitUntil:
    visible: "Couldn't start recording"
    timeout: 40000
- takeScreenshot: "55-voice-record-env-blocked-error"
# app stays alive and usable — Record button is back to idle, no crash.
- assertVisible:
    id: "settings-voice-add-record"

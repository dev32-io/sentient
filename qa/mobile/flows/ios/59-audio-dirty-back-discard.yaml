appId: io.dev32.sentient.debug
---
# 59-audio-dirty-back-discard — Audio settings page: make a dirty change (TTS
# toggle) then tap back -> discard confirm -> Discard restores the ORIGINAL
# value (no PUT fired). Run login.yaml immediately before this.
#
# tags: [ios, simulator-ok]
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible:
      id: "history-new-chat"
    timeout: 5000
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- tapOn:
    id: "settings-cat-audio"
- extendedWaitUntil:
    visible:
      id: "settings-audio-screen"
    timeout: 5000
- assertNotVisible:
    id: "settings-audio-save"
# same RowToggle id-collision workaround as case 44 — point-tap the switch
- tapOn:
    point: "85%,24%"
- assertVisible:
    id: "settings-audio-save"
- takeScreenshot: "59-audio-dirty"
- tapOn:
    id: "settings-audio-back"
- extendedWaitUntil:
    visible: "Discard changes?"
    timeout: 5000
- tapOn: "Discard"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- takeScreenshot: "59-audio-discarded-back-at-root"

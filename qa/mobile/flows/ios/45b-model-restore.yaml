appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - slow
  - destructive-profile
  - restore
---
# 45b-model-restore — restores the original model (deepseek-v4-flash:cloud) after
# 45-model-slow-save.yaml. Self-navigating (does not assume 45 left the Model
# screen open), so it is batch-safe on its own.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-model"
- extendedWaitUntil:
    visible: { id: "settings-model-screen" }
    timeout: 3000
- tapOn:
    id: "settings-model-search"
- inputText: "deepseek-v4-flash"
- extendedWaitUntil:
    visible: { id: "settings-model-card-deepseek-v4-flash:cloud" }
    timeout: 3000
- tapOn:
    id: "settings-model-card-deepseek-v4-flash:cloud"
- extendedWaitUntil:
    visible: { id: "settings-model-save" }
    timeout: 3000
- tapOn:
    id: "settings-model-save"
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 8000

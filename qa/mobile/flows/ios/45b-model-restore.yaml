appId: io.dev32.sentient.debug
---
# 45b-model-restore — restores the original model (deepseek-v4-flash:cloud) after
# 45-model-slow-save.yaml. Run immediately after 45 (same Model screen still
# open).
#
# tags: [ios, simulator-ok]
- tapOn:
    id: "settings-model-search"
- eraseText: 30
- inputText: "deepseek-v4-flash"
- extendedWaitUntil:
    visible:
      id: "settings-model-card-deepseek-v4-flash:cloud"
    timeout: 5000
- tapOn:
    id: "settings-model-card-deepseek-v4-flash:cloud"
- assertVisible:
    id: "settings-model-save"
- tapOn:
    id: "settings-model-save"
# the apply-notice window can be brief on a fast local stack — tolerate a short
# race instead of asserting it's visible at the exact instant after the tap
- extendedWaitUntil:
    visible:
      id: "settings-applying"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "settings-applying"
    timeout: 45000

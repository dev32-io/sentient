appId: io.dev32.sentient.debug
tags:
  - settings-root
---
# 40-settings-root — Settings root list renders grouped categories + Admin group
# gated on isAdmin + version footer at the bottom. Self-navigating: login → open
# Settings root (via _helpers/open-settings.yaml).
#
# Unlike Android, the whole root list (categories + logout + footer) fits in ONE
# SwiftUI ScrollView on an iPhone 16 Pro without scrolling.
- runFlow: _helpers/open-settings.yaml
# Soul group
- assertVisible:
    id: "settings-cat-memory"
- assertVisible:
    id: "settings-cat-personalities"
- assertVisible:
    id: "settings-cat-voice"
- assertVisible:
    id: "settings-cat-audio"
- assertVisible:
    id: "settings-cat-model"
- assertVisible:
    id: "settings-cat-tools"
- assertVisible:
    id: "settings-cat-system-prompt"
- assertVisible:
    id: "settings-cat-advanced"
# User group
- assertVisible:
    id: "settings-cat-account"
- assertVisible:
    id: "settings-cat-devices"
- takeScreenshot: "40-settings-root-admin"
# Admin group (this test user IS admin)
- assertVisible:
    id: "settings-cat-members"
- assertVisible:
    id: "settings-cat-secrets"
# Support group + footer
- assertVisible:
    id: "settings-cat-diagnostics"
- assertVisible:
    id: "settings-logout"
- assertVisible:
    id: "settings-version"
- assertVisible:
    id: "settings-update-action"
- takeScreenshot: "40-settings-root-footer"

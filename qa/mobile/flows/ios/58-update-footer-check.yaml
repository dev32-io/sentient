appId: io.dev32.sentient.debug
tags:
  - update
---
# 58-update-footer-check — Settings root footer: tap "Check for updates" →
# "Checking…" (spinner, disabled) → resolves to "✓ Up to date" (transient ~3s) →
# back to "Check for updates". Self-navigating.
- runFlow: _helpers/open-settings.yaml
- assertVisible:
    id: "settings-update-action"
- takeScreenshot: "58-update-idle"
- tapOn:
    id: "settings-update-action"
# NOTE: on a fast local stack the "Checking…" spinner + the "✓ Up to date"
# transient can both resolve between two Maestro commands — assert on "✓ Up to
# date" directly (not "Checking…" first) to catch a frame before it reverts.
# Update check hits the release registry — genuinely slow.
- extendedWaitUntil:
    visible: "✓ Up to date"
    timeout: 8000
- takeScreenshot: "58-update-uptodate"
# transient resolves back to idle.
- extendedWaitUntil:
    visible: { id: "settings-update-action" }
    timeout: 6000
- takeScreenshot: "58-update-idle-again"

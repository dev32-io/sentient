appId: io.dev32.sentient.debug
tags:
  - settings-admin
  - destructive-profile
  - restore
---
# 43-members-delete-cleanup — admin Members page: delete both E2E Temp1/Temp2
# seed users (created by 41), restoring the household to 1/3 (Kevin only). This
# is the restore for the whole 41→42→43 trio: a leading clearState forces back
# to Kevin's session (Temp1 is logged in from 42) via the login+settings helper,
# then deletes both temps by point-tap.
#
# DEFECT (iOS, id-collision family): MemberRow's per-action ids (toggle/delete)
# never reach the tree — every descendant reports the outer row's bare
# "settings-member-<userId>". "Trash"/"Promote" text is also ambiguous. Point-tap
# the trash icon; robust to the server-random user ids (no id dependency here).
- launchApp:
    clearState: true
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-members"
- extendedWaitUntil:
    visible: { id: "settings-members-screen" }
    timeout: 3000
# delete E2E Temp1 (first data row's trash icon).
- tapOn:
    point: "89%,29%"
- extendedWaitUntil:
    visible: "Remove"
    timeout: 3000
- tapOn: "Remove"
# member delete POST + count update — network op.
- extendedWaitUntil:
    visible: { text: ".*2 active.*" }
    timeout: 8000
- takeScreenshot: "43-members-after-temp1"
# delete E2E Temp2 — the list re-renders and Temp2 shifts into Temp1's slot, so
# the same on-screen point works again.
- tapOn:
    point: "89%,29%"
- extendedWaitUntil:
    visible: "Remove"
    timeout: 3000
- tapOn: "Remove"
# 8000ms: settings apply round-trip to the gateway
- extendedWaitUntil:
    visible: { text: ".*1 active.*" }
    timeout: 8000
- takeScreenshot: "43-members-restored"

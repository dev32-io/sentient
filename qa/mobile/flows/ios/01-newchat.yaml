appId: io.dev32.sentient.debug
tags:
  - chat
---
# 01-newchat — validates the new-chat committed-reply render fix on iOS.
# A NEW chat (fresh chain) previously failed to render the committed assistant
# reply on mobile because the cache anchor stayed null (gateway minted the
# session id lazily, invisible to the client). The gateway now mints + broadcasts
# session.created on the fresh-chain first message; the iOS ChatViewModel
# re-anchors the cache on currentSessionId. This flow proves the committed reply
# renders on iOS.
#
# Flow: login → new chat → composer → send → assert both the user message AND a
# committed assistant reply render.
- runFlow: _helpers/login.yaml
# Force a fresh chain: tap new-chat (the "+" in the title bar) so the cache anchor
# starts null — the exact state the fix repairs.
- tapOn:
    id: "new-chat"
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 3000
- tapOn:
    id: "composer-input"
- inputText: "what is 8 plus 9"
- tapOn:
    id: "chat-send"
# Optimistic user echo renders immediately.
- extendedWaitUntil:
    visible: "what is 8 plus 9"
    timeout: 3000
# Dismiss the keyboard by tapping the message list so the assistant bubble shows.
- tapOn:
    id: "chat-message-list"
# COMMITTED assistant reply (the fix under test) — provider round-trip, slow.
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 60000

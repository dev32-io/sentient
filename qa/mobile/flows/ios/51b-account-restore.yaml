appId: io.dev32.sentient.debug
---
# 51b-account-restore — restores display name to "Kevin" after
# 51-account-rename.yaml. Run immediately after 51 (same Account screen open).
#
# tags: [ios, simulator-ok]
- tapOn:
    id: "settings-account-name"
- eraseText: 20
- inputText: "Kevin"
- tapOn:
    id: "settings-account-save"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 10000

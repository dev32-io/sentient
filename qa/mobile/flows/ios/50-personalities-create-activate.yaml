appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - slow
  - destructive-profile
---
# 50-personalities-create-activate — Personalities page starting empty: create
# "e2e-test", then Activate. Self-navigating + self-cleaning (deletes the entry
# at the end regardless of outcome), so it leaves no net profile mutation.
#
# DEFECT-4 (backend, confirmed live, NOT mobile-specific): writeRendered()
# overwrites config.yaml from ProfileV1 fields only, racing the personality-store
# read-modify-write on the same restart cycle — create() persists, activate()
# silently no-ops (activeName stays null). The end-of-flow delete restores the
# empty baseline regardless of which failure shape occurs.
#
# DEFECT (iOS): the personality card's Button has NO .contentShape(Rectangle())
# — only the glyph content (text + chevron) is tap-hittable, not the row's
# transparent middle. `tapOn: id:` resolves to the bounds CENTER (dead zone) and
# no-ops. Point-tap the chevron at the row's right edge to expand.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-personalities"
- extendedWaitUntil:
    visible: { id: "settings-personalities-screen" }
    timeout: 3000
- takeScreenshot: "50-personalities-empty"
- tapOn:
    id: "settings-personalities-create"
- extendedWaitUntil:
    visible: { id: "settings-personalities-create-sheet" }
    timeout: 3000
- tapOn:
    id: "settings-personalities-new-name"
- inputText: "e2e-test"
- tapOn:
    id: "settings-personalities-new-submit"
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# personality create → store apply, genuinely slow.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 20000
    optional: true
- takeScreenshot: "50-personalities-after-create"
# expand the card: tap the CHEVRON, not the row id/center (see DEFECT above).
- tapOn:
    point: "89%,21%"
- extendedWaitUntil:
    visible: { id: "settings-personalities-activate-e2e-test" }
    timeout: 3000
- takeScreenshot: "50-personalities-expanded"
- tapOn:
    id: "settings-personalities-activate-e2e-test"
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# activate → apply/restart, genuinely slow.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 20000
- takeScreenshot: "50-personalities-defect4-check"
# cleanup: delete the entry regardless of whether activate wiped it or not.
- tapOn:
    id: "settings-personalities-delete-e2e-test"
    optional: true
- extendedWaitUntil:
    visible: "Delete this personality?"
    timeout: 3000
    optional: true
- tapOn:
    text: "Delete"
    optional: true
- extendedWaitUntil:
    visible: { id: "settings-applying" }
    timeout: 3000
    optional: true
# delete → apply/restart, genuinely slow.
- extendedWaitUntil:
    notVisible: { id: "settings-applying" }
    timeout: 20000
- takeScreenshot: "50-personalities-cleanup-final"

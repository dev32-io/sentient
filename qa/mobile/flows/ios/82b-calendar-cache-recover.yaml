appId: io.dev32.sentient.debug
tags: [helper, fault-armed]
---
# Restore the native network path before invoking. Do not relaunch or navigate: automatic
# revalidation must update the same visible Calendar without blanking cache.
- assertVisible: { id: "${CALENDAR_CACHED_EVENT_TAG}" }
- extendedWaitUntil:
    visible: { id: "${CALENDAR_RECOVERY_EVENT_TAG}" }
    timeout: 20000
- assertVisible: { id: "${CALENDAR_CACHED_EVENT_TAG}" }
- assertNotVisible: { id: "calendar-freshness-offline" }
- assertNotVisible: { id: "calendar-freshness-stale" }
- assertNotVisible: { id: "calendar-freshness-refreshing" }
- assertVisible:
    id: "calendar-add"
    enabled: true

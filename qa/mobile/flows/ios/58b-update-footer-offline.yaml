appId: io.dev32.sentient.debug
tags:
  - update
  - fault-armed
---
# 58b-update-footer-offline — Settings root footer with the gateway DOWN: tap
# "Check for updates" → "Checking…" → "Check failed — Retry", app stays alive.
#
# fault-armed (iOS): the runner stops the gateway before this flow. Unlike
# 60-model-offline (needs a gateway-populated list), the update button is static
# and the Settings root renders client-side, so this self-navigates fine with the
# gateway already stopped.
- runFlow: _helpers/open-settings.yaml
- assertVisible:
    id: "settings-update-action"
- tapOn:
    id: "settings-update-action"
- extendedWaitUntil:
    visible: "Checking…"
    timeout: 3000
    optional: true
# gateway-down: the check must time out to the inline failure — genuinely slow.
- extendedWaitUntil:
    visible: "Check failed — Retry"
    timeout: 20000
- takeScreenshot: "58b-update-checkfailed"
# app alive: settings screen still responsive.
- assertVisible:
    id: "settings-screen"

appId: io.dev32.sentient.debug
---
# Reusable conditional login. No-op when already on chat (persisted token);
# logs in via the Kevin avatar + PIN 1234 when on the "Who's here?" login screen.
# Use as the first step of any flow that needs an authenticated session:  - runFlow: login.yaml
- launchApp
- runFlow:
    when:
      visible: "Who's here?"
    commands:
      - tapOn:
          id: "login-avatar-u_8c866990"    # Kevin avatar (stable resource-id)
      - extendedWaitUntil:
          visible: { id: "pin-key-1" }
          timeout: 5000
      - tapOn: { id: "pin-key-1" }
      - tapOn: { id: "pin-key-2" }
      - tapOn: { id: "pin-key-3" }
      - tapOn: { id: "pin-key-4" }  # PIN 1234 (PinPad buttons expose pin-key-N ids)
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 20000

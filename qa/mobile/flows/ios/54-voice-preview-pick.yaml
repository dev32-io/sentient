appId: io.dev32.sentient.debug
tags:
  - settings-voice
  - destructive-profile
---
# 54-voice-preview-pick — Voice page: play preview on a builtin voice (Briar),
# then pick it — active badge moves. Self-navigating. Original active voice
# ("Jarvis", c624a6ca980346ec9dc38bb434fec506, a user pack) is restored by
# 54b-voice-restore.yaml (adjacent).
#
# DEFECT (iOS, id-collision family): VoiceRowView's accessibilityIdentifier sits
# on the outer HStack and propagates to every descendant — the play button's
# "-play" suffix never reaches the tree. Point-tap by position: the row uses
# .contentShape(Rectangle()) + .onTapGesture(onSelect), so a tap anywhere except
# the nested play/delete icons reliably selects it.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-voice"
- extendedWaitUntil:
    visible: { id: "settings-voice" }
    timeout: 3000
- assertVisible:
    id: "settings-voice-add-nav"
- takeScreenshot: "54-voice-before"
# Briar is the first (alphabetically-sorted) builtin row; play icon ~x=12%.
- tapOn:
    point: "12%,50%"
- takeScreenshot: "54-voice-previewing"
# tap the row's text/meta area (not the play icon) to select/pick it.
- tapOn:
    point: "90%,50%"
# active badge moves — voiceId profile update (person-session voiceId.update).
- extendedWaitUntil:
    visible: "Active"
    timeout: 5000
- takeScreenshot: "54-voice-active-briar"

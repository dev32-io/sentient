appId: io.dev32.sentient.debug
tags:
  - settings-voice
  - destructive-profile
  - restore
---
# 54b-voice-restore — restores the original active voice ("Jarvis", id
# c624a6ca980346ec9dc38bb434fec506) after 54-voice-preview-pick.yaml picks Briar.
# Self-navigating. Filtering to "Yours" isolates Jarvis (avoids scrolling past
# all 5 builtins). Jarvis is a user pack (delete icon at ~89–92%) — tap the row
# TEXT/meta at x=50% to avoid it (row center ≈54% under the "Yours" filter which
# inserts an extra tag-chip row above the list).
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-voice"
- extendedWaitUntil:
    visible: { id: "settings-voice" }
    timeout: 3000
- tapOn: "Yours"
- extendedWaitUntil:
    visible: { id: "settings-voice-row-c624a6ca980346ec9dc38bb434fec506" }
    timeout: 3000
- tapOn:
    point: "50%,54%"
# active badge moves back — voiceId profile update.
- extendedWaitUntil:
    visible: "Active"
    timeout: 5000
- takeScreenshot: "54b-voice-restored-jarvis"

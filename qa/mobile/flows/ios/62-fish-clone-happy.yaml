appId: io.dev32.sentient.debug
tags:
  - settings-voice
  - slow
  - destructive-profile
---
# 62-fish-clone-happy — Voice page: Clone from Fish (gated on
# features.fish_browse_enabled) → search → play sample → pick a tile (prefilled
# clone form) → Clone voice (real POST .../clone against a live Fish key on this
# stack). Targets a known-good Fish voice id (Deep Voice English (Anthony)). A
# successful clone auto-activates the new pack. Self-navigating. Cleaned up by
# 62b-fish-clone-cleanup.yaml (adjacent).
#
# NOTE: id-collision family (like 54) applies to Fish rows — point-tap by
# position, and let results settle (keyboard dismissed) before computing tap
# percentages, since an open keyboard shifts the content area.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-voice"
- extendedWaitUntil:
    visible: { id: "settings-voice" }
    timeout: 3000
- assertVisible:
    id: "settings-voice-fish-nav"
- tapOn:
    id: "settings-voice-fish-nav"
- extendedWaitUntil:
    visible: { id: "settings-voice-fish" }
    timeout: 3000
- tapOn:
    id: "settings-voice-fish-search"
- inputText: "Deep Voice English"
# Fish browse proxy fetch — network op.
- extendedWaitUntil:
    visible: { id: "settings-voice-fish-row-98e364e9a41c465a9d4fdafc267f84ea" }
    timeout: 10000
- takeScreenshot: "62-fish-search-results"
# preview sample: play icon at the row's left edge (keyboard now dismissed).
- tapOn:
    point: "12%,22%"
- takeScreenshot: "62-fish-playing-sample"
# select the tile (not the play icon) to open the prefilled clone form.
- tapOn:
    point: "90%,26%"
- extendedWaitUntil:
    visible: "Clone this voice"
    timeout: 3000
- takeScreenshot: "62-fish-clone-form-prefilled"
- tapOn:
    id: "settings-voice-fish-clone-submit"
# clone round-trip: sample download (SSRF-guarded) + local-tts voice.create +
# profile activation — genuinely slow.
- extendedWaitUntil:
    visible: { id: "settings-voice" }
    timeout: 25000
- tapOn: "Yours"
- extendedWaitUntil:
    visible: { text: "Deep Voice English.*" }
    timeout: 3000
- takeScreenshot: "62-fish-cloned-in-list"

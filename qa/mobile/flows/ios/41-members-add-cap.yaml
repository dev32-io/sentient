appId: io.dev32.sentient.debug
tags:
  - settings-admin
  - destructive-profile
---
# 41-members-add-cap — admin Members page: add two temp users (household 1/3 →
# 3/3), then verify "Add user" is disabled at the 3-user cap. Self-navigating.
# COUPLED TRIO: run adjacent + in order with 42 (non-admin gate, logs in as the
# created Temp1) and 43 (deletes both temps, restores Kevin's admin session).
# ⚠️ HARD PRECONDITION — the household must hold EXACTLY ONE user (this flow adds
# two). Verified 2026-07-30: with three users already present, "Add user" is
# correctly DISABLED, the tap no-ops, and the flow dies at
# `settings-members-add-name is visible` — which reads like a broken Add-user
# sheet and is not one. 42/43 then cascade off it.
# Check before running:  curl -sk https://127.0.0.1:8888/api/v1/auth/users
# Satisfy it by deleting the extra members through the Members UI first.
- runFlow: _helpers/open-settings.yaml
- tapOn:
    id: "settings-cat-members"
- extendedWaitUntil:
    visible: { id: "settings-members-screen" }
    timeout: 3000
- takeScreenshot: "41-members-before"
# --- add temp1 ---
- tapOn:
    id: "settings-members-add"
- extendedWaitUntil:
    visible: { id: "settings-members-add-name" }
    timeout: 3000
- tapOn:
    id: "settings-members-add-name"
- inputText: "E2E Temp1"
- tapOn:
    id: "settings-members-add-pin"
- inputText: "1111"
- tapOn:
    id: "settings-members-add-submit"
# member add POST + sheet dismiss — network op.
- extendedWaitUntil:
    notVisible: { id: "settings-members-add-name" }
    timeout: 8000
- assertVisible: "E2E Temp1"
# --- add temp2 ---
- tapOn:
    id: "settings-members-add"
- extendedWaitUntil:
    visible: { id: "settings-members-add-name" }
    timeout: 3000
- tapOn:
    id: "settings-members-add-name"
- inputText: "E2E Temp2"
- tapOn:
    id: "settings-members-add-pin"
- inputText: "2222"
- tapOn:
    id: "settings-members-add-submit"
- extendedWaitUntil:
    notVisible: { id: "settings-members-add-name" }
    timeout: 8000
- assertVisible: "E2E Temp2"
- takeScreenshot: "41-members-at-cap"
# --- cap enforcement: 3/3, Add user must now be disabled ---
- assertVisible:
    text: ".*3 active.*"
- assertVisible:
    id: "settings-members-add"
    enabled: false

appId: io.dev32.sentient.debug
---
# 41-members-add-cap — admin Members page: add two temp users (household starts
# at 1/3, ends at 3/3), then verify "Add user" is disabled at the 3-user cap.
# Temp users are cleaned up by 43-members-delete-cleanup.yaml AFTER the
# non-admin-gate case (42) uses one of them to log in. Run login.yaml
# immediately before this. AddMemberSheet is a native SwiftUI .sheet with real
# accessibilityIdentifiers (settings-members-add-name / -add-pin / -add-submit)
# — unlike Android's Material3 AlertDialog gap, no text-selector workaround
# needed here.
#
# tags: [ios, simulator-ok]
- tapOn:
    id: "settings-cat-members"
- extendedWaitUntil:
    visible:
      id: "settings-members-screen"
    timeout: 5000
- takeScreenshot: "41-members-before"
# --- add temp1 ---
- tapOn:
    id: "settings-members-add"
- extendedWaitUntil:
    visible:
      id: "settings-members-add-name"
    timeout: 5000
- tapOn:
    id: "settings-members-add-name"
- inputText: "E2E Temp1"
- tapOn:
    id: "settings-members-add-pin"
- inputText: "1111"
- tapOn:
    id: "settings-members-add-submit"
- extendedWaitUntil:
    notVisible:
      id: "settings-members-add-name"
    timeout: 10000
- assertVisible: "E2E Temp1"
# --- add temp2 ---
- tapOn:
    id: "settings-members-add"
- extendedWaitUntil:
    visible:
      id: "settings-members-add-name"
    timeout: 5000
- tapOn:
    id: "settings-members-add-name"
- inputText: "E2E Temp2"
- tapOn:
    id: "settings-members-add-pin"
- inputText: "2222"
- tapOn:
    id: "settings-members-add-submit"
- extendedWaitUntil:
    notVisible:
      id: "settings-members-add-name"
    timeout: 10000
- assertVisible: "E2E Temp2"
- takeScreenshot: "41-members-at-cap"
# --- cap enforcement: 3/3, Add user must now be disabled ---
- assertVisible:
    text: ".*3 active.*"
- assertVisible:
    id: "settings-members-add"
    enabled: false

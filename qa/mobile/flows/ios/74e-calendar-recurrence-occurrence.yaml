appId: io.dev32.sentient.debug
tags: [helper]
---
- runFlow: _calendar/open-calendar.yaml
- tapOn: { id: "${CALENDAR_RECURRING_EVENT_TAG}" }
- tapOn: { id: "calendar-preview-edit" }
- scrollUntilVisible:
    element: { id: "calendar-scope-this_occurrence" }
    direction: DOWN
- tapOn: { id: "calendar-scope-this_occurrence" }
- tapOn: { id: "calendar-editor-save" }
- extendedWaitUntil:
    visible: { id: "calendar-outcome-sheet" }
    timeout: 10000
# Direct fixture reread verifies only this occurrence changed.

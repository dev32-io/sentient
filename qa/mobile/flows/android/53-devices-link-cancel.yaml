appId: io.dev32.sentient.debug
tags:
  - settings-user
---
# 53-devices-link-cancel — Devices page: signal.paired is false on this stack, so
# only the link-start/cancel path is reachable (real pairing needs a Signal
# account + a signal-cli sidecar, absent here). Tap Link Signal → dialog → Cancel
# → dialog closes cleanly, unlinked state restored, no crash. Batch-safe.
#
# The prepare call fails FAST (not a ~30s "Preparing…") with "Network unavailable"
# (Cancel/Retry) — the gateway's generic label for the absent-sidecar failure.
# Tolerate either sub-state.
#
# DEFECT-9: the dialog GROWS when it transitions Preparing→error (adds a message
# line), reflowing Cancel/Retry down — a single tap right after the transition can
# miss. Tap Cancel (text-based, re-queries live each attempt) TWICE with a settle
# between.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
# DEFECT-7/8 (see 51): one plain scroll clears the row from the pinned footer.
- scroll
- tapOn: { id: "settings-cat-devices" }
- extendedWaitUntil:
    visible: { id: "settings-devices-screen" }
    timeout: 3000
- assertVisible: { id: "settings-devices-link" }
- takeScreenshot: "53-devices-unlinked"
- tapOn: { id: "settings-devices-link" }
- extendedWaitUntil:
    visible: "Link your Signal account"
    timeout: 3000
- takeScreenshot: "53-devices-preparing"
- waitForAnimationToEnd:
    timeout: 5000
# DEFECT-2: SignalLinkDialog buttons aren't testTagsAsResourceId-covered.
- tapOn:
    text: "Cancel"
    optional: true
- extendedWaitUntil:
    notVisible: "Link your Signal account"
    timeout: 3000
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
# real asserted check ("Link your Signal account" is dialog-title-only; the
# trigger button says "Link Signal" — no ambiguity).
- extendedWaitUntil:
    notVisible: "Link your Signal account"
    timeout: 5000
- assertVisible: { id: "settings-devices-link" }
- takeScreenshot: "53-devices-cancelled"

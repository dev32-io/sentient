# Android chat round-trip against the local gateway (resumable-WS branch).
appId: io.dev32.sentient.debug
---
- launchApp
- assertVisible:
    id: "composer-input"
- tapOn:
    id: "composer-input"
- inputText: "what is 20 plus 22"
- tapOn:
    id: "chat-send"
- extendedWaitUntil:
    visible: "what is 20 plus 22"
    timeout: 15000

appId: io.dev32.sentient.debug
tags:
  - settings-voice
  - restore
---
# 54b-voice-restore — restore pair for 54: active voice back to "Jarvis"
# (id c624a6ca980346ec9dc38bb434fec506 — a user-source pack despite the display
# name). Voice tile testTags are keyed by the raw backend voiceId, not a slug
# (voice-pick-<id>, see VoiceCard.kt). Batch-safe: self-navigates from chat root.
# executionOrder runs it right after 54.
#
# Filter to "Yours" first so Jarvis is the only entry — the "All" tab lists 5 tall
# built-in cards before it, past scrollUntilVisible's default budget.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-voice" }
- extendedWaitUntil:
    visible: { id: "settings-voice-screen" }
    timeout: 3000
- tapOn: "Yours"
- scrollUntilVisible:
    element: { id: "voice-pick-c624a6ca980346ec9dc38bb434fec506" }
    direction: DOWN
- tapOn: { id: "voice-pick-c624a6ca980346ec9dc38bb434fec506" }
# 10000ms: voice clone / synth round-trip (Fish import + local-tts)
- extendedWaitUntil:
    visible: { id: "voice-active-c624a6ca980346ec9dc38bb434fec506" }
    timeout: 10000
- takeScreenshot: "54b-voice-restored-jarvis"

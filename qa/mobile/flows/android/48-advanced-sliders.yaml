appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - destructive-profile
---
# 48-advanced-sliders — Advanced settings: set reasoning, compression, and
# max-tokens to non-default values; Save triggers the SLOW path (apply/restart).
# Restored to reasoning=minimal / compression=0.50 / max-tokens=1024 by
# 48b-advanced-restore.yaml (runs next via executionOrder). Batch-safe.
#
# RowSelect's DropdownMenu and RowSlider's Slider are NOT reachable via id:
# (DEFECT-3 — the shared row wraps label+control in one testTag'd Row, only the
# small inner control is clickable) — drive both via point taps.
#
# DEFECT-6: the RowSelect option TEXT is absent from the a11y tree once the menu
# is open (confirmed via uiautomator dump) — `extendedWaitUntil visible "High"`
# can NEVER succeed. Options render in a FIXED order regardless of selection
# (None/Minimal/Low/Medium/High/Extra-high @ y≈39/47/53/59/65/71%, x≈62%). The
# trigger box is right-aligned + content-width, so tap near its fixed RIGHT edge
# (~88%) to open it regardless of current label width.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-advanced" }
- extendedWaitUntil:
    visible: { id: "settings-advanced-screen" }
    timeout: 3000
- assertVisible: { id: "settings-advanced-reasoning" }
- assertVisible: { id: "settings-advanced-compression" }
- assertVisible: { id: "settings-advanced-max-tokens" }
- takeScreenshot: "48-advanced-before"
# reasoning: open the dropdown at the box's right edge, settle, tap "High" by
# fixed position (option text can't be waited on — DEFECT-6).
- tapOn:
    point: "88%,34%"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "62%,65%"
- assertVisible: "High"
# compression slider (0..1): tap near the right end for a high value.
- tapOn:
    point: "83%,56%"
# max-tokens slider (128..8192): tap mid-track for a mid-high value.
- tapOn:
    point: "65%,71%"
- assertVisible: { id: "settings-advanced-save" }
- takeScreenshot: "48-advanced-dirty"
- tapOn: { id: "settings-advanced-save" }
- extendedWaitUntil:
    visible: { id: "settings-apply-notice" }
    timeout: 3000
    optional: true
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-apply-notice" }
    timeout: 8000
- takeScreenshot: "48-advanced-after"

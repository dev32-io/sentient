appId: io.dev32.sentient.debug
tags:
  - chat
---
# 03-new-chat — tap new-chat and verify the composer appears with an empty state.
# new-chat is the "+" button in the top-right of the title bar; after tap the
# message list resets and composer-input is visible. Batch-safe.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "new-chat" }
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 3000

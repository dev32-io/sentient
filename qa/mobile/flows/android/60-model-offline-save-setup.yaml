appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - fault-armed
---
# 60-model-offline-save-setup (part 1/3) — Model settings: pick a different model
# (dirty draft, NOT saved), leaving the Model screen ready for the offline-save
# test. Self-navigating. The runner then kills connectivity and runs the
# continuation parts (…-trigger, …-recover) against the SAME running app — hence
# `fault-armed`, excluded from the default batch. Maestro 2.6.0 has no shell step,
# so the network toggle is orchestrated by the runner between invocations.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-model" }
- extendedWaitUntil:
    visible: { id: "settings-model-screen" }
    timeout: 3000
- tapOn: { id: "settings-model-search" }
- inputText: "kimi-k2.5"
- extendedWaitUntil:
    visible: { id: "settings-model-card-kimi-k2.5:cloud" }
    timeout: 3000
- tapOn: { id: "settings-model-card-kimi-k2.5:cloud" }
- assertVisible: { id: "settings-model-save" }
- takeScreenshot: "60-offline-dirty-before-network-kill"

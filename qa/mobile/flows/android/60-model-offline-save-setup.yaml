appId: io.dev32.sentient.debug
---
# 60-model-offline-save-setup — Model settings page: pick a different model
# (dirty draft, NOT saved). Paired with 60-model-offline-save-trigger.yaml,
# run by the harness AFTER killing emulator connectivity (adb shell svc wifi
# disable + svc data disable) and BEFORE restoring it — Maestro 2.6.0 has no
# shell-exec step, so the network toggle is orchestrated by the harness
# between two separate maestro invocations against the same running app
# process (same pattern as 61-apply-conflict-*.yaml). Run login.yaml
# immediately before this.
#
# tags: [android, emulator-ok]
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible:
      id: "settings-open"
    timeout: 5000
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- tapOn:
    id: "settings-cat-model"
- extendedWaitUntil:
    visible:
      id: "settings-model-screen"
    timeout: 5000
- tapOn:
    id: "settings-model-search"
- inputText: "kimi-k2.5"
- extendedWaitUntil:
    visible:
      id: "settings-model-card-kimi-k2.5:cloud"
    timeout: 5000
- tapOn:
    id: "settings-model-card-kimi-k2.5:cloud"
- assertVisible:
    id: "settings-model-save"
- takeScreenshot: "60-offline-dirty-before-network-kill"

appId: io.dev32.sentient.debug
---
# 30-send-diagnostic (Android) — Task 13 SentientMobileVitals manual-upload smoke.
#
# Flow: launch (clean) → login (Kevin avatar + PIN 1234) → send one chat turn (so
# the rolling vitals file has content) → open the history drawer → settings-open
# (gear in the account header) → tap settings-send-logs (expands the session list)
# → "This session" (newest) is default-selected → tap settings-log-send → the
# control morphs into a progress bar (settings-log-progress) → "Sent ✓ — ref XXXX"
# (settings-log-sent).
#
# The REAL assertion (a new file under ~/.sentient/gateway/clientLogs/mobile/ with a
# session-meta header, the gateway `diagnostics.received` log line, and absence of
# the chat text) is verified out-of-band by the runner, not by Maestro.
#
# Selectors reuse the existing 04c / 09-logout flows verbatim (same app, same auth,
# same drawer→settings nav). testTags from SettingsDiagnostics.kt.
#
# tags: [android, emulator-ok, vitals, diagnostics]
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: { id: "login-backend-setup" }
    timeout: 8000
- tapOn:
    id: ".*login-avatar-.*"
- extendedWaitUntil:
    visible: { id: "pin-key-1" }
    timeout: 5000
- tapOn: { id: "pin-key-1" }
- tapOn: { id: "pin-key-2" }
- tapOn: { id: "pin-key-3" }
- tapOn: { id: "pin-key-4" }
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 20000
# One chat turn so the diagnostic log captures live session content.
- tapOn: { id: "composer-input" }
- inputText: "hi"
- tapOn: { id: "chat-send" }
- hideKeyboard
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 45000
# Open the history drawer, then Settings via the account-header gear.
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "history-new-chat" }
    timeout: 5000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-send-logs" }
    timeout: 5000
# Reveal the session list. Newest ("This session") is default-selected → "Send".
- tapOn: { id: "settings-send-logs" }
- extendedWaitUntil:
    visible: { id: "settings-log-send" }
    timeout: 5000
- tapOn: { id: "settings-log-send" }
# The control morphs: progress bar in flight, then the "Sent ✓ — ref XXXX" line.
- extendedWaitUntil:
    visible: { id: "settings-log-sent" }
    timeout: 20000
- assertVisible:
    id: "settings-log-sent"
- takeScreenshot: vitals-android-sent

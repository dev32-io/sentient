appId: io.dev32.sentient.debug
tags:
  - update
---
# 58-update-footer-check — Settings root footer: tap "Check for updates" with the
# manifest reachable (local stack serves GET /download/manifest.json) and the
# installed debug build newer than the manifest → morphs Checking… → up-to-date,
# reverting to "Check for updates". All 5 states share settings-update-action
# (UpdateFooter.kt) — distinguish by visible text. Batch-safe.
#
# NOTE: on a fast local stack the "Up to date" transient appears AND reverts
# within a window Maestro's polling never lands inside — the gateway log confirms
# GET /download/manifest.json fired on every attempt (tap + round-trip both work),
# but the transient text is unpinnable. Assert on the idle-state round-trip
# (returns to "Check for updates"); run-e2e.sh confirms the manifest fetch in logs.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
# DEFECT-8: settings-update-action IS the pinned footer (always on-screen) — no
# scroll needed; scrollUntilVisible would overshoot.
- assertVisible: "Check for updates"
- takeScreenshot: "58-update-idle"
- tapOn: { id: "settings-update-action" }
# check round-trip resolves back to idle — manifest fetch + revert.
- extendedWaitUntil:
    visible: "Check for updates"
    timeout: 15000
- takeScreenshot: "58-update-idle-after-check"

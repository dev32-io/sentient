appId: io.dev32.sentient.debug
tags:
  - auth
  - fault-armed
---
# 18-auth-expired — arm the expired-token fault, force a reconnect, assert the app
# routes to the LOGIN screen (never a permanent "Reconnecting…"). Excluded from the
# default batch (fault-armed); run by the runner's orchestration phase.
#
# The consultation point is wired; the reconnect trigger requires the runner (a
# Maestro flow can't interleave shell). Runner sequence: ensure app running +
# connected → arm expired-token fault → stop the native gateway process (forces
# the SDK to reconnect) → run THIS flow → restart the gateway after. On reconnect the
# next auth.ok is intercepted as expired → authExpired=true → login screen.
#
# Pre-condition (runner, app already running): composer-input visible; fault armed
#   (adb shell am broadcast -a io.sentient.debug.FAULT -p io.dev32.sentient.debug
#    --es kind expired); gateway stopped.
- assertVisible: { id: "composer-input" }
# on reconnect, auth.ok is intercepted as expired → login screen.
- extendedWaitUntil:
    visible: { id: "login-backend-setup" }
    timeout: 60000

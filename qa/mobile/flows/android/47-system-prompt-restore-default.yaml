appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - destructive-profile
---
# 47-system-prompt-restore-default — System Prompt page: "Restore default" →
# confirm → Save applies the canonical Soul.md template (SLOW path: PUT + POST
# /profile/apply). Batch-safe.
#
# ⚠ NO FLOW RESTORE PAIR: the original soul content (with the "# <userId>" header)
# must be restored via a direct API call after the batch — re-typing ~1983 chars
# through the mono editor UI hits the same slow-typing gRPC-deadline issue as
# 46-memory-cap. This flow is `destructive-profile` with NO adjacent restore;
# run-e2e.sh / the operator restores the soul out-of-band. Left in the default
# batch because the default Soul is a benign, functional state.
#
# DEFECT-5: the MonoEditor is a near-full-screen scrollable EditText; a
# center-point swipe (scrollUntilVisible's default gesture) is consumed by the
# editor's internal scroll, not the outer page. waitForAnimationToEnd after the
# scroll settles the fling before tapping "Restore default" below the editor.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-system-prompt" }
- extendedWaitUntil:
    visible: { id: "settings-system-prompt-screen" }
    timeout: 3000
- takeScreenshot: "47-system-prompt-before"
- scrollUntilVisible:
    element: { id: "settings-system-prompt-restore" }
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: { id: "settings-system-prompt-restore" }
# DEFECT-2: AlertDialog content isn't testTagsAsResourceId-covered — use text.
- extendedWaitUntil:
    visible: "Restore default Soul.md?"
    timeout: 3000
- tapOn: "Restore"
- assertVisible: { id: "settings-system-prompt-save" }
- tapOn: { id: "settings-system-prompt-save" }
# apply-notice can be brief on a fast local stack — tolerate a short race.
- extendedWaitUntil:
    visible: { id: "settings-apply-notice" }
    timeout: 3000
    optional: true
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-apply-notice" }
    timeout: 8000
- takeScreenshot: "47-system-prompt-after"

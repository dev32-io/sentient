appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - destructive-profile
---
# 50-personalities-create-activate — Personalities page starting empty: create
# "e2e-test", then Activate. Batch-safe. Self-restoring — see DEFECT-4.
#
# DEFECT-4 (backend, NOT mobile): Activate deterministically wipes the personality
# (writeRendered() overwrites config.yaml with no agent.personalities section; the
# personality-store read-modify-write loses the race on the SAME restart Activate
# triggers). Reproduced live: create "e2e-test" (persists) → Activate → "Applying
# — restarting…" (~13s) → list reverts to "No personalities yet." So the bug
# itself restores the starting state — no restore pair needed.
#
# create() ALSO routes through the apply/restart FSM (every mutation restarts
# Hermes); whether the personality survives its OWN creation restart is a timing
# race (both outcomes observed). The create-phase waits tolerate either outcome;
# the activate-phase wipe is the reliable asserted case.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-personalities" }
- extendedWaitUntil:
    visible: { id: "settings-personalities-screen" }
    timeout: 3000
- extendedWaitUntil:
    visible: "No personalities yet.*"
    timeout: 3000
- takeScreenshot: "50-personalities-empty"
- tapOn: { id: "settings-personalities-new" }
- tapOn: { id: "settings-personality-new-name" }
- inputText: "e2e-test"
# the soft keyboard covers "Create" below the fold — dismiss it first.
- hideKeyboard
- tapOn: { id: "settings-personality-create" }
# create() also triggers a restart — let it settle either way (SLOW).
- extendedWaitUntil:
    visible: { id: "settings-apply-notice" }
    timeout: 3000
    optional: true
- extendedWaitUntil:
    notVisible: { id: "settings-apply-notice" }
    timeout: 20000
    optional: true
- takeScreenshot: "50-personalities-after-create"
# only Activate if the personality survived create's own restart race; otherwise
# the empty state already documents the same bug.
- tapOn:
    id: "settings-personality-activate-e2e-test"
    optional: true
- extendedWaitUntil:
    visible: { id: "settings-apply-notice" }
    timeout: 3000
    optional: true
- takeScreenshot: "50-personalities-defect4-restarting"
# SLOW restart budget.
- extendedWaitUntil:
    notVisible: { id: "settings-apply-notice" }
    timeout: 20000
- extendedWaitUntil:
    visible: "No personalities yet.*"
    timeout: 10000
- takeScreenshot: "50-personalities-defect4-wiped"

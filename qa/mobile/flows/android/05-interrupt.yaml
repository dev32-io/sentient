appId: io.dev32.sentient.debug
tags:
  - chat
---
# 05-interrupt — send a long-reply prompt, assert streaming starts, confirm no
# crash. Batch-safe.
#
# ⚠ FLAG (Android + iOS): the chat-interrupt button is gated on TTS audio state
# (canInterrupt = connection.isSpeaking || audioState PROCESSING/ASSISTANT_SPEAKING/
# INTERRUPTING), NOT on text-streaming cognition state. In a TTS-disabled session
# (default emulator setup without a reachable local-tts service) the interrupt
# button never appears during text streaming — so this flow can only prove the
# send→stream path + no-crash here, not the interrupt tap. Full interrupt E2E
# needs TTS enabled on a device with a reachable local-tts service.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- assertVisible: { id: "composer-input" }
- tapOn: { id: "composer-input" }
- inputText: "tell me a very long story about the history of computing in great detail"
- tapOn: { id: "chat-send" }
- hideKeyboard
# streaming bubble proves send→gateway→Hermes works — LLM budget.
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 40000
# app alive, streaming received — no crash. chat-interrupt not asserted (TTS off).
- assertVisible: { id: "composer-input" }

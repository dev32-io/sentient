# Maestro workspace config for the Android E2E flow library.
#
# `flows: ["*.yaml"]` scopes folder runs (`maestro test qa/mobile/flows/android`)
# to TOP-LEVEL flows only — the reusable subflows in _helpers/ are never run
# standalone (Maestro also does not recurse into subdirectories; the `helper` tag
# is a third guard the runner always excludes).
#
# `continueOnFailure: true` keeps a folder run going after a failure so a restore
# still executes even if its primary failed.
#
# NOTE ON ORDER: Maestro's `executionOrder.flowsOrder` is intentionally NOT set
# here — it requires every listed flow to be present in the run set, which breaks
# `--include-tags` (the whole point of this library). Maestro's default folder
# order is non-deterministic, so DETERMINISTIC ordering (restore pairs adjacent,
# logout last) is enforced by run-e2e.sh, which resolves the selected tags into an
# explicit, canonically-ordered file list and runs that as one warm invocation.
# Use run-e2e.sh for any run where order matters; a bare `maestro test <dir>
# --include-tags=…` works but runs in Maestro's own (unordered) sequence.
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: true

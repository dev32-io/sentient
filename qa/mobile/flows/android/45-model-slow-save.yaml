appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - destructive-profile
---
# 45-model-slow-save — Model settings: pick a different model; Save triggers the
# SLOW path (PUT profile + POST /profile/apply, blocking "Applying — restarting…"
# progress, then re-fetch server truth). Restarts the user's Hermes worker —
# acceptable on the local dev stack. Original model (deepseek-v4-flash:cloud) is
# restored by 45b-model-restore.yaml (runs next via executionOrder). Batch-safe.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-model" }
- extendedWaitUntil:
    visible: { id: "settings-model-screen" }
    timeout: 3000
- takeScreenshot: "45-model-before"
- tapOn: { id: "settings-model-search" }
- inputText: "kimi-k2.5"
- extendedWaitUntil:
    visible: { id: "settings-model-card-kimi-k2.5:cloud" }
    timeout: 3000
- tapOn: { id: "settings-model-card-kimi-k2.5:cloud" }
- assertVisible: { id: "settings-model-save" }
- tapOn: { id: "settings-model-save" }
- assertVisible: { id: "settings-apply-notice" }
- takeScreenshot: "45-model-applying"
# SLOW: apply-notice clears only after the full supervisord restart + Hermes
# worker boot — keep the long budget.
- extendedWaitUntil:
    notVisible: { id: "settings-apply-notice" }
    timeout: 45000
- takeScreenshot: "45-model-after"

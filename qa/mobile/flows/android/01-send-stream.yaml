appId: io.dev32.sentient.debug
tags:
  - chat
---
# 01-send-stream — type, send, and verify the assistant replies. Covers the full
# text-send -> gateway -> native ReAct loop -> streaming bubble path (Hermes is
# only a delegated tool on 2.0, never the agent runtime). assistant-bubble appears
# once the gateway streams the first token; hideKeyboard so the IME doesn't push
# the bubble off-screen. run-e2e.sh greps logcat for ≥1 MessageDelta after the
# batch to confirm streaming (not just a committed reply). Batch-safe.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- assertVisible: { id: "composer-input" }
- tapOn: { id: "composer-input" }
- inputText: "what is 2 plus 2"
- tapOn: { id: "chat-send" }
- hideKeyboard
# Provider round-trip driven by the gateway's own loop — genuinely slow, keep the
# long budget.
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 40000

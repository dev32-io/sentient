appId: io.dev32.sentient.debug
---
# 01-send-stream — type a message, send it, and verify the assistant replies.
# Covers the full text-send → gateway → Hermes → streaming bubble path.
#
# Android: composer-input (resource-id from Compose testTag via testTagsAsResourceId).
# assistant-bubble appears once the gateway streams the first token.
# hideKeyboard after send so the IME doesn't push the bubble off-screen.
- launchApp
- assertVisible:
    id: "composer-input"
- tapOn:
    id: "composer-input"
- inputText: "what is 2 plus 2"
- tapOn:
    id: "chat-send"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "assistant-bubble"
    timeout: 40000

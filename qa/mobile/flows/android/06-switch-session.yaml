appId: io.dev32.sentient.debug
tags:
  - session
---
# 06-switch-session — open the history drawer, tap the first session row, assert
# the chat view reloads for that session. Requires ≥1 committed session in
# history (the batch runs chat flows 01/01-send-stream first, so at least one
# exists by execution order). Taps the first history-row-<sessionId> via regex.
# Batch-safe.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "history-new-chat" }
    timeout: 3000
- assertVisible: { id: "history-search" }
- tapOn:
    id: ".*history-row-.*"
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 3000

appId: io.dev32.sentient.debug
tags:
  - settings-diagnostics
---
# 57-diagnostics-send — Diagnostics settings page (its own Support-group category
# per the settings-parity plan). One chat turn first so the rolling vitals log has
# content, then send "This session" (newest, default-selected) → progress → "Sent".
# The real assertion (a new file under ~/.sentient/gateway/clientLogs/mobile/ with
# a session-meta header, the gateway diagnostics.received log line, and ZERO chat
# text) is verified out-of-band by run-e2e.sh. Batch-safe.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- assertVisible: { id: "composer-input" }
- tapOn: { id: "composer-input" }
- inputText: "hi"
- tapOn: { id: "chat-send" }
- hideKeyboard
# LLM round-trip — genuinely slow.
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 40000
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
# DEFECT-7/8 (see 51): Diagnostics sits just above the pinned footer — plain
# scrolls clear it before tapping (scrollUntilVisible overshoots).
- scroll
- scroll
- tapOn: { id: "settings-cat-diagnostics" }
- extendedWaitUntil:
    visible: { id: "diagnostics-screen" }
    timeout: 3000
- tapOn: { id: "settings-send-logs" }
- extendedWaitUntil:
    visible: { id: "settings-log-send" }
    timeout: 3000
- tapOn: { id: "settings-log-send" }
# upload round-trip (authenticated POST) — network budget.
- extendedWaitUntil:
    visible: { id: "settings-log-sent" }
    timeout: 20000
- takeScreenshot: "57-diagnostics-sent"

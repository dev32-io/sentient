appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - restore
---
# 48b-advanced-restore — restore pair for 48: reasoning=minimal, compression=0.50,
# max-tokens=1024. Batch-safe: self-navigates from chat root. executionOrder runs
# it right after 48. See DEFECT-6 in 48 — dropdown option text is not in the a11y
# tree; drive by fixed point. Open the box at its right edge (~88%); "Minimal ·
# default" option sits at y≈46%, x≈62%.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-advanced" }
- extendedWaitUntil:
    visible: { id: "settings-advanced-screen" }
    timeout: 3000
- tapOn:
    point: "88%,34%"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "62%,46%"
- assertVisible: "Minimal · default"
- tapOn:
    point: "50%,56%"
- tapOn:
    point: "20%,71%"
- assertVisible: { id: "settings-advanced-save" }
- tapOn: { id: "settings-advanced-save" }
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-apply-notice" }
    timeout: 8000

appId: io.dev32.sentient.debug
---
# 56-secrets-presence — admin Secrets page: presence-only. Asserts the
# per-provider masked status rows render ("Key set" / "Not set"), then opens
# the OpenRouter row's editor and types a FAKE placeholder value into the key
# field WITHOUT tapping Save — the draft is local `remember` state in
# SecretRow.kt (never sent until Save; see its file header comment), so this
# never mutates a real secret. Cancels instead of saving. NEVER taps
# *-save or *-set-active (both fire real mutating PUTs against admin/secrets —
# no safe way to exercise those without a genuine key). Run login.yaml
# immediately before this.
#
# tags: [android, emulator-ok]
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible:
      id: "settings-open"
    timeout: 5000
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "settings-cat-secrets"
    direction: DOWN
- tapOn:
    id: "settings-cat-secrets"
- extendedWaitUntil:
    visible:
      id: "settings-secrets-screen"
    timeout: 5000
- assertVisible:
    id: "settings-secrets-openrouter-status"
- assertVisible:
    id: "settings-secrets-ollama-status"
- assertVisible:
    id: "settings-secrets-custom-status"
- takeScreenshot: "56-secrets-presence"
# open the OpenRouter row's editor, type a fake value, but CANCEL — never Save.
- tapOn:
    id: "settings-secrets-openrouter-update"
- extendedWaitUntil:
    visible:
      id: "settings-secrets-openrouter-field"
    timeout: 5000
- tapOn:
    id: "settings-secrets-openrouter-field"
- inputText: "sk-fake-placeholder-not-a-real-key"
- takeScreenshot: "56-secrets-draft-untouched-until-save"
- tapOn:
    id: "settings-secrets-openrouter-cancel"
- extendedWaitUntil:
    notVisible:
      id: "settings-secrets-openrouter-field"
    timeout: 5000
# status row unchanged — no mutating request was ever fired
- assertVisible:
    id: "settings-secrets-openrouter-status"

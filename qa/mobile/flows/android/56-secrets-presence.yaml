appId: io.dev32.sentient.debug
tags:
  - settings-admin
---
# 56-secrets-presence — admin Secrets page, presence-only: masked per-provider
# status rows render ("Key set"/"Not set"), then open the OpenRouter editor, type
# a FAKE placeholder into the key field WITHOUT Save (the draft is local remember
# state, never sent until Save), and Cancel. NEVER taps *-save or *-set-active
# (both fire real mutating PUTs against admin/secrets). No real secret mutated.
# Batch-safe.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- scrollUntilVisible:
    element: { id: "settings-cat-secrets" }
    direction: DOWN
- tapOn: { id: "settings-cat-secrets" }
- extendedWaitUntil:
    visible: { id: "settings-secrets-screen" }
    timeout: 3000
- assertVisible: { id: "settings-secrets-openrouter-status" }
- assertVisible: { id: "settings-secrets-ollama-status" }
- assertVisible: { id: "settings-secrets-custom-status" }
- takeScreenshot: "56-secrets-presence"
# open the OpenRouter editor, type a fake value, but CANCEL — never Save.
- tapOn: { id: "settings-secrets-openrouter-update" }
- extendedWaitUntil:
    visible: { id: "settings-secrets-openrouter-field" }
    timeout: 3000
- tapOn: { id: "settings-secrets-openrouter-field" }
- inputText: "sk-fake-placeholder-not-a-real-key"
- takeScreenshot: "56-secrets-draft-untouched-until-save"
- tapOn: { id: "settings-secrets-openrouter-cancel" }
- extendedWaitUntil:
    notVisible: { id: "settings-secrets-openrouter-field" }
    timeout: 3000
# status row unchanged — no mutating request was ever fired.
- assertVisible: { id: "settings-secrets-openrouter-status" }

appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - fault-armed
---
# 61-apply-conflict-setup (part 1/2) — Model settings: pick a different model
# (dirty draft, NOT saved). Self-navigating. Paired with a runner-driven
# concurrent `POST /profile/apply` (curl) fired just before …-trigger's Save tap
# to race the apply FSM. fault-armed; excluded from the default batch.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-model" }
- extendedWaitUntil:
    visible: { id: "settings-model-screen" }
    timeout: 3000
- tapOn: { id: "settings-model-search" }
- inputText: "kimi-k2.5"
- extendedWaitUntil:
    visible: { id: "settings-model-card-kimi-k2.5:cloud" }
    timeout: 3000
- tapOn: { id: "settings-model-card-kimi-k2.5:cloud" }
- assertVisible: { id: "settings-model-save" }
- takeScreenshot: "61-apply-conflict-dirty"

appId: io.dev32.sentient.debug
---
# 62b-fish-clone-cleanup — Voice settings page: delete the Fish-cloned pack
# from 62-fish-clone-happy.yaml (cloning auto-activates it, same as record
# create — see DEFECT-10 note) and restore the active voice to Jarvis.
# Mirrors 55b-voice-delete-user-pack.yaml. Run immediately after
# 62-fish-clone-happy.yaml (already on Voice screen, "Yours" tab active).
#
# NOTE: id below is NOT deterministic (server-random per clone) — re-sync via
# GET /api/v1/voices after any fresh 62 run. Current as of the 2026-07-16
# settings-parity E2E pass: 169bed35cea54cd99662e5a5afb5799d.
#
# tags: [android, emulator-ok]
- tapOn:
    id: "voice-delete-169bed35cea54cd99662e5a5afb5799d"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 5000
- takeScreenshot: "62b-fish-delete-confirm"
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Deep Voice English"
    timeout: 10000
- takeScreenshot: "62b-fish-deleted"
# restore active voice to Jarvis (clone auto-activated the now-deleted pack)
- tapOn:
    id: "voice-pick-c624a6ca980346ec9dc38bb434fec506"
- extendedWaitUntil:
    visible:
      id: "voice-active-c624a6ca980346ec9dc38bb434fec506"
    timeout: 10000
- takeScreenshot: "62b-voice-restored-jarvis"

appId: io.dev32.sentient.debug
tags:
  - outbox
---
# 10-outbox — send a message immediately after a warm launch, before the SDK
# reaches READY. The Composer queues the send when status != READY and flushes it
# on the READY edge (handleSend in ChatScreen); the user bubble appears at once,
# the assistant reply arrives after READY + flush. Batch-safe: warm launchApp
# preserves the token, so we land on chat and can send into the cold-connect
# window. run-e2e.sh greps logcat for "pendingSend"/"flush" to confirm the outbox.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- assertVisible: { id: "composer-input" }
- tapOn: { id: "composer-input" }
- inputText: "what is 2 plus 2"
- tapOn: { id: "chat-send" }
- hideKeyboard
# user message accepted into local state / outbox immediately.
- extendedWaitUntil:
    visible: { id: "message-bubble-0" }
    timeout: 3000
# assistant reply after READY + flush — LLM budget.
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 40000

appId: io.dev32.sentient.debug
tags:
  - update
  - fault-armed
---
# 58b-update-footer-offline — Settings root footer: tap "Check for updates" with
# emulator connectivity KILLED → "Check failed — Retry" (UpdateFooter FooterVisual
# .Failed), no crash. Self-navigating: launchApp + conditional login + nav to
# settings root are all LOCAL UI and work with the network down (the app still has
# its token → lands on chat; only the update-check needs the network, which is the
# point). The runner kills connectivity (adb svc wifi/data disable) BEFORE this
# flow and restores it after — hence `fault-armed`, excluded from the default batch.
#
# DEFECT-11: id-based tapOn on settings-update-action is flaky on this node — a
# direct point tap on the pinned footer is used instead.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- assertVisible: "Check for updates"
- tapOn:
    point: "50%,89%"
# 15000ms: OTA manifest fetch / offline settle
- extendedWaitUntil:
    visible: "Check failed — Retry"
    timeout: 15000
- takeScreenshot: "58b-update-check-failed"

appId: io.dev32.sentient.debug
tags: [calendar, recovery, fault-armed]
---
# Disable airplane mode with the direct emulator control before invoking. Calendar
# remains open from 06-offline-recovery; no launch or navigation is allowed.
- assertVisible: { id: "${CALENDAR_CACHED_EVENT_TAG}" }
- scrollUntilVisible:
    element: { id: "${CALENDAR_RECOVERY_EVENT_TAG}" }
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: { id: "${CALENDAR_CACHED_EVENT_TAG}" }
    direction: UP
    timeout: 20000
- assertNotVisible: { id: "calendar-freshness-offline" }
- assertNotVisible: { id: "calendar-freshness-stale" }
- assertNotVisible: { id: "calendar-freshness-refreshing" }
- assertVisible:
    id: "calendar-add"
    enabled: true

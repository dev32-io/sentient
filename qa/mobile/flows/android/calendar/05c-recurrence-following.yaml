- tapOn: { id: "calendar-scope-this_and_following" }
- tapOn: { id: "calendar-editor-save" }
- extendedWaitUntil:
    visible: { id: "calendar-outcome-sheet" }
    timeout: 10000
# Direct fixture reread verifies the successor ID and unchanged prefix.

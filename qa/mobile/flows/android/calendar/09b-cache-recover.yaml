appId: io.dev32.sentient.debug
tags: [calendar, cache-first, recovery, fault-armed]
---
# Disable airplane mode before invoking. Do not relaunch or navigate: the
# same Calendar must automatically revalidate while cached content stays visible.
- assertVisible: { id: "${CALENDAR_CACHED_EVENT_TAG}" }
- scrollUntilVisible:
    element: { id: "${CALENDAR_RECOVERY_EVENT_TAG}" }
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: { id: "${CALENDAR_CACHED_EVENT_TAG}" }
    direction: UP
    timeout: 20000
- assertNotVisible: { id: "calendar-freshness-offline" }
- assertNotVisible: { id: "calendar-freshness-stale" }
- assertNotVisible: { id: "calendar-freshness-refreshing" }
- assertVisible:
    id: "calendar-add"
    enabled: true

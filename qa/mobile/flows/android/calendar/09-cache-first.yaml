appId: io.dev32.sentient.debug
tags: [calendar, cache-first, fault-armed]
---
# Gateway/network is DOWN. This relaunch proves SQLDelight content is emitted
# without a blank loading replacement. Keep Calendar open after this flow.
- runFlow: "00-open.yaml"
- extendedWaitUntil:
    visible: { id: "calendar-freshness-offline" }
    timeout: 20000
- assertVisible: { id: "${CALENDAR_CACHED_EVENT_TAG}" }
- assertNotVisible: { id: "${CALENDAR_RECOVERY_EVENT_TAG}" }
- assertVisible:
    id: "calendar-add"
    enabled: false
- assertNotVisible: { id: "calendar-outcome-sheet" }
- takeScreenshot: "calendar-cache-first-offline"

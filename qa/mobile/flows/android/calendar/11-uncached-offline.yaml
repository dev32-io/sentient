appId: io.dev32.sentient.debug
tags: [calendar, uncached-offline]
---
# Invoke on a date outside the primed cache while the direct network control is
# observably offline. Inspect the sanitized shared store afterward: no mutation
# or queue row may exist.
- extendedWaitUntil:
    visible: { id: "calendar-unavailable-offline" }
    timeout: 15000
- assertVisible: { id: "calendar-retry" }
- tapOn: { id: "calendar-add", optional: true }
- assertNotVisible: { id: "calendar-outcome-sheet" }
- assertNotVisible: { text: "Event created" }
- takeScreenshot: "calendar-uncached-offline"

appId: io.dev32.sentient.debug
tags: [calendar, offline, fault-armed]
---
# Invoke on the already-open Calendar after the direct agent seeds the recovery
# fixture and disables the existing gateway/network control.
- assertVisible: { id: "calendar-screen" }
- extendedWaitUntil:
    visible: { id: "calendar-freshness-offline" }
    timeout: 20000
- assertVisible: { id: "${CALENDAR_CACHED_EVENT_TAG}" }
- assertNotVisible: { id: "${CALENDAR_RECOVERY_EVENT_TAG}" }
- assertVisible:
    id: "calendar-add"
    enabled: false
- assertNotVisible: { id: "calendar-outcome-sheet" }
- takeScreenshot: "calendar-offline"

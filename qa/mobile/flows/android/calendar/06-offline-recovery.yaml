appId: io.dev32.sentient.debug
tags: [calendar, offline]
---
# Invoke after the direct agent disables networking with existing Android
# controls. No sleeps: readiness is an observable calendar state ID.
- assertVisible: { id: "calendar-screen" }
- extendedWaitUntil:
    visible:
      id: "calendar-offline|calendar-unavailable-offline"
    timeout: 15000
- takeScreenshot: "calendar-offline"
- runFlow:
    when: { visible: { id: "calendar-retry" } }
    commands:
      - tapOn: { id: "calendar-retry" }

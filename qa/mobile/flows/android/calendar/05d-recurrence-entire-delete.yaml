appId: io.dev32.sentient.debug
tags: [calendar, recurrence, entire-series, delete]
---
- runFlow: "00-open.yaml"
- tapOn: { id: "${CALENDAR_RECURRING_DELETE_EVENT_TAG}" }
- tapOn: { text: "Edit" }
- scrollUntilVisible:
    element: { id: "calendar-editor-delete" }
    direction: DOWN
- tapOn: { id: "calendar-editor-delete" }
- tapOn: { id: "calendar-scope-entire_series" }
- tapOn: { id: "calendar-delete-confirm" }
- extendedWaitUntil:
    visible: { id: "calendar-outcome-sheet" }
    timeout: 10000
# Direct fixture reread verifies every series segment is absent.

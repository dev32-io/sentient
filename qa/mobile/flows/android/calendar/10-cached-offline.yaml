appId: io.dev32.sentient.debug
tags: [calendar, cached-offline]
---
# Invoke with current and adjacent months primed, persisted filters set, and the
# existing emulator/gateway network control observably offline.
- runFlow: "00-open.yaml"
- extendedWaitUntil:
    visible: { id: "calendar-offline" }
    timeout: 15000
- tapOn: { id: "calendar-view-day" }
- tapOn: { text: "Next period" }
- assertVisible: { id: "${CALENDAR_EVENT_TAG}" }
- tapOn: { id: "calendar-view-week" }
- tapOn: { text: "Previous period" }
- assertVisible: { id: "calendar-canvas" }
- tapOn: { id: "calendar-view-month" }
- tapOn: { text: "Next period" }
- assertVisible: { id: "calendar-canvas" }
- tapOn: { id: "calendar-filter-search" }
- inputText: "${CALENDAR_FILTER_TEXT}"
- hideKeyboard
- assertVisible: { id: "calendar-offline" }
- tapOn: { id: "calendar-add" }
- assertVisible: { id: "calendar-connection-required" }
- assertNotVisible: { id: "calendar-outcome-sheet" }

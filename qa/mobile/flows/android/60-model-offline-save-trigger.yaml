appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - fault-armed
---
# 60-model-offline-save-trigger (part 2/3) — continuation (no launchApp): tap Save
# on the already-dirty Model page from 60-...-setup, with emulator connectivity
# killed by the runner beforehand. Expect: failure surfaced inline via
# settings-apply-notice (ApplyState.Failed), draft KEPT (page still shows the
# picked model, NOT reverted), no crash. The runner restores connectivity + runs
# 60-...-recover after. fault-armed; excluded from the default batch.
- tapOn: { id: "settings-model-save" }
- extendedWaitUntil:
    visible: { id: "settings-apply-notice" }
    timeout: 15000
- takeScreenshot: "60-offline-save-failed-inline"
# draft kept: the picked model card is still selected (refetch runs only on Ready).
- assertVisible: { id: "settings-model-save" }

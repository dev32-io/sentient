appId: io.dev32.sentient.debug
tags:
  - logout
---
# 63-logout — Settings root: scroll to the danger row, tap Log out, land back on
# the login screen (token cleared). MUST run LAST in the batch (clears the auth
# token) — config.yaml executionOrder places it last. Batch-safe: self-navigates.
#
# DEFECT-7/8 (see 51 / 57): scrollUntilVisible overshoots to the footer, whose
# fixed position overlaps rows near the bottom (Logout sits just above it) —
# plain scrolls instead (Logout is further down than Diagnostics, use three).
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- scroll
- scroll
- scroll
- takeScreenshot: "63-logout-row"
- tapOn: { id: "settings-logout" }
# 10000ms: settings apply round-trip to the gateway
- extendedWaitUntil:
    visible: { id: "login-backend-setup" }
    timeout: 10000
- assertNotVisible: { id: "composer-input" }
- takeScreenshot: "63-logged-out"

appId: io.dev32.sentient.debug
tags:
  - voice-loop
---
# 11-mic-control — tap chat-mic to start voice, assert the control stays present
# (voiceMode flip), then tap again to stop. Control-plane only: run-e2e.sh greps
# logcat for startMic/stopMic after the batch. The full STT→LLM→TTS round-trip is
# 08-voice-loop (fault-armed). RECORD_AUDIO is pre-granted by run-e2e.sh's setup
# phase so no system dialog pops (Maestro can't dismiss it). Batch-safe.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- assertVisible: { id: "composer-input" }
- tapOn: { id: "chat-mic" }
# chat-mic is always rendered (it toggles state) — assert it's still there to
# confirm the tap landed without crashing.
- assertVisible: { id: "chat-mic" }
- tapOn: { id: "chat-mic" }
- assertVisible: { id: "chat-mic" }

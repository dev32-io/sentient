appId: io.dev32.sentient.debug
tags:
  - chat
  - fault-armed
---
# 20-malformed-frame — arm the malformed-frame fault, send a message, assert no
# crash (logcat shows decode-failed). No-relaunch flow: the runner arms the fault
# on the RUNNING app BEFORE this flow (Maestro attaches to the foreground app via
# the header appId without relaunching), then greps logcat for "fault.malformed-
# frame"/"decode-failed" after. Excluded from the default batch (fault-armed); run
# by the runner's orchestration phase.
#
# Pre-condition (runner, app already running): composer-input visible; fault armed
#   (adb shell am broadcast -a io.sentient.debug.FAULT -p io.dev32.sentient.debug
#    --es kind malformed).
- assertVisible: { id: "composer-input" }
- tapOn: { id: "composer-input" }
- inputText: "what is 2 plus 2"
- tapOn: { id: "chat-send" }
- hideKeyboard
# 8000ms: LLM round-trip on the local model (provider latency, not UI nav)
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 8000
# app still alive — no crash after the malformed frame.
- assertVisible: { id: "composer-input" }

appId: io.dev32.sentient.debug
tags:
  - settings-voice
  - destructive-profile
  - slow
---
# 55-voice-create-record — Voice settings → Add Voice → Record mode → capture ≥6s
# (MIN_RECORDING_MS gates "Use recording") → name "E2E RecordTest" → Create voice
# (multipart submit). The emulator mic returns zero-valued PCM (silence), never a
# read failure, so this exercises the REAL record→encode→multipart→voice.create
# pipeline; only the audio content is silent. RECORD_AUDIO pre-granted by
# run-e2e.sh's setup. Deleted + active-voice restored by 55b (runs next). Batch-
# safe. Tagged `slow` (record dwell + create + a re-navigation).
#
# DEFECT-10: VoiceScreen does NOT refresh its list after AddVoiceScreen pops back
# on success (the pack IS created + auto-activated server-side, but the on-screen
# list shows the pre-creation snapshot until the screen is torn down + rebuilt).
# Switching filter tabs does NOT refetch — only a fresh navigation does. Worked
# around below (leave Voice, re-enter).
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-voice" }
- extendedWaitUntil:
    visible: { id: "settings-voice-screen" }
    timeout: 3000
- tapOn: { id: "settings-voice-add-nav" }
- extendedWaitUntil:
    visible: { id: "settings-voice-add-screen" }
    timeout: 3000
- tapOn: { id: "segment-record" }
- takeScreenshot: "55-voice-add-record-idle"
- tapOn: { id: "voice-record-start" }
# capture ≥6s: poll until "Use recording"/stop becomes enabled (MIN_RECORDING_MS).
- extendedWaitUntil:
    visible:
      id: "voice-record-stop"
      enabled: true
    timeout: 12000
- takeScreenshot: "55-voice-recording"
- tapOn: { id: "voice-record-stop" }
- extendedWaitUntil:
    visible: { id: "voice-record-play" }
    timeout: 3000
- takeScreenshot: "55-voice-review"
- tapOn: { id: "voice-name" }
- inputText: "E2E RecordTest"
# the soft keyboard covers "Create voice" below the fold — dismiss it first.
- hideKeyboard
- tapOn: { id: "voice-add-submit" }
# create round-trip (multipart upload + server create) — network budget.
- extendedWaitUntil:
    visible: { id: "settings-voice-screen" }
    timeout: 20000
# DEFECT-10: force a fresh mount to pick up the new pack — leave Voice, re-enter.
- tapOn: { id: "settings-voice-back" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-voice" }
- extendedWaitUntil:
    visible: { id: "settings-voice-screen" }
    timeout: 3000
- tapOn: "Yours"
# 5000ms: voice clone / synth round-trip (Fish import + local-tts)
- extendedWaitUntil:
    visible: "E2E RecordTest"
    timeout: 5000
- takeScreenshot: "55-voice-created-in-list"

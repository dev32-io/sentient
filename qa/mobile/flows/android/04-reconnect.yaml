appId: io.dev32.sentient.debug
tags:
  - reconnect
  - physical-only
---
# 04-reconnect — assert connection-lost-banner on a gateway drop.
#
# ⚠️ EMULATOR LIMITATION → `physical-only`: Android emulators reach the host over
# virtual Ethernet, not WiFi, so `adb svc wifi disable` does NOT drop the gateway
# WebSocket. On a PHYSICAL device the runner disables WiFi BEFORE launching this
# flow; on the emulator the runner skips it. (Alternative emulator path: stop the
# Docker gateway container — higher-impact, tested separately.) Excluded from the
# default batch via the physical-only tag.
#
# Pre-condition (set by the runner): gateway unreachable; the app's SDK loses its
# WS and enters the reconnect loop.
- launchApp
- extendedWaitUntil:
    visible: { id: "connection-lost-banner" }
    timeout: 30000
# Post-condition: the runner restores connectivity (→ 04b-reconnect-recover).

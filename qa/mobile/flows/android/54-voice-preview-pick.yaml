appId: io.dev32.sentient.debug
tags:
  - settings-voice
  - destructive-profile
---
# 54-voice-preview-pick — Voice settings: play a preview on a built-in voice
# (Briar), then Set active — the active badge moves. Original active voice
# ("Jarvis", id c624a6ca980346ec9dc38bb434fec506, a user-source pack) is restored
# by 54b-voice-restore.yaml (runs next via executionOrder). Batch-safe.
#
# DEFECT-7: settings-cat-voice is on the FIRST settings screen (Soul group, no
# scroll) — tap directly; scrollUntilVisible on an already-visible target
# overshoots to the footer.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-voice" }
- extendedWaitUntil:
    visible: { id: "settings-voice-screen" }
    timeout: 3000
- assertVisible: { id: "settings-voice-fish-nav" }
- takeScreenshot: "54-voice-before"
- tapOn: { id: "voice-play-briar" }
- extendedWaitUntil:
    visible: { id: "voice-play-briar" }
    timeout: 3000
- takeScreenshot: "54-voice-previewing"
- tapOn: { id: "voice-pick-briar" }
# active badge follows a full-profile PUT round-trip — network budget.
- extendedWaitUntil:
    visible: { id: "voice-active-briar" }
    timeout: 10000
- takeScreenshot: "54-voice-active-briar"

appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - destructive-profile
---
# 49-tools-toggle — Tools settings: disable the "fetch" MCP server; Save (SLOW
# apply/restart) removes the key from tools.enabled. Re-enabled by
# 49b-tools-restore.yaml (runs next via executionOrder). Batch-safe.
#
# DEFECT-3 applies to the per-server Switch (SectionHeaderRow wraps label+switch
# in one testTag'd Row; only the switch is clickable) — point tap at the switch's
# on-screen position. "fetch" is the first (alphabetically-sorted) server row.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-tools" }
- extendedWaitUntil:
    visible: { id: "settings-tools-screen" }
    timeout: 3000
- assertVisible: { id: "settings-tools-server-fetch" }
- takeScreenshot: "49-tools-before"
- tapOn:
    point: "84%,37%"
- assertVisible: "off"
- assertVisible: { id: "settings-tools-save" }
- tapOn: { id: "settings-tools-save" }
# apply completes in 5-12 ms on 2.0 (measured: `apply:orchestrator apply.ready
# elapsedMs=5..12`, 4 samples 2026-07-30). There is no supervisord and no Hermes
# worker to restart, so the old 45 s budget was padding that would have let a 30 s
# hang pass. 8000 ms = ~600x the measured server time, enough for the emulator/sim
# re-fetch + recomposition, tight enough to catch a real stall.
- extendedWaitUntil:
    notVisible: { id: "settings-apply-notice" }
    timeout: 8000
- takeScreenshot: "49-tools-after"

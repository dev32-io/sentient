appId: io.dev32.sentient.debug
tags:
  - session
---
# 07-rename-delete — long-press a session row to open the dropdown, rename it,
# then delete it. Self-cleaning (deletes the row it renamed → no leaked state).
# Requires ≥1 committed session (present after the chat flows by execution order).
# Batch-safe.
#
# ⚠ LIMITATION: the rename input testTag (history-rename-input) is invisible to
# Maestro inside an AlertDialog (Compose dialog a11y tree is partially flattened)
# — rely on auto-focus + eraseText. The confirm "Delete" text appears twice
# (menu item + dialog), so sequencing matters.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "history-new-chat" }
    timeout: 3000
- longPressOn:
    id: ".*history-row-.*"
- tapOn:
    text: "Rename"
- extendedWaitUntil:
    visible: "Save"
    timeout: 3000
# dialog input is auto-focused; erase prefilled text then type the new name.
- eraseText: 100
- inputText: "E2E Renamed"
- tapOn:
    text: "Save"
- extendedWaitUntil:
    notVisible: "Save"
    timeout: 3000
# drawer stays open after save; close it by swiping left.
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 3000
# re-open drawer to delete the renamed session.
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "history-new-chat" }
    timeout: 3000
- longPressOn:
    id: ".*history-row-.*"
- tapOn:
    text: "Delete"
- extendedWaitUntil:
    visible: "Delete chat?"
    timeout: 3000
- tapOn:
    text: "Delete"
# after delete the drawer stays open — verify no crash.
- assertVisible: { id: "history-new-chat" }

appId: io.dev32.sentient.debug
tags:
  - settings-admin
  - destructive-profile
---
# 41-members-add-cap — admin Members page: add two temp users (household 1/3 →
# 3/3), then verify "Add user" is disabled at the 3-user cap. The temp users are
# deleted by 43-members-delete-cleanup.yaml AFTER 42 uses one to log in.
# executionOrder runs 41 → 42 → 43. Batch-safe (the QA user is admin via the
# standard conditional login).
#
# ⚠️ HARD PRECONDITION — the household must hold EXACTLY ONE user.
# This flow adds two, so it only works from 1/3. Run it against a household that
# is already at 3/3 and `settings-members-add` is (correctly) DISABLED, the tap
# no-ops, and the flow dies on `"Display name" is visible` — which reads like a
# broken Add-user dialog and is not one. Checked 2026-07-30 on the dev box: three
# users existed, and the cap half of this flow was verified in isolation
# (`assertVisible: {id: settings-members-add, enabled: false}` COMPLETED) while
# the add half was not driveable.
# Check before running:  curl -sk https://127.0.0.1:8888/api/v1/auth/users
# Satisfy it by deleting the extra members through the Members UI first.
#
# ⚠️ NON-DETERMINISTIC IDS: the created users get server-random ids. 42 (Temp1
# login) and 43 (delete-by-id) hardcode ids that MUST be re-synced via
# `GET /api/v1/admin/users` after any fresh run of THIS flow.
#
# DEFECT-2: AddMemberDialog is a Material3 AlertDialog whose testTags are NOT
# covered by testTagsAsResourceId — its nodes have resource-id="". Use text
# selectors for the dialog fields/buttons.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- scrollUntilVisible:
    element: { id: "settings-cat-members" }
    direction: DOWN
- tapOn: { id: "settings-cat-members" }
- extendedWaitUntil:
    visible: { id: "settings-members-screen" }
    timeout: 3000
- takeScreenshot: "41-members-before"
# --- add temp1 ---
- tapOn: { id: "settings-members-add" }
- extendedWaitUntil:
    visible: "Display name"
    timeout: 3000
- tapOn: "Display name"
- inputText: "E2E Temp1"
- tapOn: "PIN"
- inputText: "1111"
- tapOn: "Add"
- extendedWaitUntil:
    notVisible: "Display name"
    timeout: 10000
- assertVisible: "E2E Temp1"
# --- add temp2 ---
- tapOn: { id: "settings-members-add" }
- extendedWaitUntil:
    visible: "Display name"
    timeout: 3000
- tapOn: "Display name"
- inputText: "E2E Temp2"
- tapOn: "PIN"
- inputText: "2222"
- tapOn: "Add"
- extendedWaitUntil:
    notVisible: "Display name"
    timeout: 10000
- assertVisible: "E2E Temp2"
- takeScreenshot: "41-members-at-cap"
# --- cap enforcement: 3/3, Add user must now be disabled ---
- assertVisible:
    id: "settings-members-add"
    enabled: false

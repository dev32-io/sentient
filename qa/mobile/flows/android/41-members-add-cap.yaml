appId: io.dev32.sentient.debug
---
# 41-members-add-cap — admin Members page: add two temp users (household starts at
# 1/3, ends at 3/3), then verify "Add user" is disabled at the 3-user cap. Temp
# users are cleaned up by 43-members-delete-cleanup.yaml AFTER the non-admin-gate
# case (42) uses one of them to log in. Run login.yaml immediately before this.
#
# tags: [android, emulator-ok]
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible:
      id: "settings-open"
    timeout: 5000
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "settings-cat-members"
    direction: DOWN
- tapOn:
    id: "settings-cat-members"
- extendedWaitUntil:
    visible:
      id: "settings-members-screen"
    timeout: 5000
- takeScreenshot: "41-members-before"
# NOTE: AddMemberDialog is a Material3 AlertDialog, rendered in a separate window
# that does NOT inherit the testTagsAsResourceId semantics modifier applied only to
# AppNavHost's outer Surface (nav/AppNavHost.kt:77). Its testTags are therefore
# invisible to id: selectors here (confirmed via uiautomator dump — dialog nodes all
# have resource-id=""). Flagged as a defect; text selectors are the workaround.
# --- add temp1 ---
- tapOn:
    id: "settings-members-add"
- extendedWaitUntil:
    visible: "Display name"
    timeout: 5000
- tapOn: "Display name"
- inputText: "E2E Temp1"
- tapOn: "PIN"
- inputText: "1111"
- tapOn: "Add"
- extendedWaitUntil:
    notVisible: "Display name"
    timeout: 10000
- assertVisible: "E2E Temp1"
# --- add temp2 ---
- tapOn:
    id: "settings-members-add"
- extendedWaitUntil:
    visible: "Display name"
    timeout: 5000
- tapOn: "Display name"
- inputText: "E2E Temp2"
- tapOn: "PIN"
- inputText: "2222"
- tapOn: "Add"
- extendedWaitUntil:
    notVisible: "Display name"
    timeout: 10000
- assertVisible: "E2E Temp2"
- takeScreenshot: "41-members-at-cap"
# --- cap enforcement: 3/3, Add user must now be disabled ---
- assertVisible:
    id: "settings-members-add"
    enabled: false

appId: io.dev32.sentient.debug
---
# login-temp1 — cold-launch -> select the non-admin E2E Temp1 seed user (PIN 1111)
# -> chat screen. Used only for the non-admin-gate settings case; E2E Temp1/Temp2
# are provisioned via the real UI "Add user" path by 41-members-add-cap.yaml
# (post-65c00dd fix) and deleted by 43-members-delete-cleanup.yaml.
#
# NOTE: user ids are server-generated random hex (crypto.randomUUID().slice(0,8)),
# NOT deterministic — re-running 41-members-add-cap.yaml produces a NEW id every
# time. This hardcoded id must be re-synced (via GET /api/v1/admin/users) after
# any fresh run of 41 before this flow (and 43-members-delete-cleanup.yaml) will
# work. Current as of the 2026-07-16 settings-parity E2E pass: u_50104890.
#
# tags: [android, emulator-ok]
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login-backend-setup"
    timeout: 8000
- tapOn:
    id: "login-avatar-u_50104890"
    optional: false
- extendedWaitUntil:
    visible:
      id: "pin-key-1"
    timeout: 5000
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-1"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 15000

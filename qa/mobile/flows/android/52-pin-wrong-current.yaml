appId: io.dev32.sentient.debug
tags:
  - settings-user
---
# 52-pin-wrong-current — Account page: Change PIN with a WRONG current PIN surfaces
# "Current PIN is wrong" inline (401 invalid-credentials, handleChangePin), dialog
# stays open, no logout, no lockout. Never changes the real PIN. Batch-safe:
# self-navigates to the Account screen.
#
# DEFECT-2: ChangePinDialog is a Material3 AlertDialog — testTags not covered by
# testTagsAsResourceId. "Cancel"/"Update PIN" are plain text (selectors work). The
# PIN fields have no id either, BUT each OutlinedTextField's LABEL ("Current PIN" /
# "New PIN") renders INSIDE its field bounds (confirmed via uiautomator dump), so
# tapping the label text focuses the field. This replaces the old fragile point
# taps: the dialog does NOT reliably shift up when the keyboard appears (New PIN
# stayed at ~56%, not the assumed ~42%), so a calibrated point tap missed the field
# and left the new PIN empty → no validation error. Text taps are position-proof.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
# see DEFECT-8 in 51 — one plain scroll clears Account from the pinned footer.
- scroll
- tapOn: { id: "settings-cat-account" }
- extendedWaitUntil:
    visible: { id: "settings-account-screen" }
    timeout: 3000
- tapOn: { id: "settings-account-change-pin" }
- extendedWaitUntil:
    visible: "Change PIN"
    timeout: 3000
- tapOn: { text: "Current PIN" }
- inputText: "9999"
- tapOn: { text: "New PIN" }
- inputText: "5555"
- tapOn: "Update PIN"
- extendedWaitUntil:
    visible: "Current PIN is wrong"
    timeout: 5000
- takeScreenshot: "52-pin-wrong-current"
- tapOn: "Cancel"
# "Change PIN" is BOTH the dialog title AND the trigger button label — assert on
# dialog-only body text instead (a notVisible on "Change PIN" can never succeed).
- extendedWaitUntil:
    notVisible: "Enter your current 4-digit PIN, then choose a new one."
    timeout: 3000
# no lockout: still on Account, still logged in.
- assertVisible: { id: "settings-account-screen" }

appId: io.dev32.sentient.debug
tags:
  - settings-user
  - destructive-profile
---
# 51-account-rename — Account page: change display name, Save (imperative PUT
# /auth/me), inline "Saved". Original name "Kevin" restored by
# 51b-account-restore.yaml (runs next via executionOrder). Batch-safe.
#
# DEFECT-8: the settings-root update footer is pinned at a FIXED on-screen
# position INDEPENDENT of scroll and overlaps the USER-group Account row at the
# initial (unscrolled) position — a direct tap on Account lands ON the footer and
# no-ops. One small plain `scroll` (NOT scrollUntilVisible, which overshoots to
# the footer) clears Account from the footer's zone before tapping.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- scroll
- tapOn: { id: "settings-cat-account" }
- extendedWaitUntil:
    visible: { id: "settings-account-screen" }
    timeout: 3000
# wait for the name field to load (not a specific name text — baseline-agnostic, so
# an interrupted prior run that left "KevinTest" can't wedge this pre-check; 51b
# always restores to "Kevin").
- extendedWaitUntil:
    visible: { id: "settings-account-name-field" }
    timeout: 3000
- takeScreenshot: "51-account-before"
# field prefills the current name — clear before typing (stale-cursor caveat, see 45b).
- tapOn: { id: "settings-account-name-field" }
- eraseText: 20
- inputText: "KevinTest"
- tapOn: { id: "settings-account-name-save" }
# "Saved" follows a PUT /auth/me round-trip — network budget.
- extendedWaitUntil:
    visible: "Saved"
    timeout: 8000
- takeScreenshot: "51-account-saved"

appId: io.dev32.sentient.debug
---
# 60-model-offline-save-recover — continuation-only (no launchApp): run after
# the harness restores connectivity following 60-model-offline-save-trigger.yaml.
# Retries Save for real (now that the network is back) then restores the
# original model (deepseek-v4-flash:cloud), same as 45b-model-restore.yaml.
#
# tags: [android, emulator-ok]
- tapOn:
    id: "settings-model-save"
- assertVisible:
    id: "settings-apply-notice"
- extendedWaitUntil:
    notVisible:
      id: "settings-apply-notice"
    timeout: 45000
- takeScreenshot: "60-offline-save-recovered"
# restore original model
- tapOn:
    point: "90%,28%"
- eraseText: 60
- inputText: "deepseek-v4-flash"
- extendedWaitUntil:
    visible:
      id: "settings-model-card-deepseek-v4-flash:cloud"
    timeout: 5000
- tapOn:
    id: "settings-model-card-deepseek-v4-flash:cloud"
- assertVisible:
    id: "settings-model-save"
- tapOn:
    id: "settings-model-save"
- assertVisible:
    id: "settings-apply-notice"
- extendedWaitUntil:
    notVisible:
      id: "settings-apply-notice"
    timeout: 45000

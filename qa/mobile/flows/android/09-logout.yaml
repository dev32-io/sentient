appId: io.dev32.sentient.debug
---
# 09-logout — open the history drawer, tap settings-open (gear in account header),
# tap settings-logout, assert the app routes back to the login screen.
#
# settings-open lives in HistoryAccountHeader inside the drawer.
# After logout, DisplayNameStore.name clears → AppConfiguredRoot shows LoginScreen.
# The login screen renders either an avatar grid or a pin pad; we assert the
# loading spinner or error view is NOT present and instead the avatar grid or
# login-backend-setup button appears (login-backend-setup is always visible on the
# login screen per LoginScreen.kt).
#
# tags: [android, emulator-ok]
- launchApp
- assertVisible:
    id: "composer-input"
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible:
      id: "history-new-chat"
    timeout: 5000
# Tap the gear icon (settings-open) in the account header
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-logout"
    timeout: 5000
- tapOn:
    id: "settings-logout"
# After logout: login screen appears (login-backend-setup button is always present)
- extendedWaitUntil:
    visible:
      id: "login-backend-setup"
    timeout: 10000

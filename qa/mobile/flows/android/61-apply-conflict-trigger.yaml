appId: io.dev32.sentient.debug
tags:
  - settings-soul
  - fault-armed
---
# 61-apply-conflict-trigger (part 2/2) — continuation (no launchApp): tap Save on
# the already-dirty Model page from …-setup. Expect: "Another change is already
# applying…" via settings-apply-notice (ApplyState.AlreadyApplying), no crash,
# page stays usable. fault-armed; excluded from the default batch.
#
# TIMING NOTE: a `maestro test` CLI invocation has enough startup latency (~15s to
# the first tap) that racing it against a backgrounded `curl -X POST /profile/apply`
# (3-13s server-side) reliably LOSES — the curl finishes first, so this flow run
# alone re-validates the ordinary save path, NOT the conflict. The conflict WAS
# reproduced by replacing the final tap with a raw `adb shell input tap <x> <y>`
# fired in the SAME shell right after backgrounding the curl (near-zero overhead);
# gateway logged apply.rejected-concurrent. The runner uses that adb-tap variant.
- tapOn: { id: "settings-model-save" }
# 5000ms: apply retry / offline model save round-trip to the gateway
- extendedWaitUntil:
    visible: { id: "settings-apply-notice" }
    timeout: 5000
- takeScreenshot: "61-apply-conflict-notice"
# SLOW apply/restart budget.
- extendedWaitUntil:
    notVisible: { id: "settings-apply-notice" }
    timeout: 45000
- takeScreenshot: "61-apply-conflict-cleared"

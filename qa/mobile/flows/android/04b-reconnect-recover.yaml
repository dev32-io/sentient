appId: io.dev32.sentient.debug
tags:
  - reconnect
  - physical-only
---
# 04b-reconnect-recover — restore pair for 04: assert the connection banner clears
# after connectivity is restored and the composer is usable again.
#
# Continuation of 04 (physical-only, runner-orchestrated): the runner re-enables
# WiFi / restarts the gateway with the app still running from 04, then runs this.
# No launchApp — the SDK is mid-reconnect on the same process. Excluded from the
# default batch via physical-only.
- extendedWaitUntil:
    notVisible: { id: "connection-lost-banner" }
    timeout: 40000
- assertVisible: { id: "composer-input" }

appId: io.dev32.sentient.debug
tags:
  - settings-voice
  - destructive-profile
---
# 62-fish-clone-happy — Voice settings → Clone from Fish (gated on
# features.fish_browse_enabled, TRUE on this local stack) → search → play sample →
# pick a tile (opens the prefilled clone form, NOT an immediate mutating call) →
# Clone voice (real POST .../clone against a live Fish API key). A successful clone
# auto-activates the new pack. Cleaned up + active-voice restored by 62b (runs
# next via executionOrder). Batch-safe.
#
# Targets a known-good, catalog-stable Fish voice id
# (98e364e9a41c465a9d4fdafc267f84ea, "Deep Voice English (Anthony)") — fish-tile/
# -play/-clone testTags are keyed by the Fish catalog id.
#
# DEFECT-7: settings-cat-voice is above the fold — tap directly.
# DEFECT-10: VoiceScreen doesn't refresh after a sub-screen pops back — force a
# fresh mount (leave Voice, re-enter).
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-voice" }
- extendedWaitUntil:
    visible: { id: "settings-voice-screen" }
    timeout: 3000
- tapOn: { id: "settings-voice-fish-nav" }
- extendedWaitUntil:
    visible: { id: "settings-voice-fish-screen" }
    timeout: 3000
- tapOn: { id: "fish-search" }
- inputText: "Deep Voice English"
# Fish catalog search round-trip — network budget.
- extendedWaitUntil:
    visible: { id: "fish-tile-98e364e9a41c465a9d4fdafc267f84ea" }
    timeout: 10000
- takeScreenshot: "62-fish-search-results"
- tapOn: { id: "fish-play-98e364e9a41c465a9d4fdafc267f84ea" }
- extendedWaitUntil:
    visible: { id: "fish-play-98e364e9a41c465a9d4fdafc267f84ea" }
    timeout: 3000
- takeScreenshot: "62-fish-playing-sample"
- tapOn: { id: "fish-clone-98e364e9a41c465a9d4fdafc267f84ea" }
- extendedWaitUntil:
    visible: { id: "fish-clone-form" }
    timeout: 3000
- takeScreenshot: "62-fish-clone-form-prefilled"
- tapOn: { id: "fish-clone-submit" }
# clone round-trip (sample download + voice.create) — network budget.
- extendedWaitUntil:
    visible: { id: "settings-voice-screen" }
    timeout: 20000
# DEFECT-10: force a fresh mount to pick up the cloned pack.
- tapOn: { id: "settings-voice-back" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-voice" }
- extendedWaitUntil:
    visible: { id: "settings-voice-screen" }
    timeout: 3000
- tapOn: "Yours"
- extendedWaitUntil:
    visible: "Deep Voice English \\(Anthony\\)"
    timeout: 5000
- takeScreenshot: "62-fish-cloned-in-list"

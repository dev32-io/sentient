appId: io.dev32.sentient.debug
tags:
  - settings-voice
  - restore
---
# 55b-voice-delete-user-pack — restore pair for 55: delete the "E2E RecordTest"
# pack (Delete testTag voice-delete-<voiceId>, rendered only for source=="user"
# packs) and restore the active voice to Jarvis (create auto-activated the new
# pack). Batch-safe: self-navigates from chat root, filters to "Yours".
# executionOrder runs it right after 55.
#
# ⚠️ NON-DETERMINISTIC ID: the pack's voiceId is server-random per create — re-sync
# via `GET /api/v1/voices` after any fresh 55 run. As of the 2026-07-16 pass:
# 1db15a2889474efbb91c2ef397e4fe91.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-voice" }
- extendedWaitUntil:
    visible: { id: "settings-voice-screen" }
    timeout: 3000
- tapOn: "Yours"
- tapOn: { id: "voice-delete-1db15a2889474efbb91c2ef397e4fe91" }
- extendedWaitUntil:
    visible: "Delete"
    timeout: 3000
- takeScreenshot: "55b-voice-delete-confirm"
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "E2E RecordTest"
    timeout: 10000
- takeScreenshot: "55b-voice-deleted"
# restore active voice to Jarvis (create auto-activated the now-deleted pack).
- tapOn: { id: "voice-pick-c624a6ca980346ec9dc38bb434fec506" }
- extendedWaitUntil:
    visible: { id: "voice-active-c624a6ca980346ec9dc38bb434fec506" }
    timeout: 10000
- takeScreenshot: "55b-voice-restored-jarvis"

appId: io.dev32.sentient.debug
tags:
  - reconnect
  - fault-armed
---
# 04c (part 1/2) — warm-reconnect conversation continuity, FIRST turn.
#
# Validates: on a WARM WS reconnect the next message CONTINUES the same Hermes
# conversation (gateway logs `resume.reanchor source=configure`, dispatch.end
# conversationId unchanged, NO dispatch.session-new.lazy). This flow only
# establishes the conversation (login + one turn the follow-up references). The
# reconnect is forced BETWEEN this flow and 04c-...-followup.yaml by the runner
# (airplane-mode toggle + tap the "Connection lost. Tap to reconnect" banner) —
# hence `fault-armed`, excluded from the default batch and run by the runner's
# orchestration phase.
- launchApp:
    clearState: true
- runFlow:
    file: "_helpers/login.yaml"
- tapOn: { id: "composer-input" }
- inputText: "My favorite number is 42. Please remember it."
- tapOn: { id: "chat-send" }
- hideKeyboard
# LLM round-trip — genuinely slow.
- extendedWaitUntil:
    visible: { id: "assistant-bubble" }
    timeout: 45000

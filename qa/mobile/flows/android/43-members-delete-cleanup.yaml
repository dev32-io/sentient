appId: io.dev32.sentient.debug
---
# 43-members-delete-cleanup — admin Members page: delete both E2E Temp1/Temp2
# seed users (created via the real UI "Add user" path by 41-members-add-cap.yaml),
# restoring the household to 1/3 (Kevin only). Confirm dialog is a Material3
# AlertDialog (see DEFECT-2 testTagsAsResourceId note) — use text selectors for
# its buttons. Run login.yaml (Kevin) immediately before this.
#
# NOTE: ids below are NOT deterministic (server-random) — re-sync via
# GET /api/v1/admin/users after any fresh 41-members-add-cap.yaml run. Current
# as of the 2026-07-16 settings-parity E2E pass: u_50104890 (Temp1), u_da54f79b
# (Temp2).
#
# tags: [android, emulator-ok]
- tapOn:
    id: "history-open"
- extendedWaitUntil:
    visible:
      id: "settings-open"
    timeout: 5000
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "settings-cat-members"
    direction: DOWN
- tapOn:
    id: "settings-cat-members"
- extendedWaitUntil:
    visible:
      id: "settings-members-screen"
    timeout: 5000
# delete E2E Temp1
- tapOn:
    id: "settings-members-delete-u_50104890"
- extendedWaitUntil:
    visible: "Remove"
    timeout: 5000
- tapOn: "Remove"
- extendedWaitUntil:
    visible: "2 active · 1 slot free"
    timeout: 10000
# delete E2E Temp2
- tapOn:
    id: "settings-members-delete-u_da54f79b"
- extendedWaitUntil:
    visible: "Remove"
    timeout: 5000
- tapOn: "Remove"
- extendedWaitUntil:
    visible: "1 active · 2 slots free"
    timeout: 10000
- takeScreenshot: "43-members-restored"

appId: io.dev32.sentient.debug
tags:
  - settings-soul
---
# 59-audio-dirty-back-discard — Audio settings: toggle "Speak responses (TTS)" off
# (dirty draft, NEVER saved), tap back → "Discard changes?" (shared
# SettingsDiscardDialog) → Discard → lands on settings-screen → re-opening Audio
# shows TTS still ON (draft discarded, no PUT fired). No mutation → no restore.
# Batch-safe.
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "_helpers/login.yaml"
- tapOn: { id: "history-open" }
- extendedWaitUntil:
    visible: { id: "settings-open" }
    timeout: 3000
- tapOn: { id: "settings-open" }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
- tapOn: { id: "settings-cat-audio" }
- extendedWaitUntil:
    visible: { id: "settings-audio-screen" }
    timeout: 3000
- assertNotVisible: { id: "settings-audio-save" }
# DEFECT-3 point-tap workaround (see 44) — the Switch is the only clickable target.
- tapOn:
    point: "84%,36%"
- assertVisible: { id: "settings-audio-save" }
- takeScreenshot: "59-audio-dirty-before-back"
- tapOn: { id: "settings-audio-back" }
- extendedWaitUntil:
    visible: "Discard changes?"
    timeout: 3000
- takeScreenshot: "59-audio-discard-dialog"
- tapOn: "Discard"
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 3000
# re-open Audio: TTS toggle restored to ON (no PUT fired, draft discarded).
- tapOn: { id: "settings-cat-audio" }
- extendedWaitUntil:
    visible: { id: "settings-audio-screen" }
    timeout: 3000
- assertNotVisible: { id: "settings-audio-save" }
- takeScreenshot: "59-audio-restored-no-save-fired"

appId: io.dev32.sentient.debug
tags:
  - voice-loop
  - fault-armed
---
# 08-voice-loop — fixture-audio mic uplink via FaultAwareCaptureAdapter.
# No-relaunch flow: the runner pushes the fixture to the app cache + arms the
# fixture fault on the RUNNING app BEFORE this flow, then greps logcat for
# "fixture-utterance" + "startMic" after. Excluded from the default batch
# (fault-armed); run by the runner's orchestration phase.
#
# Fixture plumbing is WIRED; the full STT→LLM→TTS loop needs a real SPEECH fixture
# (silence-500ms.pcm exercises only injection + the Opus encoder path — STT sees
# silence → no transcript → no Hermes cycle → no assistant bubble to assert).
#
# Pre-condition (runner, app already running):
#   1. composer-input visible.
#   2. Fixture pushed to the app cache via run-as.
#   3. adb shell am broadcast -a io.sentient.debug.FAULT -p io.dev32.sentient.debug
#        --es kind fixture --es name sentient-fixture.pcm
- assertVisible: { id: "composer-input" }
# tap mic to start the fixture-fed uplink.
- tapOn: { id: "chat-mic" }
- assertVisible: { id: "chat-mic" }
# let the fixture drain through the pipeline.
- extendedWaitUntil:
    visible: { id: "chat-mic" }
    timeout: 3000
- tapOn: { id: "chat-mic" }
# app must still be alive (no crash from fixture injection).
- assertVisible: { id: "composer-input" }

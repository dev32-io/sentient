appId: io.dev32.sentient.debug
---
# 08-voice-loop — fixture-audio mic uplink via FaultAwareCaptureAdapter.
#
# VOICE-LOOP STATUS:
#   - Fixture plumbing: WIRED (FaultAwareCaptureAdapter feeds fixture to uplink).
#   - Arming: via broadcast (harness pushes fixture to app cache + arms).
#   - Full STT→LLM→TTS loop: REQUIRES a real speech fixture (not silence).
#     The silence-500ms.pcm fixture tests the fixture injection plumbing +
#     Opus encoder path only. STT will see silence → no transcript → no Hermes
#     cycle. The assistant-bubble assert is SKIPPED for silence.
#
# PRE-CONDITION (handled by harness WHILE THIS APP IS RUNNING — no relaunch):
#   1. App running and showing chat (composer-input visible).
#   2. Fixture pushed to app cache dir via run-as pipe.
#   3. Fault armed: adb shell am broadcast -a io.sentient.debug.FAULT
#        -p io.dev32.sentient.debug --es kind fixture --es name sentient-fixture.pcm
#
# Log trail assertions (in run-e2e.sh after this flow):
#   - "fixture-utterance" — FaultAwareCaptureAdapter injected the fixture.
#   - "startMic" — SDK confirmed mic start.
#   - "audio.start" (uplink connector) — wire frame sent.
#
# FLAG: Full STT→LLM→TTS requires a real speech PCM fixture.
#
# tags: [android, emulator-ok, fault-injection, voice-loop, fixture-plumbing, no-relaunch]
- assertVisible:
    id: "composer-input"
# Tap mic to start fixture-fed uplink
- tapOn:
    id: "chat-mic"
# Assert mic button still visible (no crash from fixture injection)
- assertVisible:
    id: "chat-mic"
# Wait for fixture to drain through the pipeline
- extendedWaitUntil:
    visible:
      id: "chat-mic"
    timeout: 4000
# Stop mic
- tapOn:
    id: "chat-mic"
# App must still be alive and not crashed
- assertVisible:
    id: "composer-input"

appId: io.dev32.sentient.debug
---
# Smoke: send a text message and confirm the assistant streams a reply.
# Verifies the end-to-end streaming fix (text.input -> gateway -> Hermes -> events -> ChatContent live bubble).
- launchApp
- assertVisible:
    id: "composer-input"
- tapOn:
    id: "composer-input"
- inputText: "what time is it in tokyo right now"
- tapOn:
    id: "chat-send"
# assistant bubble should appear and stream a reply within the cycle window
- extendedWaitUntil:
    visible:
      id: "assistant-bubble"
    timeout: 40000

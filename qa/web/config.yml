# qa-session config — sentient web platform.
#
# Stack lifecycle is set to "leave it running between runs" for faster
# iteration during the design refresh. Change `teardown.when:` to
# `always` if you want clean shutdowns between every QA pass.

base_url: https://localhost:8888

stack:
  setup:
    # Bring the gateway up if it isn't already. `up -d` is idempotent —
    # if the container is already running, this is effectively a no-op.
    - command: docker compose -f deploy/docker/docker-compose.yml up -d gateway
      cwd: "."
  health_check:
    url: https://localhost:8888/
    timeout_s: 60
    insecure: true   # gateway uses a self-signed cert on localhost
  teardown:
    - command: echo "leaving gateway running for next iteration"
      cwd: "."
    when: never   # set to `always` to docker compose down between runs

# Browser session budget per charter. Bump tool_calls to 200 if a
# design-refresh charter walking many screens stops too early.
session_budget:
  tool_calls: 100
  max_tool_calls: 200

# Risk weights — defaults are reasonable. Tune `recent_recurrence`
# higher if you want recurring bugs to dominate the schedule.
risk_weights:
  lines_changed: 1.0
  recent_recurrence: 2.0
  recent_issues: 0.5
  days_since: 0.1

auto_close_after_misses: 3

auth:
  profile_max_age_hours: 24

# Empty = let detect_context.sh auto-detect (qa-session.baseBranch git
# config → develop → newest-merge-base → fallback chain).
parent_branch_override: ""

parallelism: 3   # ignored in v1; charters run serially

# qa-session config — sentient WebUI.
# The design-refresh matrix uses the real local stack and outward HTTPS door.

base_url: https://localhost/

stack:
  setup:
    # scripts/stack.sh is the sole local-stack lifecycle authority. Start it only
    # when the outward door is absent; never use the retired compose gateway.
    - command: curl -skf https://localhost/api/v1/ready >/dev/null || (nohup bash scripts/stack.sh up > /tmp/sentient-qa-stack.log 2>&1 &)
      cwd: "."
  health_check:
    url: https://localhost/api/v1/ready
    timeout_s: 90
    insecure: true   # loopback development certificate only
  teardown:
    - command: echo "leaving the scripts/stack.sh local stack running for the next charter"
      cwd: "."
    when: never

session_budget:
  tool_calls: 100
  max_tool_calls: 200

risk_weights:
  lines_changed: 1.0
  recent_recurrence: 2.0
  recent_issues: 0.5
  days_since: 0.1

auto_close_after_misses: 3

auth:
  profile_max_age_hours: 24

parent_branch_override: ""
parallelism: 3

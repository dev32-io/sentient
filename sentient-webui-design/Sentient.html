<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentient — Smart Home Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="message.jsx"></script>
<script type="text/babel" src="chat_view.jsx"></script>
<script type="text/babel" src="settings_view.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dusk",
  "bubble": "filled",
  "density": "comfortable",
  "fonts": "modern",
  "orb": "bars",
  "toolcard": "default"
}/*EDITMODE-END*/;

const App = () => {
  const [route, setRoute] = React.useState(() => {
    return localStorage.getItem("sentient:route") || "chat";
  });
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [editMode, setEditMode] = React.useState(false);
  const [tweaks, setTweaks] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("sentient:tweaks") || "null");
      return { ...TWEAK_DEFAULTS, ...(saved || {}) };
    } catch { return TWEAK_DEFAULTS; }
  });

  React.useEffect(() => { localStorage.setItem("sentient:route", route); }, [route]);
  React.useEffect(() => {
    localStorage.setItem("sentient:tweaks", JSON.stringify(tweaks));
    const r = document.documentElement;
    r.setAttribute("data-theme", tweaks.theme);
    r.setAttribute("data-bubble", tweaks.bubble);
    r.setAttribute("data-density", tweaks.density);
    r.setAttribute("data-fonts", tweaks.fonts);
    r.setAttribute("data-orb", tweaks.orb);
    r.setAttribute("data-toolcard", tweaks.toolcard);
  }, [tweaks]);

  // Edit mode protocol
  React.useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") { setEditMode(true); setTweaksOpen(true); }
      if (d.type === "__deactivate_edit_mode") { setEditMode(false); setTweaksOpen(false); }
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const setTweak = (k, v) => {
    setTweaks(prev => {
      const next = { ...prev, [k]: v };
      window.parent.postMessage({ type: "__edit_mode_set_keys", edits: next }, "*");
      return next;
    });
  };

  return (
    <div className="app" data-screen-label={route === "chat" ? "01 Chat" : "02 Settings"}>
      <header className="topbar">
        <div className="brand">
          <span className="mark"/>
          <span>Sentient</span>
        </div>
        <div className="crumbs">
          <span>The Chen House</span>
          <span className="dot"/>
          <span>{route === "chat" ? "Conversation" : "Household"}</span>
        </div>

        <div className="spacer"/>

        <div className="status-chip">
          <span className="dot-live"/> 14 devices online
        </div>

        <button className={`icon-btn ${route === "chat" ? "active" : ""}`}
                onClick={() => setRoute("chat")} title="Chat">
          <Icon name="chat" size={18}/>
        </button>
        <button className="icon-btn" title="Notifications">
          <Icon name="bell" size={18}/>
        </button>
        <button className={`icon-btn ${route === "settings" ? "active" : ""}`}
                onClick={() => setRoute("settings")} title="Settings">
          <Icon name="settings" size={18}/>
        </button>
      </header>

      {route === "chat" ? <ChatView/> : <SettingsView/>}

      {route === "chat" && <Dock/>}

      {/* Tweaks toggle — only visible when edit mode is on by host toolbar */}
      {editMode && (
        <button className="icon-btn tweaks-toggle"
                style={{background:"var(--paper)", border:"1px solid var(--line)", boxShadow:"var(--shadow-1)"}}
                onClick={() => setTweaksOpen(o => !o)}>
          <Icon name="sliders" size={18}/>
        </button>
      )}

      <div className={`tweaks ${tweaksOpen ? "open" : ""}`}>
        <header>
          <span className="title">Tweaks</span>
          <button className="icon-btn" onClick={() => setTweaksOpen(false)}>
            <Icon name="x" size={16}/>
          </button>
        </header>

        <TweakChips label="Color theme" val={tweaks.theme} onSet={v => setTweak("theme", v)}
                    options={[["warm","Warm"],["sage","Sage"],["dusk","Dusk"],["ink","Ink"]]}/>
        <TweakChips label="Bubble style" val={tweaks.bubble} onSet={v => setTweak("bubble", v)}
                    options={[["filled","Filled"],["outlined","Outlined"],["plain","Plain"]]}/>
        <TweakChips label="Layout density" val={tweaks.density} onSet={v => setTweak("density", v)}
                    options={[["comfortable","Comfortable"],["cozy","Cozy"],["compact","Compact"]]}/>
        <TweakChips label="Font pairing" val={tweaks.fonts} onSet={v => setTweak("fonts", v)}
                    options={[["serif","Instrument+Inter"],["modern","Fraunces+DM"],["mono","Mono"]]}/>
        <TweakChips label="Voice orb" val={tweaks.orb} onSet={v => setTweak("orb", v)}
                    options={[["ripple","Ripple"],["ring","Ring"],["bars","Bars only"]]}/>
        <TweakChips label="Tool card" val={tweaks.toolcard} onSet={v => setTweak("toolcard", v)}
                    options={[["default","Default"],["rich","Rich"],["compact","Compact"]]}/>
      </div>
    </div>
  );
};

const TweakChips = ({ label, val, onSet, options }) => (
  <div className="group">
    <label>{label}</label>
    <div className="chips">
      {options.map(([k, l]) => (
        <div key={k} className={`c ${val === k ? "on" : ""}`} onClick={() => onSet(k)}>{l}</div>
      ))}
    </div>
  </div>
);

// Composer with integrated interrupt & task tray
const Dock = () => {
  const [text, setText] = React.useState("");
  const [micOn, setMicOn] = React.useState(true);
  const [openTask, setOpenTask] = React.useState(null);
  const [streaming, setStreaming] = React.useState(true);

  const tasks = [
    { icon: "phone", name: "send_message", status: "run", subtitle: "to: Jordan · waiting for confirmation" },
    { icon: "music", name: "play_music",   status: "ok",  subtitle: 'album: "Currents" · Kitchen · vol 32%' },
    { icon: "lamp",  name: "run_scene",    status: "ok",  subtitle: 'scene: "Monday Morning" · 4 devices' },
  ];
  const open = openTask !== null ? tasks[openTask] : null;

  return (
    <div className="dock">
      <div className="dock-inner">

        <div className={`composer ${micOn ? "listening" : ""} ${streaming ? "streaming" : ""}`}>
          {/* Top task strip — same design as bubble tool pills, expands upward */}
          <div className="composer-tasks-top tools">
            {openTask !== null && (
              <div className="tool-inline">
                <div className="t-sub-line">{tasks[openTask].subtitle}</div>
              </div>
            )}
            <div className="tools-strip">
              {tasks.map((t, i) => {
                const isOpen = openTask === i;
                return (
                  <button
                    key={i}
                    className={`pill ${t.status} ${isOpen ? "open" : ""}`}
                    onClick={() => setOpenTask(isOpen ? null : i)}>
                    <span className="pill-icon"><Icon name={t.icon} size={14}/></span>
                    <code>{t.name}</code>
                    <span className="s-dot"/>
                    <span className="pill-chev"><Icon name="chevron" size={10}/></span>
                  </button>
                );
              })}
            </div>
          </div>

          <textarea
            className="composer-textarea"
            rows={3}
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder={
              streaming ? "Type or speak — Sentient will listen"
                        : (micOn ? "Listening — just speak, or type here"
                                 : "Message Sentient…")
            }
          />

          <div className="composer-bottom-row">
            <button
              className={`icon-btn mic-btn ${micOn ? "on" : "off"}`}
              title={micOn ? "Mute microphone" : "Turn on microphone"}
              onClick={() => setMicOn(m => !m)}>
              <Icon name={micOn ? "mic" : "mic-off"} size={16}/>
            </button>
            <span className="spacer"/>
            <button className="send-btn square" disabled={!text}>
              <Icon name="send" size={16}/>
            </button>
            {streaming && (
              <button
                className="icon-btn interrupt-icon-btn"
                title="Interrupt Sentient"
                onClick={() => setStreaming(false)}>
                <span className="sq"/>
              </button>
            )}
          </div>
        </div>

        {/* suggest */}
        <div className="suggest">
          <span className="s">Good night routine</span>
          <span className="s">Who was at the door at 3pm?</span>
          <span className="s">Lower the kitchen lights 30%</span>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

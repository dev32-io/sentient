<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentient — Mobile</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css?v=23"/>
<link rel="stylesheet" href="mobile.css?v=10"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="sentient-mark.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="message.jsx"></script>
<script type="text/babel" src="chat_view.jsx"></script>

<script type="text/babel">
// Mobile Sentient — one unified design for iOS + Android. Reuses the webui's
// design tokens (styles.css) and components (SentientMark, Message, ChatView).

// ---- Past chats data (mobile-tuned, condensed) ----
const M_HISTORY = [
  { group: "Today", items: [
    { id: "c1", title: "Morning routine & weather", time: "7:45 AM", preview: "Added to your list and message drafted…" },
    { id: "c2", title: "Get me some news for today", time: "6:30 AM", preview: "Here are today's headlines for you…" },
  ]},
  { group: "Yesterday", items: [
    { id: "c3", title: "Plan Mia's birthday party", time: "6:21 PM", preview: "8 friends coming on Saturday…" },
    { id: "c4", title: "Reorder grocery list",      time: "4:03 PM", preview: "Updated Tuesday's list — 12 things…" },
  ]},
  { group: "Earlier this week", items: [
    { id: "c5", title: "Lasagna recipe for Mia",    time: "Mon", preview: "Without eggs, smaller portions…" },
    { id: "c6", title: "Who was at the door at 3pm", time: "Mon", preview: "It was Jordan from across the street…" },
    { id: "c7", title: "Sunday morning routine",    time: "Sun", preview: "Lights at 7am, kettle, soft music…" },
  ]},
];

// ---- History drawer (mobile sheet) ----
const MobileHistory = ({ open, onClose, currentId, onSelect }) => {
  const [q, setQ] = React.useState("");
  const groups = q
    ? M_HISTORY.map(g => ({ ...g, items: g.items.filter(it =>
        (it.title + " " + it.preview).toLowerCase().includes(q.toLowerCase())) }))
        .filter(g => g.items.length > 0)
    : M_HISTORY;

  return (
    <>
      <div className={`m-hx-backdrop ${open ? "show" : ""}`} onClick={onClose}/>
      <aside className={`m-hx ${open ? "show" : ""}`} aria-hidden={!open}>
        <header className="m-hx-head">
          <button className="m-hx-account" onClick={onClose}>
            <span className="m-hx-avatar">M</span>
            <span className="m-hx-account-meta">
              <span className="m-hx-account-name">Maya Chen</span>
              <span className="m-hx-account-sub">The Chen House</span>
            </span>
          </button>
          <button className="m-iconbtn" onClick={onClose} aria-label="Settings">
            <Icon name="settings" size={19}/>
          </button>
        </header>

        <div className="m-hx-search">
          <Icon name="search" size={15}/>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search past chats"/>
        </div>

        <div className="m-hx-body">
          <h2 className="m-hx-section-title">Past chats</h2>
          {groups.length === 0 ? (
            <div className="hx-empty"><Icon name="search" size={26}/><p>Nothing matched “{q}”</p></div>
          ) : groups.map((g, gi) => (
            <section key={gi} className="m-hx-group">
              <h3 className="m-hx-group-label">{g.group}</h3>
              {g.items.map(it => (
                <button key={it.id}
                        className={`m-hx-item ${it.id === currentId ? "active" : ""}`}
                        onClick={() => { onSelect(it.id); onClose(); }}>
                  <span className="m-hx-item-title">{it.title}</span>
                </button>
              ))}
            </section>
          ))}
        </div>

        <button className="m-hx-fab" aria-label="New chat" onClick={onClose}>
          <Icon name="plus" size={22}/>
        </button>
      </aside>
    </>
  );
};

// ---- Status bar ----
const StatusBar = () => (
  <div className="m-status">
    <span>9:41</span>
    <div className="m-dynamic-island"/>
    <div className="m-status-right">
      <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor">
        <rect x="0" y="6.5" width="2.6" height="4.5" rx="0.6"/>
        <rect x="4" y="4.5" width="2.6" height="6.5" rx="0.6"/>
        <rect x="8" y="2.3" width="2.6" height="8.7" rx="0.6"/>
        <rect x="12" y="0" width="2.6" height="11" rx="0.6"/>
      </svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor">
        <path d="M8 2.6c2.1 0 4 .8 5.4 2.2l1-1A9 9 0 0 0 8 1 9 9 0 0 0 1.6 3.8l1 1A7.6 7.6 0 0 1 8 2.6z"/>
        <path d="M8 6c1.1 0 2.1.4 2.8 1.2l1-1A6 6 0 0 0 8 4.6 6 6 0 0 0 4.2 6.2l1 1A4 4 0 0 1 8 6z"/>
        <circle cx="8" cy="9.4" r="1.4"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" strokeOpacity=".4" fill="none"/>
        <rect x="2" y="2" width="16" height="8" rx="1.6" fill="currentColor"/>
        <path d="M23 4v4c.7-.3 1.2-1 1.2-2S23.7 4.3 23 4z" fill="currentColor" fillOpacity=".5"/>
      </svg>
    </div>
  </div>
);

// ---- Composer ----
// Mirrors the webui composer's full feature set — STT (mic), TTS (voice
// replies), attach, send, interrupt — compacted into a phone-width sheet.
const MobileComposer = () => {
  const [text, setText] = React.useState("");
  const [micOn, setMicOn] = React.useState(true);   // STT — speech input
  const [tts, setTts] = React.useState(true);       // TTS — voice replies
  const [streaming, setStreaming] = React.useState(true);
  const taRef = React.useRef(null);

  // auto-grow textarea
  const onInput = (e) => {
    setText(e.target.value);
    const el = e.target;
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  };

  // when mic is on and the field is empty, show the live listening waveform
  const showWave = micOn && !text;

  return (
    <div className="m-dock">
      <div className={`m-composer ${micOn ? "listening" : ""} ${streaming ? "streaming" : ""}`}>

        {/* input zone — textarea, with a listening waveform overlay */}
        <div className="m-input-zone">
          <textarea
            ref={taRef}
            rows={1}
            value={text}
            onChange={onInput}
            placeholder={showWave ? "" : (streaming ? "Type to interrupt…" : "Message Sentient…")}
          />
          {showWave && (
            <div className="m-listening" aria-hidden="true">
              <span className="m-wave">
                {Array.from({ length: 11 }).map((_, i) => <i key={i}/>)}
              </span>
              <span className="m-listening-label">Listening…</span>
            </div>
          )}
        </div>

        {/* control row */}
        <div className="m-ctrls">
          <div className="m-ctrls-left">
            <button className={`m-tog mic ${micOn ? "on" : ""}`}
                    onClick={() => setMicOn(m => !m)}
                    aria-pressed={micOn}
                    aria-label={micOn ? "Mute microphone" : "Turn on microphone"}>
              <Icon name={micOn ? "mic" : "mic-off"} size={17}/>
            </button>
            <button className={`m-tog tts ${tts ? "on" : ""}`}
                    onClick={() => setTts(t => !t)}
                    aria-pressed={tts}
                    aria-label={tts ? "Mute voice replies" : "Enable voice replies"}>
              <Icon name={tts ? "speaker" : "speaker-off"} size={17}/>
            </button>
            <button className="m-tog" aria-label="Attach a file">
              <Icon name="attach" size={17}/>
            </button>
          </div>

          <span className="m-ctrls-spacer"/>

          <div className="m-action">
            {streaming ? (
              <button className="m-cbtn stop" onClick={() => setStreaming(false)} aria-label="Interrupt Sentient">
                <span className="sq"/>
              </button>
            ) : (
              <button className={`m-cbtn send ${text ? "ready" : ""}`} disabled={!text} aria-label="Send">
                <Icon name="send" size={16}/>
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

// ---- App ----
const MobileApp = () => {
  const [hxOpen, setHxOpen] = React.useState(false);
  const [currentId, setCurrentId] = React.useState("c1");
  const scrollRef = React.useRef(null);

  React.useEffect(() => {
    // start scrolled to the latest message
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, []);

  return (
    <div className="phone">
      <StatusBar/>
      <div className="m-app">
        <header className="m-topbar">
          <button className="m-iconbtn" onClick={() => setHxOpen(true)} aria-label="Past chats">
            <Icon name="menu" size={20}/>
          </button>
          <div className="m-brand">
            <SentientMark size={24}/>
            <span>Sentient</span>
          </div>
          <button className="m-iconbtn" aria-label="New chat">
            <Icon name="plus" size={20}/>
          </button>
        </header>

        <div className="m-scroll" ref={scrollRef}>
          <ChatView/>
        </div>

        <MobileComposer/>

        <MobileHistory
          open={hxOpen}
          onClose={() => setHxOpen(false)}
          currentId={currentId}
          onSelect={setCurrentId}
        />
      </div>
      <div className="m-home-ind"/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<MobileApp/>);
</script>
</body>
</html>

schemaVersion: 1
id: stage-stage-7-clients-review
type: combined-review
checkpoint: stage-review
stageId: stage-7-clients
scope:
  workItem: calendar-contract-v2
status: planned
required: true
attempt: 1
methods:
  - source scripts/env.sh && cd gateway/webui && bun run test:unit --
    src/services/calendar-api.test.ts
    src/components/calendar/calendar-view.test.tsx
  - source scripts/env.sh && cd gateway/webui && bun run typecheck
  - source scripts/env.sh && ./gradlew :shared:mobile-sdk:testDebugUnitTest
    --tests '*Calendar*' --tests '*PrivacyGuard*'
  - source scripts/env.sh && ./gradlew :shared:mobile-sdk:compileDebugKotlin
criteria:
  - Exact REST V2 parity across web and KMP
  - No PATCH/DELETE or V1 wire fallback
  - Source-level whole-series adapters preserve untouched UI compilation
  - Calendar payload and token privacy in client diagnostics
loop:
  state: rereviewing
  iteration: 1
  maxIterations: 3
  reviewerAgentId: 76324f5f-1898-4883-bf7d-81cb576d44a4
  reviewedCommit: 8bba3b8f8c792323a9f70d8fabdad7044ce22af6
  managerPrompt: "Repair both client findings and add exact-wire regressions. KMP
    update changes must represent three states for every nullable-clearable
    field—omitted/no change, concrete replacement, and explicit JSON null
    clear—independently of the shared Json explicitNulls=false setting.
    Introduce a typed tri-state patch representation and/or a CalendarChanges
    custom serializer that emits null keys only for explicit clears while
    preserving omission for unchanged description/end/group/recurrence; keep
    empty-array tag clearing and exact gateway field names. Verify every clear
    and omission against the golden gateway command, including whole-series
    convenience adapters, and ensure web/KMP parity. Also preserve coroutine
    cancellation throughout response parsing: never convert
    CancellationException into AuthError.Unknown; rethrow it before generic
    error mapping and add a test that cancellation raised during parser
    execution propagates. Rerun all Stage 7 web, KMP calendar/privacy, and
    compile checks."
  fixerAgentId: b24777b7-d4c3-4293-945f-80f07ce14b18
findings:
  - id: CAL-V2-KMP-NULL-CHANGES
    severity: high
    status: open
    criterion: KMP mutation supports V2 event-local update semantics and exact
      web/KMP wire parity, including explicit clears.
    location: shared/mobile-sdk/src/commonMain/kotlin/io/sentient/mobilesdk/calendar/CalendarModels.kt:185-196;
      shared/mobile-sdk/src/commonMain/kotlin/io/sentient/mobilesdk/settings/SettingsHttpSupport.kt:31-40;
      shared/mobile-sdk/src/commonMain/kotlin/io/sentient/mobilesdk/calendar/CalendarHttpClient.kt:144-150
    summary: CalendarChanges nullable clear fields are encoded with shared JSON
      configured as explicitNulls=false, so description/end/group/recurrence
      nulls are omitted instead of sent as JSON null. Mobile cannot issue the
      gateway's clear operations and silently sends a different command than
      web.
    blocking: true
  - id: CAL-V2-KMP-CANCEL-PARSE
    severity: low
    status: open
    criterion: CalendarHttpClient preserves cancellation behavior.
    location: shared/mobile-sdk/src/commonMain/kotlin/io/sentient/mobilesdk/settings/SettingsHttpSupport.kt:57-61
    summary: runCatching wraps the suspending response parser and catches
      CancellationException, converting cancellation during parsing into
      AuthError.Unknown. The declared tests cover timeout but not cancellation.
    blocking: false
result:
  verdict: fail
  report: report.md
  evidence: ../../evidence/stage-stage-7-clients-review/manifest.yaml

  managerPrompt: >-
    Address CAL-S1-004 in gateway/src/calendar/types.ts only (plus types.test.ts
    for tests). Valid UNTIL recurrences are rejected because the raw RFC UNTIL
    format and the wire ISO UNTIL format are compared as strings and never
    match.


    Root cause: parseRRule (~line 306) returns `until` as the raw RFC string
    ("20261231T235959Z") cast to UtcInstant, but UtcInstant is an ISO-8601
    instant contract and wireRRuleSchema.until uses `z.string().datetime({
    offset: true })` (ISO). The superRefine (~line 195) then compares
    `recurrence.rule.until !== rule.until` as strings, so the ISO wire value and
    the RFC parsed value never compare equal.


    Fix both, reusing parseRRule as the single RRULE validator:


    1. In parseRRule, convert the validated RFC UNTIL (matched by
    /^\d{8}T\d{6}Z$/) to a proper ISO UtcInstant before returning it as
    `value.until` (e.g. "20261231T235959Z" -> "2026-12-31T23:59:59.000Z"). Add a
    small helper (e.g. rfcUntilToIso) or use Date.UTC + toISOString. This makes
    the parsed domain value honor the UtcInstant (ISO) contract. Keep the stored
    recurrence.rrule as the raw RFC string (storage stays RFC); only the parsed
    `rule.until` becomes ISO.


    2. In the recurrence superRefine, compare `until` by instant equivalence,
    not string equality — wire clients may send "2026-12-31T23:59:59Z",
    "2026-12-31T23:59:59.000Z", or "2026-12-31T23:59:59+00:00", all valid under
    datetime({ offset: true }). Replace the `recurrence.rule.until !==
    rule.until` term with a normalized comparison: if both are undefined they
    match; if exactly one is undefined they mismatch; if both are defined,
    compare `new Date(recurrence.rule.until).getTime() === new
    Date(rule.until).getTime()`. Keep the freq/interval/count comparisons as-is
    (numbers/enums) and the byDay JSON.stringify comparison as-is. Do not weaken
    the malformed-RRULE or rrule/rule-disagreement rejections from CAL-S1-003.


    Add/adjust unit tests in src/calendar/types.test.ts:

    (a) parseRRule("FREQ=DAILY;UNTIL=20261231T235959Z").value.until equals
    "2026-12-31T23:59:59.000Z" (ISO);

    (b) a valid wire UNTIL recurrence with
    rrule="FREQ=DAILY;UNTIL=20261231T235959Z" and
    rule.until="2026-12-31T23:59:59.000Z" is ACCEPTED by calendarEventSchema
    (and equivalently by calendarRequestSchema wrapped in a create request);

    (c) the same valid UNTIL is also accepted when the wire until is
    "2026-12-31T23:59:59Z" (no milliseconds) and "2026-12-31T23:59:59+00:00"
    (offset form) — instant equivalence, not string match;

    (d) the existing rejections still hold: malformed rrule ("GIBBERISH"),
    unsupported key ("FREQ=WEEKLY;BYDAY=MO;BYMONTH=1"), and rrule/rule
    disagreement on COUNT.


    Constraints: stay within s1-domain-contracts scope (types.ts + types.test.ts
    only). If any existing parseRRule test asserted the raw RFC until string,
    update it to the ISO form. Keep `cd gateway && bun run typecheck` and `cd
    gateway && bun test src/access src/calendar/types src/calendar/e2e-helpers`
    green.

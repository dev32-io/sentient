  managerPrompt: >-
    Address CAL-S1-003 in gateway/src/calendar/types.ts only (plus types.test.ts
    for tests):


    The wire recurrence schema (~line 181-182) is `z.object({ rrule:
    z.string().min(1), rule: wireRRuleSchema })`. It accepts any non-empty
    string for the raw `rrule` and a parsed `rule` without validating the raw
    string through parseRRule or checking rrule↔rule consistency, so
    malformed/unsupported raw RRULEs (e.g. "GIBBERISH", "FREQ=WEEKLY;BYMONTH=1")
    and rrule/rule mismatches pass the wire boundary.


    Fix: add a `.superRefine` on the recurrence schema (or on
    calendarEventSchema where recurrence is present) that:

    1. Runs `parseRRule(recurrence.rrule)` and rejects (addIssue) when it
    returns {ok:false} — so malformed or unsupported-key raw RRULEs are rejected
    at the wire boundary, consistent with the CAL-S1-001 fix.

    2. When parseRRule succeeds, asserts the parsed `value` is consistent with
    the supplied `rule` (same freq, interval, count, until, byDay). Reject on
    any mismatch — the raw string and parsed rule must agree.

    Keep using the existing parseRRule and wireRRuleSchema; do not duplicate the
    subset logic — reuse parseRRule as the single source of RRULE validation. Do
    not change the Recurrence interface, the stored shape, or the wire envelope.


    Add focused unit tests in src/calendar/types.test.ts: (a) a calendar request
    with recurrence.rrule="GIBBERISH" is rejected; (b)
    recurrence.rrule="FREQ=WEEKLY;BYDAY=MO;BYMONTH=1" is rejected (unsupported
    key at the wire boundary); (c) recurrence where rrule and rule disagree
    (e.g. rrule says COUNT=6 but rule says count:5) is rejected; (d) a valid
    golden-fixture-shaped recurrence is accepted.


    Constraints: stay within s1-domain-contracts scope (types.ts + types.test.ts
    only). Keep `cd gateway && bun run typecheck` and `cd gateway && bun test
    src/access src/calendar/types src/calendar/e2e-helpers` green.
  fixerAgentId: f87fd53d-328d-434a-ac78-a4eee8eefda0

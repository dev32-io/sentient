    created event's id, and occurrenceStart/occurrenceEnd where applicable.

    - Assert the list entries are occurrence-shaped (have
    occurrenceId/baseEventId/occurrenceStart), confirming the list wire is
    occurrence-aware.


    Keep the test deterministic and fast (real SQLite is fine). Do not weaken
    the existing tests (bearer rejection, single-occurrence identity, GET
    base-shape, close-on-failure).


    Constraints: test-only (calendar.test.ts). Keep `cd gateway && bun run
    typecheck` and `cd gateway && bun test src/api/handlers/calendar` green.

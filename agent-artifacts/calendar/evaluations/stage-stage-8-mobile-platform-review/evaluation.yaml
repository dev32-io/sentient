  managerPrompt: |-
    Address the two remaining stage-8 blocking findings. The other five (CAL-MOBILE-001, CAL-ANDROID-001, CAL-IOS-001, CAL-MOBILE-002, CAL-ANDROID-002, CAL-MOBILE-004) are resolved — do not regress them.

    CAL-IOS-002 (high, repair-introduced) — iOS all-day Save ignores the edited date and returns the original event date. In ios/App/Settings/Calendar/CalendarViewModel.swift, `editedStart(from value:)` has `case .allDay(let value): return CalendarTime.AllDay(date: value.date)` — the `let value` binding SHADOWS the function parameter `value` (the edited input date string), so `value.date` reads the EXISTING event's all-day start date instead of the edited input. Fix: do not shadow the function parameter. Rename the case binding (e.g. `case .allDay(let original)`) and construct the new all-day start from the EDITED input string (the function parameter `value`), which is a `yyyy-MM-dd` date — e.g. `return CalendarTime.AllDay(date: value)`. The timed branch already correctly uses the edited input; make the all-day branch do the same. Verify: editing an all-day event's date and saving produces an event whose start date equals the edited date, not the original.

    CAL-MOBILE-003 (high) — Tests do not exercise actual screen/drawer navigation wiring or iOS ViewModel CRUD/use-case calls. The added tests cover helpers and state folds only. Fix in android/src/test/kotlin/io/sentient/android/settings/calendar/CalendarViewModelTest.kt and ios/Tests/CalendarViewModelTests.swift:
    - Android: add a test that the drawer calendar-open action (HistoryDrawer) navigates/wires to the settings/calendar route (assert the navigation wiring, not just a helper fold), AND tests that the ViewModel's create/update/delete operations actually invoke the corresponding use cases (verify the use-case calls happen, with the correct args — e.g. persistedId/baseEventId for mutations per CAL-MOBILE-004, and timed-update kind preservation per CAL-ANDROID-001). Use fakes/stubs for the use cases to assert invocation.
    - iOS: add tests that CalendarViewModel.create/update/delete actually invoke the underlying use cases (assert the calls, with correct args), including an all-day update that applies the EDITED date (pinning the CAL-IOS-002 fix — assert the saved all-day event's date is the edited one, not the original).

    Constraints: keep `./gradlew :android:testDebugUnitTest --tests '*Calendar*' && ./gradlew :android:compileDebugKotlin`, `./gradlew :shared:mobile-data:testDebugUnitTest --tests '*Calendar*' && ./gradlew :shared:mobile-data:compileDebugKotlin`, and the iOS check (`./gradlew :shared:mobile-data:assembleMobileDataXCFramework && xcodebuild -project ios/SentientApp.xcodeproj -scheme SentientApp -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.3.1' build && xcodebuild ... test`) green. JAVA_HOME is set; iOS 18.3.1 is the compatible runtime. Do not weaken existing tests or regress the resolved findings.
  fixerAgentId: cfaccda9-6a6f-4407-944b-184ff470d780

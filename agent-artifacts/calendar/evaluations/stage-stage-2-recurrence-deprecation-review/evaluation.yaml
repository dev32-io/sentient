        test 'does not count pre-DTSTART BYDAY candidates' asserts a Wed DTSTART
        with FREQ=WEEKLY;BYDAY=MO,FR;COUNT=10 yields exactly 10 occurrences.
        Residual risk: the re-reviewer did not formally re-confirm because a
        harness re-review firing stall prevented it from re-running on cf72fa0c;
        the fix is verified correct on the branch."
    - findingId: CAL-SCHEMA-001
      rationale: "Fixed by the fixer in cf72fa0c (verified by diff + tests): added
        `group` TEXT column to the events v1 baseline in schema.ts; new test
        asserts PRAGMA table_info(events) includes a 'group' column. The store
        CRUD (stage 3) will read/write it. Residual risk: re-reviewer did not
        formally re-confirm due to the harness re-review firing stall; fix
        verified correct on the branch."
    - findingId: CAL-STORE-001
      rationale: "Fixed by the fixer in cf72fa0c (verified by diff + tests):
        openCalendarStore now calls readUserVersion(db) before
        db.exec(CALENDAR_DDL) and skips DDL/WAL when recordedVersion >
        CALENDAR_SCHEMA_VERSION, so an ahead-of-binary db is left untouched
        (journal_mode not mutated); new test sets journal_mode=DELETE +
        user_version above schema version and asserts both are unchanged after
        open. Residual risk: re-reviewer did not formally re-confirm due to the
        harness re-review firing stall; fix verified correct on the branch."

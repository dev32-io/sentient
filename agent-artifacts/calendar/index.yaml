delivery:
  workingBranch: feature/calendar
  createdFromCommit: 89d38b25c50708e4fffabc843388856c5ef896b9
evaluations: []
executionStages:
  - id: stage-1-foundation
    tasks:
      - s1-resource-classes
      - s1-domain-contracts
      - s1-e2e-scaffolding
    checks:
      - cd gateway && bun run typecheck
      - cd gateway && bun test src/access src/calendar/types
        src/calendar/e2e-helpers
    mode: concurrent
    review:
      tier: medium
      focus:
        - Resource-class isolation and household path derivation
        - Wire schema, isAdult predicate, UTC timestamp representation, and
          golden fixtures
        - E2E scaffolding failure-safe cleanup and disposable-user isolation
  - id: stage-5-bootstrap-nudge
    tasks:
      - s5-phase-bootstrap
      - s5-nudge
    checks:
      - cd gateway && bun run typecheck
      - cd gateway && bun test src/bootstrap/phase-services src/calendar/nudge
    mode: sequential
    review:
      tier: medium
      focus:
        - orchestratorCfg.calendar config schema, config.yaml defaults, and
          old-config compatibility
        - Capability minting, store open and close on session disposal, and
          prompt-cache stability preserved across an in-session write
        - Nudge cap, deterministic drop order, empty-calendar omission,
          serving-tz rendering, and child/guest visibility
  - id: stage-2-recurrence-deprecation
    tasks:
      - s1-store-schema-factory
      - s2-expand-recurrence
      - s2-ha-deprecation
    checks:
      - cd gateway && bun run typecheck
      - cd gateway && bun test src/calendar/calendar-store
        src/calendar/expand-recurrence src/tools/home src/tools/tool-tier
        src/api/handlers/mcp-catalog
    mode: concurrent
    review:
      tier: medium
      focus:
        - CalendarStore capability gate, path isolation, close() lifecycle, and
          ahead-of-binary policy
        - expandRecurrence bounded subset, EXDATE/exception, all-day, and
          serving-timezone DST correctness
        - HA calendar tool removal across provider output, catalog, and role
          defaults (no profile migrator)
  - id: stage-4-rest-and-provider
    tasks:
      - s4-rest-api
      - s4-tool-provider
    checks:
      - cd gateway && bun run typecheck
      - cd gateway && bun test src/api/handlers/calendar
        src/bootstrap/product-tools src/bootstrap/product-tool-metadata
        src/tools/tool-broker
    mode: concurrent
    review:
      tier: medium
      focus:
        - REST authority from authenticated principal (configured household),
          serving-tz rendering, request-scoped close, and golden-fixture wire
          convergence
        - Pre-PDP household-write rejection (no permission.request, zero confirm
          calls, zero store calls) and tool tier/role reachability
  - id: stage-7-mobile-data
    tasks:
      - s7-mobile-data
    checks:
      - ./gradlew :shared:mobile-data:testDebugUnitTest --tests '*Calendar*' &&
        ./gradlew :shared:mobile-data:compileDebugKotlin
    mode: sequential
    review:
      tier: medium
      focus:
        - Stateless repository passthrough and explicit exported use-case
          interfaces for platform ViewModels
        - DI wiring exposes calendar to platform screens without
          restart-mutation assumptions
  - id: stage-8-mobile-platform
    tasks:
      - s8-android
      - s8-ios
    checks:
      - ./gradlew :android:app:testDebugUnitTest --tests '*Calendar*' &&
        ./gradlew :android:app:compileDebugKotlin
      - ./gradlew :shared:mobile-data:assembleXCFramework && xcodebuild -project
        ios/SentientApp.xcodeproj -scheme SentientApp -destination 'platform=iOS
        Simulator,name=iPhone 16' build && xcodebuild -project
        ios/SentientApp.xcodeproj -scheme SentientApp -destination 'platform=iOS
        Simulator,name=iPhone 16' test
    mode: concurrent
    review:
      tier: medium
      focus:
        - Route-scoped ViewModels consume shared use cases (not raw
          repositories) with state folding
        - Accessibility identifiers consistent with mobile E2E contracts
  - id: stage-6-clients
    tasks:
      - s6-web-ui
      - s6-mobile-sdk
    checks:
      - cd gateway/webui && bun run test:unit && bun run typecheck
      - ./gradlew :shared:mobile-sdk:testDebugUnitTest --tests '*Calendar*' &&
        ./gradlew :shared:mobile-sdk:compileDebugKotlin
    mode: concurrent
    review:
      tier: medium
      focus:
        - Web calendar REST client and view over /api/v1/calendar matching
          golden fixtures
        - Mobile SDK CalendarHttpClient wire shape, golden-fixture fidelity, and
          serving-tz representation
  - id: stage-3-store-crud
    tasks:
      - s3-store-writes
      - s3-store-reads
    checks:
      - cd gateway && bun run typecheck
      - cd gateway && bun test src/calendar/calendar-store
    mode: sequential
    review:
      tier: medium
      focus:
        - Household write adult-gate (adult|admin; no bypass) fail-fast with no
          prompt at the store (defense-in-depth)
        - Role-based visibility filtering at the query layer (child/guest omit
          adults)
        - UTC storage and serving-timezone recurrence expansion through the
          store path with EXDATE/exception application

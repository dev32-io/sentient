  - id: stage-1-foundation
    tasks:
      - s1-resource-classes
      - s1-domain-contracts
      - s1-store-schema-factory
    checks:
      - cd gateway && bun run typecheck
      - cd gateway && bun test src/access src/calendar/types
        src/calendar/calendar-store
    mode: sequential
    review:
      tier: medium
      focus:
        - Resource-class isolation and household path derivation
        - CalendarStore capability gate, path isolation, and forward-only
          migration ladder
  - id: stage-3-store-crud
    tasks:
      - s3-store-create
      - s3-store-update
      - s3-store-delete
      - s3-store-read-visibility
      - s3-store-list-filter
    checks:
      - cd gateway && bun run typecheck
      - cd gateway && bun test src/calendar/calendar-store
    mode: sequential
    review:
      tier: medium
      focus:
        - Household write adult-gate fail-fast with no prompt
        - Role-based visibility filtering at the query layer (children omit
          adults)
        - Recurrence expansion through the store path with EXDATE/exception
          application
  - id: stage-5-bootstrap-nudge
    tasks:
      - s5-phase-bootstrap
      - s5-nudge
    checks:
      - cd gateway && bun run typecheck
      - cd gateway && bun test src/bootstrap/phase-services src/calendar/nudge
    mode: sequential
    review:
      tier: medium
      focus:
        - Capability minting and store open per session with prompt-cache
          stability preserved
        - Nudge cap, deterministic drop order, empty-calendar omission, and
          child visibility

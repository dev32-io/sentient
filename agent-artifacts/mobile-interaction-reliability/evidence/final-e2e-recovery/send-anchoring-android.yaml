appId: io.dev32.sentient.debug
---
- launchApp
- runFlow:
    when: { visible: { id: "login-backend-setup" } }
    file: "../../../../qa/mobile/flows/android/_helpers/login.yaml"
- tapOn: { id: "new-chat" }
- extendedWaitUntil: { visible: { id: "composer-input" }, timeout: 5000 }
- tapOn: { id: "composer-input" }
- inputText: "QA_MARKER_ANDROID_ANCHOR"
- tapOn: { id: "chat-send" }
- hideKeyboard
- extendedWaitUntil: { visible: "QA_MARKER_ANDROID_ANCHOR", timeout: 10000 }
- takeScreenshot: "android-send-anchored"

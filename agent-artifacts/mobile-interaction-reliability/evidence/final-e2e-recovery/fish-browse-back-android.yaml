appId: io.dev32.sentient.debug
---
- launchApp
- tapOn: { id: "history-open" }
- extendedWaitUntil: { visible: { id: "settings-open" }, timeout: 5000 }
- tapOn: { id: "settings-open" }
- extendedWaitUntil: { visible: { id: "settings-screen" }, timeout: 5000 }
- tapOn: { id: "settings-cat-voice" }
- extendedWaitUntil: { visible: { id: "settings-voice-screen" }, timeout: 5000 }
- tapOn: { id: "settings-voice-fish-nav" }
- extendedWaitUntil: { visible: { id: "settings-voice-fish-screen" }, timeout: 5000 }
- tapOn: { id: "fish-search" }
- inputText: "Deep Voice English"
- extendedWaitUntil: { visible: { id: "fish-tile-98e364e9a41c465a9d4fdafc267f84ea" }, timeout: 10000 }
- takeScreenshot: "android-fish-results"
- tapOn: { id: "fish-clone-98e364e9a41c465a9d4fdafc267f84ea" }
- extendedWaitUntil: { visible: { id: "fish-clone-form" }, timeout: 5000 }
- takeScreenshot: "android-fish-editor"
- pressKey: BACK
- extendedWaitUntil: { visible: { id: "settings-voice-fish-screen" }, timeout: 5000 }
- takeScreenshot: "android-fish-back-restored"

appId: io.dev32.sentient.debug
---
- launchApp
- runFlow: { file: "../../../../qa/mobile/flows/ios/_helpers/login.yaml" }
- tapOn: { id: "new-chat" }
- extendedWaitUntil: { visible: { id: "composer-input" }, timeout: 5000 }
- tapOn: { id: "composer-input" }
- inputText: "QA_MARKER_IOS_ANCHOR"
- tapOn: { id: "chat-send" }
- tapOn: { point: "50%,50%" }
- extendedWaitUntil: { visible: "QA_MARKER_IOS_ANCHOR", timeout: 10000 }
- takeScreenshot: "ios-send-anchored"

appId: io.dev32.sentient.debug
---
- launchApp
- tapOn: { id: "history-open" }
- extendedWaitUntil: { visible: { id: "settings-open" }, timeout: 5000 }
- tapOn: { id: "settings-open" }
- extendedWaitUntil: { visible: { id: "settings-screen" }, timeout: 5000 }
- tapOn: { id: "settings-cat-voice" }
- extendedWaitUntil: { visible: { id: "settings-voice" }, timeout: 5000 }
- tapOn: { id: "settings-voice-fish-nav" }
- extendedWaitUntil: { visible: { id: "settings-voice-fish" }, timeout: 5000 }
- tapOn: { id: "settings-voice-fish-search" }
- inputText: "Deep Voice English"
- extendedWaitUntil: { visible: { id: "settings-voice-fish-row-98e364e9a41c465a9d4fdafc267f84ea" }, timeout: 10000 }
- takeScreenshot: "ios-fish-results"
- tapOn: { point: "90%,26%" }
- extendedWaitUntil: { visible: "Clone this voice", timeout: 5000 }
- takeScreenshot: "ios-fish-editor"
- pressKey: BACK
- extendedWaitUntil: { visible: { id: "settings-voice-fish" }, timeout: 5000 }
- takeScreenshot: "ios-fish-back-restored"

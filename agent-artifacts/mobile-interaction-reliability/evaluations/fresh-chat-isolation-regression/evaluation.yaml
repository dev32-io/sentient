methods:
  - "Context: New Chat is a critical conversation/data boundary: a locally clear
    timeline is insufficient if queued messages or model context still target
    the prior conversation."
  - "Context: Review the integrated shared/mobile implementation independently
    after fresh-chat-boundary lands. This is focused deterministic regression
    evaluation, not the runtime's final whole-branch E2E."
  - "Verify: Cold launch and every mobile New Chat entry use session.new
    intent=explicit while compatible implicit handling remains available only
    where intentionally required"
  - "Verify: One route entry cannot issue duplicate preparation through
    recomposition or ViewModel recreation"
  - "Verify: A pre-READY or immediate outbound message remains queued until the
    fresh session.draft attachment and cannot flush to the old session id"
  - "Verify: First-message mint reanchors to a distinct durable session and
    old/new test projections remain isolated"
  - "Verify: No client-side draft persistence, composer loading gate, production
    mutation, or content logging was introduced"
  - "Verify: Existing tests and mobile flows no longer assert
    resume-on-cold-launch behavior"
  - "Run: ./gradlew :shared:mobile-sdk:allTests :shared:mobile-data:allTests
    :android:testDebugUnitTest"
  - "Run: bun test gateway/src/session-handlers/ws-handlers-routing.test.ts"
  - "Run: git diff --check"

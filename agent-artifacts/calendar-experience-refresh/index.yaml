delivery:
  workingBranch: feature/calendar
  createdFromCommit: 6bdc28cc5f5086af23537527b1c8e83a310d016c
evaluations: []
executionStages:
  - id: calendar-core-foundations
    tasks:
      - mobile-sqldelight-foundation
      - mobile-calendar-projections
      - web-calendar-projections
      - web-calendar-data-controller
    checks:
      - source scripts/env.sh && ./gradlew :shared:mobile-data:allTests
      - source scripts/env.sh && bun run --filter @sentient/webui test:unit &&
        bun run --filter @sentient/webui typecheck
      - source scripts/env.sh && git diff --check
    mode: concurrent
    review:
      tier: medium
      focus:
        - Pinned SQLDelight/Kotlin 2.3.10 compatibility, source-set-correct
          dependencies, schema/migration/namespace correctness, and commonMain
          purity
        - Deterministic Day/Week/Month/Year, raw temporal, filter, overflow, and
          navigation contracts
        - Explicit all-scope complete web pagination, account/backend preference
          isolation, and calendar-view.tsx remaining untouched
        - Exact reference vocabulary is checked directly against
          sentient-design/HANDOFF.md, sentient-design/brand-spec.md,
          sentient-design/design/web/calendar.html,
          sentient-design/components/web/sentient-web.js,
          sentient-design/design/mobile/calendar.html, and
          sentient-design/components/mobile/sentient-mobile.js without importing
          prototype data
  - id: calendar-store-and-web-components
    tasks:
      - mobile-calendar-store
      - web-calendar-canvas
      - web-calendar-shell-filters
      - web-calendar-preview
      - web-calendar-editor
    checks:
      - source scripts/env.sh && ./gradlew :shared:mobile-data:allTests
      - source scripts/env.sh && bun run --filter @sentient/webui test:unit &&
        bun run --filter @sentient/webui typecheck && bun run --filter
        @sentient/webui build
      - source scripts/env.sh && git diff --check
    mode: concurrent
    review:
      tier: medium
      focus:
        - Atomic observable SQLDelight store, raw RFC3339 temporal round-trip,
          and namespace/purge behavior
        - Web leaf components remain isolated through a typed CalendarWorkspace
          canvas slot, component-scoped CSS, shared calendar-time helpers, and
          explicit draft/capability ownership
        - Exact web comparison uses sentient-design/HANDOFF.md,
          sentient-design/brand-spec.md,
          sentient-design/design/web/calendar.html, and
          sentient-design/components/web/sentient-web.js at 1440x1000, 1024x900,
          768x900, and 390x844
        - 900px sidebar collapse, seven-column no-overflow correction,
          viewport-safe preview, Dialog inert/safe dismissal, complete V2
          editor, focus, semantics, and reduced motion
  - id: calendar-experience-and-web-assembly
    tasks:
      - mobile-calendar-read-coordinator
      - web-calendar-assembly
    checks:
      - source scripts/env.sh && ./gradlew :shared:mobile-data:allTests
        :android:assembleDebug
      - source scripts/env.sh && bun run --filter @sentient/webui test:unit &&
        bun run --filter @sentient/webui typecheck && bun run --filter
        @sentient/webui build
      - source scripts/env.sh && git diff --check
    mode: concurrent
    review:
      tier: medium
      focus:
        - Shared cache-first complete pagination, stale-while-revalidate,
          coalescing, cancellation, one coherent StateFlow, source-compatible
          SettingsComponent/factory exposure, and Android intermediate
          compilation
        - Complete web route, authenticated capability projection, Dialog
          safety, exact V2 mutations, and deterministic local-only disposable
          fixture/cleanup adapter
        - Production web is compared by the final E2E agent through Playwright
          MCP against sentient-design/design/web/calendar.html and
          sentient-design/components/web/sentient-web.js at exactly 1440x1000,
          1024x900, 768x900, and 390x844
        - Web CAL-UX-001..007, 013, and 014 use unique synthetic data,
          guaranteed cleanup, semantic/keyboard/focus evidence, and documented
          deviations without adding a separate browser-runner project or
          mandatory screen-reader gate
  - id: mobile-calendar-policies
    tasks:
      - mobile-calendar-retention-offline
      - mobile-calendar-mutations
    checks:
      - source scripts/env.sh && ./gradlew :shared:mobile-sdk:allTests
        :shared:mobile-data:allTests
      - source scripts/env.sh && ./gradlew
        :shared:mobile-data:assembleMobileDataDebugXCFramework
      - source scripts/env.sh && git diff --check
    mode: sequential
    review:
      tier: medium
      focus:
        - Nonblocking adjacent prefetch, transactional twelve-month LRU,
          explicit cached/unavailable offline states, recovery, and isolation
        - mobile-calendar-mutations follows and depends on the finalized
          retention/offline state in this sequential stage
        - Exact V2 create/edit/delete recurrence, revision, raw offset-bearing
          originalStart, conflict, permission, and temporal semantics
        - Offline writes produce no optimistic success, queue row, or hidden
          retry, and shared state supports
          sentient-design/design/mobile/calendar.html plus
          sentient-design/components/mobile/sentient-mobile.js without native
          policy
  - id: mobile-platform-sessions
    tasks:
      - android-calendar-database-session
      - ios-calendar-database-session
    checks:
      - source scripts/env.sh && ./gradlew :shared:mobile-data:allTests
        :android:testDebugUnitTest :android:assembleDebug
      - source scripts/env.sh && scripts/ios-setup.sh
      - source scripts/env.sh && xcodebuild test -project
        ios/SentientApp.xcodeproj -scheme SentientApp -destination 'platform=iOS
        Simulator,name=iPhone 16,OS=latest'
      - source scripts/env.sh && git diff --check
    mode: concurrent
    review:
      tier: medium
      focus:
        - Explicit AuthUser.userId plus normalized backend identity reaches both
          session boundaries before namespace derivation
        - Android app-private AndroidSqliteDriver and iOS Application Support
          NativeSqliteDriver/Data Protection
        - Authenticated-session lifetime, cancellation-before-purge,
          non-cancelled bounded purge/switch, close, and account/backend
          isolation
        - No platform types in commonMain, native cache/policy duplication,
          SQLCipher, external storage, content-bearing paths, or diagnostics
  - id: mobile-viewmodel-adapters
    tasks:
      - android-calendar-viewmodel
      - ios-calendar-viewmodel
    checks:
      - source scripts/env.sh && ./gradlew :android:testDebugUnitTest
        :android:assembleDebug
      - source scripts/env.sh && ./gradlew
        :shared:mobile-data:assembleMobileDataDebugXCFramework && xcodegen
        generate && xcodebuild test -project ios/SentientApp.xcodeproj -scheme
        SentientApp -destination 'platform=iOS Simulator,name=iPhone 16'
      - source scripts/env.sh && git diff --check
    mode: concurrent
    review:
      tier: medium
      focus:
        - Thin Android StateFlow and iOS SKIE AsyncSequence mapping with correct
          cancellation
        - Exact intent/identity forwarding and no native
          pagination/filter/cache/prefetch/mutation policy
        - Every supported sentient-design mobile view/filter/overlay/freshness
          state is representable
        - Native date/time controls preserve shared all-day/timezone/recurrence
          identity
  - id: native-calendar-components
    tasks:
      - android-calendar-surface
      - android-calendar-overlays
      - ios-calendar-surface
      - ios-calendar-overlays
    checks:
      - source scripts/env.sh && ./gradlew :android:testDebugUnitTest
        :android:assembleDebug
      - source scripts/env.sh && ./gradlew
        :shared:mobile-data:assembleMobileDataDebugXCFramework && xcodegen
        generate && xcodebuild test -project ios/SentientApp.xcodeproj -scheme
        SentientApp -destination 'platform=iOS Simulator,name=iPhone 16'
      - source scripts/env.sh && git diff --check
    mode: concurrent
    review:
      tier: medium
      focus:
        - Leaf Compose/SwiftUI components are controlled and side-effect free
        - "Exact sentient-design mobile geometry at 390x844 and 430x932: 58 top
          bar, 16 inset, 44 targets, 46 view controls, 64 rows, 42 Month cells,
          complete Year, 84% sheets"
        - Horizontal filters, agenda rows, floating bar, overlays, focus,
          Dynamic Type/font scale, safe areas, and reduced motion
        - Prototype fixed data and member/color/place/reminder semantics are
          absent
  - id: calendar-delivery-completion
    tasks:
      - android-calendar-assembly
      - ios-calendar-assembly
    checks:
      - source scripts/env.sh && ./gradlew :shared:mobile-data:allTests
        :android:testDebugUnitTest :android:assembleDebug
      - source scripts/env.sh && ./gradlew
        :shared:mobile-data:assembleMobileDataDebugXCFramework && xcodegen
        generate && xcodebuild test -project ios/SentientApp.xcodeproj -scheme
        SentientApp -destination 'platform=iOS Simulator,name=iPhone 16'
      - source scripts/env.sh && ./qa/mobile/run-e2e.sh all --tags calendar
      - source scripts/env.sh && git diff --check
    mode: concurrent
    review:
      tier: medium
      focus:
        - Android and iOS are thin shared-StateFlow consumers with no duplicated
          cache/network/policy
        - Production screens match sentient-design/design/mobile/calendar.html
          and sentient-design/components/mobile/sentient-mobile.js at 390x844
          and 430x932
        - Day/Week/Month/Year, filters, sheets, cache/offline/recovery,
          mutations, conflicts, permissions, temporal behavior, accessibility,
          safe areas, and reduced motion
        - Calendar-tagged Maestro coverage maps Android/iOS portions of approved
          CAL-UX-001 through CAL-UX-014 using local synthetic data only

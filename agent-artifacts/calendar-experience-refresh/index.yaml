  - id: calendar-core-foundations
    tasks:
      - mobile-sqldelight-foundation
      - mobile-calendar-projections
      - web-calendar-projections
      - web-calendar-data-controller
    checks:
      - source scripts/env.sh && ./gradlew :shared:mobile-data:allTests
      - source scripts/env.sh && bun run --filter @sentient/webui test:unit &&
        bun run --filter @sentient/webui typecheck
      - source scripts/env.sh && git diff --check
    mode: concurrent
    review:
      tier: medium
      focus:
        - SQLDelight schema/migration/namespace correctness and commonMain purity
        - Deterministic Day/Week/Month/Year, temporal, filter, overflow, and
          navigation contracts
        - Explicit all-scope complete web pagination and account/backend
          preference isolation
        - Exact sentient-design paths are used only as interaction/visual
          vocabulary and prototype data is not imported

schemaVersion: 1
id: stage-calendar-store-and-web-components-review
type: combined-review
checkpoint: stage-review
stageId: calendar-store-and-web-components
scope:
  workItem: calendar-experience-refresh
status: planned
required: true
attempt: 1
methods:
  - source scripts/env.sh && ./gradlew :shared:mobile-data:allTests
  - source scripts/env.sh && bun run --filter @sentient/webui test:unit && bun
    run --filter @sentient/webui typecheck && bun run --filter @sentient/webui
    build
  - source scripts/env.sh && git diff --check
criteria:
  - Atomic observable SQLDelight store, raw RFC3339 temporal round-trip, and
    namespace/purge behavior
  - Web leaf components remain isolated through a typed CalendarWorkspace canvas
    slot, component-scoped CSS, shared calendar-time helpers, and explicit
    draft/capability ownership
  - Exact web comparison uses sentient-design/HANDOFF.md,
    sentient-design/brand-spec.md, sentient-design/design/web/calendar.html, and
    sentient-design/components/web/sentient-web.js at 1440x1000, 1024x900,
    768x900, and 390x844
  - 900px sidebar collapse, seven-column no-overflow correction, viewport-safe
    preview, Dialog inert/safe dismissal, complete V2 editor, focus, semantics,
    and reduced motion
loop:
  state: rereviewing
  iteration: 1
  maxIterations: 6
  reviewerAgentId: 859b5d12-4f87-4f1c-92f3-1c44f6bc66d7
  reviewedCommit: ae6359d4d2a2db86922ad0deb01e156e2713dc9c
  managerPrompt: Resolve all six findings before approval. Make CalendarCacheStore
    emit rows and metadata from one coherent replacement generation (no
    cross-replacement combine window) and add a deterministic
    concurrency/regression test. Define one shared typed CalendarWorkspace
    canvas-slot contract and wire projections/actions through it without
    shell/leaf shape drift. Ensure every narrow-view interactive canvas control
    has at least a 44x44 effective target without causing horizontal overflow.
    For edits, always use the event's immutable original scope for resource
    lookup; do not present scope as editable unless Calendar V2 supports an
    explicit scope-change command (retain create-time scope selection). Produce
    the required exact-reference visual and scrollWidth evidence at 1440x1000,
    1024x900, 768x900, and 390x844, including seven-column no-overflow and
    collapsed controls. Also correct Week/Month/Year weekday placement and
    labels to consistently honor locale and weekStartsOn, with focused tests.
    Run all stage checks and return for automatic re-review.
  fixerAgentId: baa80db0-6a7c-4fb4-94c3-979aa35cb9fc

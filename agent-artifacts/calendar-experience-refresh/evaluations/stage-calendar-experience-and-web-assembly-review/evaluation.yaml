schemaVersion: 1
id: stage-calendar-experience-and-web-assembly-review
type: combined-review
checkpoint: stage-review
stageId: calendar-experience-and-web-assembly
scope:
  workItem: calendar-experience-refresh
status: planned
required: true
attempt: 0
methods:
  - source scripts/env.sh && ./gradlew :shared:mobile-data:allTests
    :android:assembleDebug
  - source scripts/env.sh && bun run --filter @sentient/webui test:unit && bun
    run --filter @sentient/webui typecheck && bun run --filter @sentient/webui
    build
  - source scripts/env.sh && git diff --check
criteria:
  - Shared cache-first complete pagination, stale-while-revalidate, coalescing,
    cancellation, one coherent StateFlow, source-compatible
    SettingsComponent/factory exposure, and Android intermediate compilation
  - Complete web route, authenticated capability projection, Dialog safety,
    exact V2 mutations, and deterministic local-only disposable fixture/cleanup
    adapter
  - Production web is compared by the final E2E agent through Playwright MCP
    against sentient-design/design/web/calendar.html and
    sentient-design/components/web/sentient-web.js at exactly 1440x1000,
    1024x900, 768x900, and 390x844
  - Web CAL-UX-001..007, 013, and 014 use unique synthetic data, guaranteed
    cleanup, semantic/keyboard/focus evidence, and documented deviations without
    adding a separate browser-runner project or mandatory screen-reader gate
loop:
  state: planned
  iteration: 0
  maxIterations: 6

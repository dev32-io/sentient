schemaVersion: 1
id: stage-calendar-delivery-completion-review
type: combined-review
checkpoint: stage-review
stageId: calendar-delivery-completion
scope:
  workItem: calendar-experience-refresh
status: planned
required: true
attempt: 0
methods:
  - source scripts/env.sh && ./gradlew :shared:mobile-data:allTests
    :android:testDebugUnitTest :android:assembleDebug
  - source scripts/env.sh && scripts/ios-setup.sh
  - source scripts/env.sh && xcodebuild test -project ios/SentientApp.xcodeproj
    -scheme SentientApp -destination 'platform=iOS Simulator,name=iPhone
    16,OS=latest'
  - source scripts/env.sh && git diff --check
criteria:
  - Android and iOS production code remains thin over shared StateFlow with no
    duplicated cache/network/policy
  - Production screens compare directly to sentient-design/HANDOFF.md,
    sentient-design/brand-spec.md, sentient-design/design/mobile/calendar.html,
    and sentient-design/components/mobile/sentient-mobile.js at exact logical
    390x844 and 430x932 profiles
  - Day/Week/Month/Year, filters, sheets, cache/offline/recovery, mutations,
    conflicts, permissions, temporal behavior, semantic accessibility, safe
    areas, and reduced motion
  - The runtime's final E2E agent—not concurrent task checks—runs Android then
    iOS sequentially with direct Maestro/existing fault controls, unique
    disposable fixture namespaces, guaranteed cleanup, and CAL-UX-001..014
    evidence; no qa/mobile runner extension or mandatory actual
    assistive-technology session is required
loop:
  state: planned
  iteration: 0
  maxIterations: 6

schemaVersion: 1
id: stage-native-calendar-components-review
type: combined-review
checkpoint: stage-review
stageId: native-calendar-components
scope:
  workItem: calendar-experience-refresh
status: planned
required: true
attempt: 1
methods:
  - source scripts/env.sh && ./gradlew :android:testDebugUnitTest
    :android:assembleDebug
  - source scripts/env.sh && scripts/ios-setup.sh
  - source scripts/env.sh && xcodebuild test -project ios/SentientApp.xcodeproj
    -scheme SentientApp -destination 'platform=iOS Simulator,name=iPhone
    16,OS=latest'
  - source scripts/env.sh && git diff --check
criteria:
  - Leaf Compose/SwiftUI components are controlled and side-effect free
  - Exact mobile comparison uses sentient-design/HANDOFF.md,
    sentient-design/brand-spec.md, sentient-design/design/mobile/calendar.html,
    and sentient-design/components/mobile/sentient-mobile.js at logical 390x844
    and 430x932
  - Reference geometry includes 58 top bar, 16 inset, 44 targets, 46 view
    controls, 64 rows, 42 Month cells, complete Year, 84% sheets, filters,
    agenda, floating bar, focus, scaling, safe areas, and reduced motion
  - Prototype fixed data and member/color/place/reminder semantics are absent;
    semantic accessibility inspection is required but an actual
    assistive-technology session is not a stage gate
loop:
  state: rereviewing
  iteration: 1
  maxIterations: 6
  reviewerAgentId: e184954f-9a37-4d26-ba46-976d4f074b12
  reviewedCommit: 2a49b8333aec3abd67d5599864a9b31427a8b835
  managerPrompt: "Resolve all six findings. Remove the separate styled Day canvas
    on Android and iOS so Day is the focused agenda presentation specified by
    the mobile reference. Delete native Month-to-Day policy duplication: Android
    must forward one shared date-selection intent and render the resulting
    shared view/date state, not emit redundant date plus view callbacks. Drive
    editor submit enablement from authoritative shared validation/mutation state
    wherever available; Android Save must be disabled for blank/invalid drafts
    and missing required recurrence scope, and iOS must select canCreate versus
    canEdit according to editor mode rather than aggregate availability. While
    submission is active, disable every draft-mutating, scope, save, delete, and
    dismissal control that could race; also harden the shared reducer to ignore
    editor mutation intents that would move SUBMITTING back to EDITING until the
    operation settles. Make Android overlay press feedback honor
    LocalCalendarReducedMotion with immediate/non-tween behavior. Add focused
    controlled-component and state-race tests for each correction, preserve 44px
    targets and exact reference geometry, run all stage checks, and return for
    automatic re-review."
  fixerAgentId: d5ce6ecf-7f23-4236-ad22-12e0ec621a8c
findings:
  - id: F-001
    severity: high
    status: open
    criterion: Day view is a focused agenda without an empty canvas shell
    location: android/.../CalendarComponents.kt:161-175,438-466;
      ios/.../CalendarScaffold.swift:52-68;
      ios/.../CalendarCanvasViews.swift:9-48
    summary: Both native Day views render a separate styled canvas before the agenda.
    blocking: true
  - id: F-002
    severity: high
    status: open
    criterion: No duplicated shared calendar policy in composables
    location: android/.../CalendarSurfaceModels.kt:29-33;
      android/.../CalendarComponents.kt:169-172
    summary: Android duplicates Month-to-Day policy and emits redundant date plus
      view callbacks.
    blocking: true
  - id: F-003
    severity: high
    status: open
    criterion: Android enabled/disabled editor actions are correct
    location: android/.../CalendarOverlayModels.kt:39-50;
      android/.../CalendarOverlays.kt:247-320,529-605
    summary: Save enablement ignores blank/invalid drafts and required
      recurrence-scope selection.
    blocking: true
  - id: F-004
    severity: high
    status: open
    criterion: iOS controls reflect role-specific mutation availability
    location: ios/.../CalendarOverlayModels.swift:39-50;
      ios/.../CalendarOverlays.swift:57-70
    summary: Save uses aggregate isAvailable instead of canCreate/canEdit for the
      active editor mode.
    blocking: true
  - id: F-005
    severity: high
    status: open
    criterion: Submitting state remains stable
    location: ios/.../CalendarOverlays.swift:244-280;
      shared/.../CalendarExperience.kt:475-505
    summary: Draft controls remain enabled while submitting and can reset shared
      phase to EDITING, allowing racing submissions.
    blocking: true
  - id: F-006
    severity: low
    status: open
    criterion: Android overlays honor reduced motion
    location: android/.../CalendarOverlays.kt:762-770
    summary: Overlay press scale always uses a timed tween without consulting
      LocalCalendarReducedMotion.
    blocking: false
result:
  verdict: fail
  report: report.md
  evidence: ../../evidence/stage-native-calendar-components-review/manifest.yaml

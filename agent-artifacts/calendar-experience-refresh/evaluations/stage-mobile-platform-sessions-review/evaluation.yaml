  reviewerAgentId: d5de5b93-2a3c-4516-ac61-c04c190fa469
  reviewedCommit: 43ffe303b02d8ffda10c525be9a7b7094a42db10
  managerPrompt: Resolve the remaining teardown/publication race on both
    platforms. Initialization must build into locally owned resources and
    transfer ownership to the session only through one atomic,
    generation-checked publish step under the same lifecycle synchronization
    used by close/account replacement. Teardown must mark the generation
    closed/replaced before capturing resources and must coordinate with any
    in-progress initializer; if publish loses the race, the initializer itself
    must purge/close its unpublished driver/experience and may not update shared
    manager/session state. A successor session must never observe or inherit
    predecessor resources. Avoid a separate final liveness check followed by an
    unsynchronized assignment. Add deterministic barrier tests that pause
    initialization immediately before publish, then exercise logout, auth
    expiry, account switch, backend switch, and successor creation; prove the
    late resource is closed, no stale state emits, and only the successor
    runtime is exposed. Run all stage checks and return for re-review.
  fixerAgentId: 58385ebc-d5b2-4aca-a937-00eb688f0a3d

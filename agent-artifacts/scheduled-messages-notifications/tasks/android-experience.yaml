schemaVersion: 1
id: android-experience
title: Add native Android scheduling inbox and push integration
dependsOn:
  - shared-mobile-data
description: Build thin Android screens and OS adapters over the shared mobile
  APIs. Users manage once/recurring messages, enable personal calendar
  reminders, see compact session cards, register this installation for push, and
  choose hidden/content previews. Card and notification activation reuse
  Routes.chat(sessionId). Preserve normal chat/session lifecycle and use
  existing Sentient components/tokens without inline hardcoded styling.
scope: >-
  Own Android app sources, `android/build.gradle.kts`, and required entries in
  `gradle/libs.versions.toml`. Key integration points are settings/components
  and new settings pages, calendar screen/overlays, `nav/Routes.kt`,
  `AppNavHost.kt`, `SettingsNav.kt`, MainActivity, UserSessionManager, and new
  `notifications/` OS adapters. Do not change shared KMP source, gateway, iOS,
  canonical shared tokens, or root protocol schemas. Consume shared data/secure
  revoke-store/pending-unlink interfaces as provided; keep native code
  responsible only for permission, FCM token callbacks, notification
  presentation, and navigation.


  Component inventory:
  SettingsTopBar/SettingsEditChrome/SettingsCard/GroupHeader for structure;
  RowToggle/RowSelect/RowSegmented and existing editors for forms; existing
  past-chat row/card composition for previews; SentientTheme, Material3 semantic
  roles and LocalTokens for every visual value. Any missing semantic control
  must be a minimal reusable token-backed component in the established Android
  library, not page-local styling.
delivery: >-
  - Add typed settings/inbox routes and lifecycle-aware ViewModels using shared
  state/actions. Support once absolute/delay, recurring timezone forms, next-run
  and pending/error states, pause/resume/delete, and actor-personal calendar
  reminder toggles/times. Cards show bounded previews with no unread state or
  full-message feed; selection resumes the existing session.

  - Add notification permission/channel setup, explicit registration, token
  refresh, accurate denied/unconfigured/failure states, independent device
  privacy, disable/unlink and system-settings link. Use version-catalog FCM
  dependencies and ignored/external project configuration; unconfigured
  development builds must still build and run with push unavailable, not pretend
  to register.

  - Safely parse only the supported session destination from
  notification/deep-link input, retain it through cold launch/login, and pass
  through existing session membership checks. Do not trust a link as authority
  or accept an arbitrary gateway URL from a payload. Preserve the existing
  user-owned connection lifecycle; do not manufacture a new session when
  resuming.

  - Wire shared pending-unlink coordination before authenticated teardown: local
  logout always completes, failed/offline unlink shows a durable truthful
  warning, only revoke-only cleanup authority survives, and a replacement
  account's push stays pending until old binding disable is acknowledged. Reset
  stale destination/account state safely without affecting other installations.

  - Every added visual maps to the named shared component/theme roles; no
  literal colors/spacing/radii/type/motion or local palette. New calendar
  controls should be extracted into reusable token-backed components so existing
  calendar compositions only embed them. Changed-file component/token review is
  a required acceptance check, including files outside automated foundation
  coverage. Preserve font scaling, contrast, 48dp theme-derived targets and
  native back/accessibility behavior.

  - Add deterministic native boundary/state/navigation tests for permission
  outcomes, malformed/wrong-account links, cold-login target retention, token
  replacement, offline logout warning/retry and binding fence. Core lifecycle
  assertions must run without real FCM delivery; actual device receipt alone may
  be skipped and identified as unverified. Commit only source/config templates,
  not Google credentials or generated signing artifacts.
checks:
  - source scripts/env.sh && ./gradlew :android:testDebugUnitTest
    :android:assembleDebug :android:lintDebug
  - source scripts/env.sh && bun run design:foundation:check && git diff --check
assignment:
  agent: implementer
  tier: medium
  rationale: A single Android owner avoids navigation/lifecycle conflicts and
    keeps platform APIs out of shared data; existing components and shared
    contracts bound the feature work.

schemaVersion: 1
id: product-tool-catalog
title: Govern tools by stable product group
status: draft
dependsOn: []
execution:
  resourceClaims:
    - product-tool-catalog
    - tool-permission-migration
    - product-tool-provider-composition
    - tool-settings-contract
  assignment:
    agent: implementer
    tier: high
    rationale: Authorization migration and shared provider composition establish the
      safety and parallelization boundary for every later contribution.
assembly:
  stageId: 01-governance
  intermediateState: complete
verification:
  timing: task
  methods: []
  taskChecks:
    - source scripts/env.sh && bun test
      gateway/src/tools/resolve-tool-permission.test.ts
      gateway/src/tools/tool-broker.test.ts
      gateway/src/api/handlers/mcp-catalog.test.ts
      gateway/src/admin/web-tools-migrator.test.ts
      gateway/src/bootstrap/product-tool-providers.test.ts
    - source scripts/env.sh && bun --cwd gateway/webui test --run
      src/components/settings/panes/tool-permission-patch.test.ts
    - source scripts/env.sh && ./gradlew :shared:mobile-sdk:allTests
    - source scripts/env.sh && bun run typecheck
    - source scripts/env.sh && git diff --check
  rationale: Verify the contribution at its declared task boundary.

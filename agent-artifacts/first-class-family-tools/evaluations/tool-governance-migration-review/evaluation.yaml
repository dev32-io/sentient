      gateway restrictions remain effective; advanced tools default off
    location: gateway/src/bootstrap/create-mcp-host.ts:149-158;
      gateway/src/api/handlers/mcp-catalog.ts:132-135;
      gateway/config.yaml:792-821
    summary: Delegated gateway-hosted tools bypass product permissions and their
      advanced gateway group is hidden from settings.
    blocking: true

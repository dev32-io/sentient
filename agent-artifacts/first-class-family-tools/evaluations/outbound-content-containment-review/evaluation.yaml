    location: gateway/src/mcp-host/delegated-broker.ts:180-193;
      gateway/src/tools/tool-broker.ts:801-878
    summary: Delegated web passages and results now share the configured per-user
      inbound gate and fail closed on scanner failure.
    blocking: true

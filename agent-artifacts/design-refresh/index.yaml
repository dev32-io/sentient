integrationUnits: []
delivery:
  workingBranch: feature/design-refresh
  createdFromCommit: 653f6cee3bd06491b547c63ec04d88f21f4f147f
evaluations: []
executionStages:
  - id: contracts-and-harness
    tasks:
      - design-foundation-v2
      - capture-protocol-gateway
      - verification-inventory-harness
    checks:
      - bun run design:foundation:check
      - bun run design:inventory:check
      - bun run --filter '@sentient/protocol' test:unit
      - bun run --filter '@sentient/web-sdk' test:unit
      - cd gateway && bun test src/session-handlers/ws-handlers-audio.test.ts
        src/session-handlers/stt-session.test.ts
        src/session-handlers/command-mediator.test.ts
      - bun run typecheck
      - git diff --check
    mode: concurrent
    review:
      mode: required
      tier: medium
      focus:
        - Exact v2 values/projection determinism and Android v1 compatibility
        - Capture commit/cancel security, terminal races, legacy wire
          compatibility, and content-free logs
        - Closed inventory, loopback-only fixtures, prototype-reference-only
          enforcement, and text-only E2E safety
  - id: platform-foundations
    tasks:
      - kmp-capture-semantics
      - web-foundation-components
      - ios-foundation-components
    checks:
      - bun run design:foundation:check
      - bun run design:avatar:verify
      - bun run --filter '@sentient/webui' test:unit
      - bun run --filter '@sentient/webui' typecheck
      - bun run --filter '@sentient/webui' build
      - ./gradlew :shared:mobile-sdk:allTests :shared:mobile-data:allTests
        :android:assembleDebug :android:testDebugUnitTest
      - ./scripts/ios-setup.sh
      - xcodebuild test -project ios/SentientApp.xcodeproj -scheme SentientApp
        -destination 'platform=iOS Simulator,name=iPhone 16'
      - git diff --check
    mode: concurrent
    review:
      mode: required
      tier: medium
      focus:
        - Web and Swift native component semantics, accessibility, exact
          material recipes, and no prototype runtime dependencies
        - Platform-owned Rive packaging/fallback and exact three-state adapter
        - KMP capture serialization, frame/terminal ordering, lifecycle
          cancellation, and unchanged Android UI
  - id: product-surfaces
    tasks:
      - web-shell-auth-history
      - web-settings-shell-trust
      - web-settings-soul-voice
      - web-chat-messages
      - web-chat-composer
      - web-calendar-refresh
      - ios-identity-startup-history
      - ios-settings-system
      - ios-voice-library
      - ios-calendar-refresh
  - id: ios-chat-integration
    tasks:
      - ios-chat-composer
  - id: integration-closure
    tasks:
      - refresh-integration-closure
  - id: ios-final-products
    tasks:
      - ios-access-account-admin

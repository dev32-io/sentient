delivery:
  workingBranch: feature/design-refresh
  createdFromCommit: 653f6cee3bd06491b547c63ec04d88f21f4f147f
  executionStartCommit: d662a65baa030e8f29757bac0a260b3b1f948a7f
evaluations:
  - id: stage-contracts-and-harness-review
    path: evaluations/stage-contracts-and-harness-review/evaluation.yaml
  - id: stage-platform-foundations-review
    path: evaluations/stage-platform-foundations-review/evaluation.yaml
executionStages:
  - id: contracts-and-harness
    tasks:
      - design-foundation-v2
      - capture-protocol-gateway
      - verification-inventory-harness
    checks:
      - bun run design:foundation:check
      - bun run design:inventory:check
      - bun run --filter '@sentient/protocol' test:unit
      - bun run --filter '@sentient/web-sdk' test:unit
      - cd gateway && bun test src/session-handlers/ws-handlers-audio.test.ts
        src/session-handlers/stt-session.test.ts
        src/session-handlers/command-mediator.test.ts
      - bun run typecheck
      - git diff --check
    mode: concurrent
    review:
      mode: required
      tier: medium
      focus:
        - Exact v2 values/projection determinism and Android v1 compatibility
        - Capture commit/cancel security, terminal races, legacy wire
          compatibility, and content-free logs
        - Closed inventory, loopback-only fixtures, prototype-reference-only
          enforcement, and text-only E2E safety
  - id: platform-foundations
    tasks:
      - kmp-capture-semantics
      - web-foundation-components
      - ios-foundation-components
    checks:
      - bun run design:foundation:check
      - bun run design:avatar:verify
      - bun run --filter '@sentient/webui' test:unit
      - bun run --filter '@sentient/webui' typecheck
      - bun run --filter '@sentient/webui' build
      - ./gradlew :shared:mobile-sdk:allTests :shared:mobile-data:allTests
        :android:assembleDebug :android:testDebugUnitTest
      - ./scripts/ios-setup.sh
      - xcodebuild test -project ios/SentientApp.xcodeproj -scheme SentientApp
        -destination 'platform=iOS Simulator,name=iPhone 16'
      - git diff --check
    mode: concurrent
    review:
      mode: required
      tier: medium
      focus:
        - Web and Swift native component semantics, accessibility, exact
          material recipes, and no prototype runtime dependencies
        - Platform-owned Rive packaging/fallback and exact three-state adapter
        - KMP capture serialization, frame/terminal ordering, lifecycle
          cancellation, and unchanged Android UI
  - id: product-surfaces
    tasks:
      - web-shell-auth-history
      - web-settings-shell-trust
      - web-settings-soul-voice
      - web-chat-messages
      - web-chat-composer
      - web-calendar-refresh
      - ios-identity-startup-history
      - ios-settings-system
      - ios-voice-library
      - ios-calendar-refresh
    checks:
      - bun run --filter '@sentient/webui' test:unit
      - bun run --filter '@sentient/webui' typecheck
      - bun run --filter '@sentient/webui' build
      - bun run --filter '@sentient/gateway' test:unit
      - ./gradlew :shared:mobile-sdk:allTests :shared:mobile-data:allTests
      - ./scripts/ios-setup.sh
      - xcodebuild test -project ios/SentientApp.xcodeproj -scheme SentientApp
        -destination 'platform=iOS Simulator,name=iPhone 16'
      - bun run design:inventory:check
      - git diff --check
    mode: concurrent
    review:
      mode: required
      tier: medium
      focus:
        - Complete reachable-state coverage, component-boundary compliance, and
          no domain/session/persistence regressions
        - Web text/chat/task/composer/capture separation, Settings trust
          cleanup, Calendar behavior, keyboard and 200% zoom
        - iOS Rive/startup readiness/History, native Settings/Voice/Calendar
          navigation and large Dynamic Type
        - No audio E2E, no network manipulation, and no prototype runtime imports
  - id: ios-final-products
    tasks:
      - ios-chat-composer
      - ios-access-account-admin
    checks:
      - ./gradlew :shared:mobile-sdk:allTests :shared:mobile-data:allTests
      - ./scripts/ios-setup.sh
      - xcodebuild test -project ios/SentientApp.xcodeproj -scheme SentientApp
        -destination 'platform=iOS Simulator,name=iPhone 16'
      - bun run design:inventory:check
      - git diff --check
    mode: concurrent
    review:
      mode: required
      tier: medium
      focus:
        - Native iOS chat projection/outbox/task/permission/composer capture
          invariants with fake-only audio proof
        - Setup/login/update/account/admin/secret privacy and authorization
        - Startup readiness integration, native NavigationStack/sheets/alerts,
          and larger Dynamic Type
  - id: integration-closure
    tasks:
      - refresh-integration-closure
    mode: sequential
    checks:
      - bun run design:foundation:check
      - bun run design:avatar:verify
      - bun run design:inventory:check
      - bun run ci
      - bun run test:int
      - ./gradlew :shared:mobile-sdk:allTests :shared:mobile-data:allTests
        :android:assembleDebug :android:testDebugUnitTest
      - ./scripts/ios-setup.sh
      - xcodebuild test -project ios/SentientApp.xcodeproj -scheme SentientApp
        -destination 'platform=iOS Simulator,name=iPhone 16'
      - test -z "$(git diff --name-only 653f6cee3bd06491b547c63ec04d88f21f4f147f
        -- android/src/main/kotlin android/src/main/res | grep . || true)"
      - git diff --check
    review:
      mode: required
      tier: medium
      focus:
        - Whole-feature reachable-state completeness and removal of parallel
          legacy visuals
        - Static token/component boundaries, byte-identical platform-owned Rive
          assets, and exact identity mapping
        - Trust/privacy/no-op/task/Interrupt/session ownership contracts
        - No Android UI changes, no production/audio/network-disruption
          verification, and readiness for E2E-001..009

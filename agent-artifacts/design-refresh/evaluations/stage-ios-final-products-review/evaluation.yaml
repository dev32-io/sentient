    state-machine regressions for Auto + typed draft + explicit Auto exit,
    normal held release, and held system cancellation/interruption. Do not use
    microphone/STT/TTS/audio in proof.
  fixerAgentId: 521880fc-1b68-4709-930d-f6e16b971157

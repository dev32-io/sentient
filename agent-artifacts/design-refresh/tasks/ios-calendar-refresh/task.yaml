schemaVersion: 1
id: ios-calendar-refresh
title: Refresh the complete native iOS Calendar workspace and overlays
status: ready
dependsOn:
  - ios-foundation-components
  - verification-inventory-harness
execution:
  resourceClaims: []
  assignment:
    agent: implementer
    tier: medium
    rationale: Calendar is a complex but isolated native product composite with
      established lifecycle and surface tests.
assembly:
  stageId: product-surfaces
  intermediateState: complete
verification:
  timing: task
  methods: []
  taskChecks:
    - ./scripts/ios-setup.sh
    - xcodebuild test -project ios/SentientApp.xcodeproj -scheme SentientApp
      -destination 'platform=iOS Simulator,name=iPhone 16'
    - ./gradlew :shared:mobile-sdk:allTests :shared:mobile-data:allTests
    - bun run design:inventory:check
    - git diff --check
  rationale: Verify the contribution at its declared task boundary.
